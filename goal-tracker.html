<!doctype html>
<!--
  Goal Tracker — single-file edition
  Versioning: MAJOR.MINOR.PATCH (semver.org). Bump APP_VERSION below on every change.
    PATCH = bug fix · MINOR = new feature · MAJOR = breaks old backups or data

  Changelog
  0.9.0  Completed tasks stay in the Tasks tab (dimmed, at the bottom); task notes; confirm before deleting; archive with full task details and "delete completed"
  0.8.0  "Defeat" sound when unchecking; dashboard shows only today's tasks and habits (one-tap check for today)
  0.7.0  Hide habits already done today; completion sounds with on/off switch; version shown in Data tab
  0.6.0  Habit history calendar: toggle any past day, ★ marks the creation day, best streak
  0.5.1  Fix: empty (0 KB) exports on Android; copy/paste backup as text; clearer import errors
  0.5.0  (Installable PWA edition only, no single-file changes)
  0.4.0  Edit tasks, goals and habits after creation
  0.3.0  Dashboard: activity heatmap, tasks chart, goal rings, habit consistency
  0.2.0  Light/dark/auto theme, warmer palette
  0.1.0  First build: tasks, weekly/monthly/annual/5-year goals, habits, IndexedDB storage, JSON export/import
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goal Tracker</title>
<script>try{const t=localStorage.getItem('gt-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#faf5ee;--card:#fffcf7;--text:#2e2520;--muted:#7d6f64;--line:#ece1d3;--accent:#c4612a;--on-accent:#fff;--soft:#f8e7d8;--ok:#6a8f3a;--on-ok:#fff;--warn:#c98418;--bad:#b9412f;--banner-bg:#fbe8c8;--banner-text:#6b3f12;--radius:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#251e19;--text:#f2e8dd;--muted:#ab9a8a;--line:#3b3129;--accent:#ec9659;--on-accent:#1b1612;--soft:#3d2a1d;--ok:#9cbf6e;--on-ok:#1b1612;--warn:#e6ad4f;--bad:#e8775f;--banner-bg:#4a3318;--banner-text:#f6d9a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#251e19;--text:#f2e8dd;--muted:#ab9a8a;--line:#3b3129;--accent:#ec9659;--on-accent:#1b1612;--soft:#3d2a1d;--ok:#9cbf6e;--on-ok:#1b1612;--warn:#e6ad4f;--bad:#e8775f;--banner-bg:#4a3318;--banner-text:#f6d9a8;color-scheme:dark}
.top .right{display:flex;align-items:center;gap:10px}
#themeBtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}

body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

<body>
<header><div class="wrap">
  <div class="top"><h1>Goal Tracker</h1><div class="right"><span class="date" id="today"></span><button id="themeBtn" type="button"></button></div></div>
  <nav id="nav">
    <button data-view="dash" class="on">Dashboard</button>
    <button data-view="tasks">Tasks</button>
    <button data-view="goals">Goals</button>
    <button data-view="habits">Habits</button>
    <button data-view="data">Data</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<input type="file" id="importFile" accept="application/json" hidden>
<div id="tip" role="tooltip"></div>
<dialog id="editDlg" class="dlg"></dialog>

<script>
/* ---------- Database (IndexedDB) ---------- */
const STORES=['tasks','goals','habits','logs'];
const DB={
  db:null, mem:null,
  open(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open('goal-tracker-db',1);
        r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
        r.onsuccess=()=>{this.db=r.result;res(true)};
        r.onerror=()=>{this.useMemory();res(false)};
      }catch(e){this.useMemory();res(false)}
    });
  },
  useMemory(){this.mem={};STORES.forEach(s=>this.mem[s]=new Map())},
  req(store,mode,fn){
    if(this.mem){return Promise.resolve(fn(null))}
    return new Promise((res,rej)=>{
      const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));
      t.oncomplete=()=>res(r&&'result' in r?r.result:undefined);t.onerror=()=>rej(t.error);
    });
  },
  all(s){return this.mem?Promise.resolve([...this.mem[s].values()]):this.req(s,'readonly',st=>st.getAll())},
  put(s,v){if(this.mem){this.mem[s].set(v.id,v);return Promise.resolve()}return this.req(s,'readwrite',st=>st.put(v))},
  del(s,id){if(this.mem){this.mem[s].delete(id);return Promise.resolve()}return this.req(s,'readwrite',st=>st.delete(id))},
  clear(s){if(this.mem){this.mem[s].clear();return Promise.resolve()}return this.req(s,'readwrite',st=>st.clear())}
};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=()=>ds(new Date());
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);
  return `${y}-W${pad(w)}`;
}
const HORIZONS={weekly:'Weekly',monthly:'Monthly',annual:'Annual',five:'5-Year'};
const PARENT={weekly:'monthly',monthly:'annual',annual:'five',five:null};
function currentPeriod(h){
  const d=new Date(),y=d.getFullYear();
  return h==='weekly'?isoWeek(d):h==='monthly'?ds(d).slice(0,7):h==='annual'?String(y):`${y}-${y+4}`;
}
const fmtDate=s=>{if(!s)return'';const d=new Date(s+'T00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};

/* ---------- State ---------- */
const S={tasks:[],goals:[],habits:[],logs:new Set(),view:'dash',horizon:'weekly',goalScope:'current',taskFilter:'open',persistent:true};

async function load(){
  S.persistent=await DB.open();
  const [t,g,h,l]=await Promise.all(STORES.map(s=>DB.all(s)));
  S.tasks=t;S.goals=g;S.habits=h;S.logs=new Set(l.map(x=>x.id));
}

/* ---------- Logic ---------- */
const goalById=id=>S.goals.find(g=>g.id===id);
function progress(g,seen=new Set()){
  if(g.done)return 100;
  if(seen.has(g.id))return g.progress||0; seen.add(g.id);
  const tasks=S.tasks.filter(t=>t.goalId===g.id);
  if(tasks.length)return Math.round(tasks.filter(t=>t.done).length/tasks.length*100);
  const kids=S.goals.filter(c=>c.parentId===g.id);
  if(kids.length)return Math.round(kids.reduce((a,c)=>a+progress(c,seen),0)/kids.length);
  return g.progress||0;
}
function progressSource(g){
  if(g.done)return'completed';
  const n=S.tasks.filter(t=>t.goalId===g.id).length;
  if(n)return`from ${n} linked task${n>1?'s':''}`;
  const k=S.goals.filter(c=>c.parentId===g.id).length;
  if(k)return`from ${k} sub-goal${k>1?'s':''}`;
  return'manual';
}
const logged=(hid,date)=>S.logs.has(hid+'|'+date);
function streak(h){
  let d=new Date();if(!logged(h.id,ds(d)))d=addDays(d,-1);
  let n=0;while(logged(h.id,ds(d))){n++;d=addDays(d,-1)}return n;
}
function weekCount(h){
  const d=new Date();const dow=(d.getDay()+6)%7;let n=0;
  for(let i=0;i<=dow;i++)if(logged(h.id,ds(addDays(d,-i))))n++;return n;
}
function rate30(h){let n=0;for(let i=0;i<30;i++)if(logged(h.id,ds(addDays(new Date(),-i))))n++;return Math.round(n/30*100)}

function fmtWhen(ts){if(!ts)return'';const d=new Date(ts);const y=d.getFullYear()!==new Date().getFullYear();

function fmtDay(s){return s?new Date(s+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}):'—'}

function dayButtons(h,n=7){

const goalOptions=(sel,filter=()=>true)=>`<option value="">— No goal —</option>`+

/* ---------- Dashboard visuals ---------- */
function dayActivity(){
  const m={};
  for(const id of S.logs){const d=id.slice(id.lastIndexOf('|')+1);(m[d]||(m[d]={h:0,t:0})).h++}
  for(const t of S.tasks){if(t.done&&t.doneAt){const d=ds(new Date(t.doneAt));(m[d]||(m[d]={h:0,t:0})).t++}}
  return m;
}
function heatmapCard(){
  const act=dayActivity();const now=new Date();const today=TODAY();
  const monday=addDays(now,-((now.getDay()+6)%7));const start=addDays(monday,-25*7);
  let cells='',months='',total=0,activeDays=0,max=0;
  for(let i=0;i<182;i++){const k=ds(addDays(start,i));const a=act[k];if(a)max=Math.max(max,a.h+a.t)}
  let lastMonth=-1;
  for(let w=0;w<26;w++){
    const colStart=addDays(start,w*7);
    const firstOfMonth=[...Array(7)].map((_,j)=>addDays(colStart,j)).find(d=>d.getDate()===1);
    const mo=firstOfMonth||(w===0?colStart:null);
    if(mo&&mo.getMonth()!==lastMonth){months+=`<span>${mo.toLocaleDateString(undefined,{month:'short'})}</span>`;lastMonth=mo.getMonth()}else months+='<span></span>';
    for(let j=0;j<7;j++){
      const d=addDays(colStart,j);const k=ds(d);
      if(k>today){cells+='<i class="fut"></i>';continue}
      const a=act[k]||{h:0,t:0};const c=a.h+a.t;total+=c;if(c)activeDays++;
      const lvl=c?Math.max(1,Math.ceil(c/max*4)):0;
      const label=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
      cells+=`<i class="l${lvl} ${k===today?'tod':''}" data-tip="${label}: ${a.h} habit check-in${a.h===1?'':'s'}, ${a.t} task${a.t===1?'':'s'} done"></i>`;
    }
  }
  return `<div class="card vcard"><div class="vhead"><div class="title">Activity</div><div class="sub">Last 26 weeks</div></div>
    <div class="hm-months">${months}</div><div class="hm" role="img" aria-label="Activity heatmap: ${total} actions on ${activeDays} days">${cells}</div>
    <div class="hm-foot"><div class="meta"><span><b>${total}</b> actions</span><span><b>${activeDays}</b> active days</span></div>
    <div class="hm-legend">Less <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> More</div></div></div>`;
}
function ringsCard(){
  const r=26,C=2*Math.PI*r;
  const rings=Object.entries(HORIZONS).map(([h,l])=>{
    const gs=S.goals.filter(g=>g.horizon===h&&g.period===currentPeriod(h));
    const p=gs.length?Math.round(gs.reduce((a,g)=>a+progress(g),0)/gs.length):0;
    const done=gs.filter(g=>g.done).length;
    return `<div class="ring" data-tip="${l} (${esc(currentPeriod(h))}): ${gs.length?p+'% average across '+gs.length+' goal'+(gs.length>1?'s':''):'no goals set'}">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="rt" cx="32" cy="32" r="${r}"/>
      ${gs.length?`<circle class="rv" cx="32" cy="32" r="${r}" stroke-dasharray="${(p/100*C).toFixed(1)} ${C.toFixed(1)}"/>`:''}
      <text class="num" x="32" y="37" text-anchor="middle">${gs.length?p+'%':'–'}</text></svg>
      <div class="lbl">${l}</div><div class="cnt">${gs.length?done+'/'+gs.length+' done':'none yet'}</div></div>`;
  }).join('');
  return `<div class="card vcard"><div class="vhead"><div class="title">Goal progress</div><div class="sub">Current periods</div></div><div class="rings">${rings}</div></div>`;
}
function tasksChartCard(){
  const days=14,W=300,H=130,pt=14,pb=20,gap=2;const bw=W/days;
  const counts=[...Array(days)].map((_,i)=>{const d=addDays(new Date(),i-(days-1));const k=ds(d);return{d,k,n:S.tasks.filter(t=>t.done&&t.doneAt&&ds(new Date(t.doneAt))===k).length}});
  const max=Math.max(1,...counts.map(c=>c.n));const sum=counts.reduce((a,c)=>a+c.n,0);
  const base=H-pb,ph=base-pt;
  const bars=counts.map((c,i)=>{
    const x=i*bw+gap/2,w=bw-gap,h=c.n?Math.max(4,c.n/max*ph):3,y=base-h,rr=Math.min(4,w/2,h);
    const path=`M${x},${base}V${y+rr}Q${x},${y} ${x+rr},${y}H${x+w-rr}Q${x+w},${y} ${x+w},${y+rr}V${base}Z`;
    const lab=c.d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    const ax=(i%2===(days-1)%2)?`<text class="ax" x="${x+w/2}" y="${H-5}" text-anchor="middle">${c.d.getDate()}</text>`:'';
    return `<g data-tip="${lab}: ${c.n} task${c.n===1?'':'s'} completed"><rect class="hit" x="${i*bw}" y="0" width="${bw}" height="${base}"/><path class="bar ${c.n?'':'zero'}" d="${path}"/>${ax}</g>`;
  }).join('');
  return `<div class="card vcard barchart"><div class="vhead"><div class="title">Tasks completed</div><div class="sub">${sum} in 14 days</div></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed per day, last 14 days, ${sum} total">${bars}<line class="base" x1="0" x2="${W}" y1="${base}" y2="${base}"/></svg></div>`;
}
function consistencyCard(){
  if(!S.habits.length)return `<div class="card vcard"><div class="vhead"><div class="title">Habit consistency</div><div class="sub">Last 30 days</div></div><div class="empty">Add habits to see consistency.</div></div>`;
  const rows=[...S.habits].map(h=>({h,r:rate30(h),s:streak(h)})).sort((a,b)=>b.r-a.r).map(({h,r,s})=>
    `<div class="hbar" data-tip="${esc(h.name)}: ${r}% of the last 30 days, current streak ${s}"><div class="top"><span>${esc(h.name)}</span><span>${r}% · 🔥${s}</span></div>
     <div class="track"><div class="fill" style="width:${r}%"></div></div></div>`).join('');
  return `<div class="card vcard"><div class="vhead"><div class="title">Habit consistency</div><div class="sub">Last 30 days</div></div><div class="hbars">${rows}</div></div>`;
}

function viewTasks(){

    <div class="meta">A short chime when you complete a task or check off a habit.</div>
    <div class="row"><button class="ghost" data-action="toggle-sound" aria-pressed="${Sound.on}">${Sound.on?'🔊 Sounds on':'🔇 Sounds off'}</button></div>
  </div>`;
}

function render(){
  const v={dash:viewDash,tasks:viewTasks,goals:viewGoals,habits:viewHabits,data:viewData,archive:viewArchive}[S.view]||viewDash;
  $('#app').innerHTML=(S.persistent?'':`<div class="banner">This browser blocked storage — data will be lost on reload. Use Export to save it.</div>`)+v();
  const nv=S.view==='archive'?'data':S.view;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===nv));
}

/* ---------- Edit dialog ---------- */
const dlg=$('#editDlg');
function parentOpts(h,sel,selfId){
  const ph=PARENT[h];if(!ph)return null;
  return `<option value="">— None —</option>`+S.goals.filter(g=>g.horizon===ph&&g.id!==selfId&&(!g.done||g.id===sel))
    .map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.title)} (${esc(g.period)})</option>`).join('');
}
function parentField(h,sel,selfId){
  const o=parentOpts(h,sel,selfId);
  return o?`<label>Supports which ${HORIZONS[PARENT[h]].toLowerCase()} goal?</label><select name="parentId">${o}</select>`:'';
}
function openEdit(kind,id){
  let body='',title='';
  if(kind==='task'){const t=S.tasks.find(x=>x.id===id);title='Edit task';
    const goals=`<option value="">— No goal —</option>`+S.goals.filter(g=>!g.done||g.id===t.goalId).map(g=>`<option value="${g.id}" ${g.id===t.goalId?'selected':''}>${HORIZONS[g.horizon]} · ${esc(g.title)}</option>`).join('');
    body=`<label>Title</label><input type="text" name="title" value="${esc(t.title)}" required>
      <div class="two"><div><label>Due date</label><input type="date" name="due" value="${t.due||''}"></div>
      <div><label>Priority</label><select name="priority">${[['low','Low'],['med','Medium'],['high','High']].map(([v,l])=>`<option value="${v}" ${t.priority===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
      <label>Linked goal</label><select name="goalId">${goals}</select>
      <label>Notes</label><textarea name="notes" placeholder="Details, links, anything…">${esc(t.notes)}</textarea>
      <label class="check"><input type="checkbox" name="done" ${t.done?'checked':''}> Completed</label>`;
  }
  if(kind==='goal'){const g=goalById(id);title='Edit goal';
    body=`<label>Title</label><input type="text" name="title" value="${esc(g.title)}" required>
      <div class="two"><div><label>Horizon</label><select name="horizon">${Object.entries(HORIZONS).map(([k,l])=>`<option value="${k}" ${g.horizon===k?'selected':''}>${l}</option>`).join('')}</select></div>
      <div><label>Period</label><input type="text" name="period" value="${esc(g.period)}" required></div></div>
      <div id="parentWrap">${parentField(g.horizon,g.parentId,g.id)}</div>
      <label>Notes</label><textarea name="notes">${esc(g.notes)}</textarea>
      <label class="check"><input type="checkbox" name="done" ${g.done?'checked':''}> Completed</label>`;
  }
  if(kind==='habit'){const h=S.habits.find(x=>x.id===id);title='Edit habit';
    body=`<label>Name</label><input type="text" name="name" value="${esc(h.name)}" required>
      <label>Target</label><select name="target">${[7,6,5,4,3,2,1].map(n=>`<option value="${n}" ${(h.target||7)===n?'selected':''}>${n}× per week</option>`).join('')}</select>`;
  }
  dlg.innerHTML=`<form method="dialog" data-edit="${kind}" data-id="${id}"><h3>${title}</h3>${body}
    <div class="dlg-actions"><button class="ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="save">Save</button></div></form>`;
  dlg.showModal();const f=dlg.querySelector('input[type=text]');f.focus();f.select();
}
dlg.addEventListener('change',e=>{
  if(e.target.name!=='horizon')return;const f=e.target.form;const g=goalById(f.dataset.id);
  const h=e.target.value;$('#parentWrap').innerHTML=parentField(h,g.horizon===h?g.parentId:'',g.id);
  const p=f.elements.period;if(h!==g.horizon)p.value=currentPeriod(h);else p.value=g.period;
});
dlg.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-edit]');if(!f)return;e.preventDefault();
  if(e.submitter&&e.submitter.value==='cancel'){dlg.close();return}
  const v=Object.fromEntries(new FormData(f));const id=f.dataset.id;const kind=f.dataset.edit;
  if(kind==='task'){const t=S.tasks.find(x=>x.id===id);const done=!!v.done;
    Object.assign(t,{title:v.title.trim(),due:v.due||null,priority:v.priority,goalId:v.goalId||null,notes:(v.notes||'').trim()});
    if(done!==t.done){t.done=done;t.doneAt=done?Date.now():null;Sound.play(done?'task':'undo')}
    await DB.put('tasks',t)}
  if(kind==='goal'){const g=goalById(id);const old=g.horizon;
    Object.assign(g,{title:v.title.trim(),horizon:v.horizon,period:v.period.trim(),parentId:v.parentId||null,notes:(v.notes||'').trim(),done:!!v.done});
    if(old!==g.horizon){ // keep the hierarchy valid: unlink sub-goals that no longer sit one level below
      for(const c of S.goals.filter(c=>c.parentId===g.id&&PARENT[c.horizon]!==g.horizon)){c.parentId=null;await DB.put('goals',c)}
    }
    await DB.put('goals',g)}
  if(kind==='habit'){const h=S.habits.find(x=>x.id===id);Object.assign(h,{name:v.name.trim(),target:+v.target});await DB.put('habits',h)}
  dlg.close();render();
});

/* ---------- Habit history dialog ---------- */
let cal={id:null,y:0,m:0};
function habitDates(h){return[...S.logs].filter(k=>k.startsWith(h.id+'|')).map(k=>k.slice(k.lastIndexOf('|')+1)).sort()}
function bestStreak(h){let best=0,run=0,prev=null;
  for(const d of habitDates(h)){const t=new Date(d+'T00:00');run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=t}return best}
function openHabit(id){const d=new Date();cal={id,y:d.getFullYear(),m:d.getMonth()};drawHabit();dlg.showModal();}
function drawHabit(){
  const h=S.habits.find(x=>x.id===cal.id);if(!h){dlg.close();return}
  const now=new Date(),today=TODAY(),createdK=h.created?ds(new Date(h.created)):null;
  const first=new Date(cal.y,cal.m,1),lead=(first.getDay()+6)%7,days=new Date(cal.y,cal.m+1,0).getDate();
  let cells='<span></span>'.repeat(lead),monthCount=0;
  for(let d=1;d<=days;d++){
    const k=ds(new Date(cal.y,cal.m,d)),on=logged(h.id,k),star=k===createdK;if(on)monthCount++;
    cells+=`<button type="button" class="cd ${on?'on':''} ${k===today?'tod':''}" ${k>today?'disabled':`data-action="cal-toggle" data-date="${k}"`} aria-pressed="${on}" aria-label="${k}${star?', habit created':''}">${d}${star?'<i class="star" aria-hidden="true">★</i>':''}</button>`;
  }
  const wk=[...Array(7)].map((_,i)=>`<span>${new Date(2024,0,1+i).toLocaleDateString(undefined,{weekday:'narrow'})}</span>`).join(''); // 1 Jan 2024 was a Monday
  const atNow=cal.y===now.getFullYear()&&cal.m===now.getMonth();
  const created=createdK?`<span><i class="star-inline">★</i> Created ${fmtDate(createdK)}${createdK.slice(0,4)!==today.slice(0,4)?', '+createdK.slice(0,4):''}</span>`:'';
  dlg.innerHTML=`<div class="hist">
    <div class="hist-top"><h3>${esc(h.name)}</h3><button type="button" class="icon" data-action="dlg-close" aria-label="Close">✕</button></div>
    <div class="hist-stats"><div><b>🔥 ${streak(h)}</b><span>Current</span></div><div><b>${bestStreak(h)}</b><span>Best streak</span></div><div><b>${habitDates(h).length}</b><span>Total days</span></div><div><b>${rate30(h)}%</b><span>Last 30</span></div></div>
    <div class="cal-nav"><button type="button" class="icon" data-action="cal-month" data-d="-1" aria-label="Previous month">‹</button><b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button type="button" class="icon" data-action="cal-month" data-d="1" ${atNow?'disabled':''} aria-label="Next month">›</button></div>
    <div class="cal cal-wk">${wk}</div><div class="cal">${cells}</div>
    <div class="meta cal-foot"><span>${monthCount} day${monthCount===1?'':'s'} this month</span>${created}</div>
    <p class="meta">Tap any past day to check it off or undo it.</p></div>`;
}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-action]')){e.preventDefault();e.target.click()}});

/* ---------- Version ---------- */
const APP_VERSION='0.9.0';

/* ---------- Completion sounds (synthesised, no audio files) ---------- */
const Sound={
  ctx:null,on:true,
  load(){try{this.on=localStorage.getItem('gt-sound')!=='off'}catch(e){}},
  set(v){this.on=v;try{localStorage.setItem('gt-sound',v?'on':'off')}catch(e){}},
  play(kind){
    if(!this.on)return;
    try{
      const C=this.ctx||(this.ctx=new (window.AudioContext||window.webkitAudioContext)());
      if(C.state==='suspended')C.resume();
      // task: bright rising C–E–G · habit: softer two-note "pop" · undo: falling G–E♭–C "womp", last note sags
      const S_={task:{n:[[1046.5,0],[1318.5,.07],[1568,.14]],len:.38,vol:.16},
                habit:{n:[[784,0],[1174.7,.08]],len:.38,vol:.16},
                undo:{n:[[392,0],[311.1,.16],[261.6,.32]],len:.5,vol:.13,sag:true}}[kind]||null;
      if(!S_)return;
      const t0=C.currentTime+.01;
      S_.n.forEach(([f,dt],i)=>{
        const o=C.createOscillator(),g=C.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t0+dt);
        const last=i===S_.n.length-1,len=last&&S_.sag?S_.len*1.6:S_.len;
        if(last&&S_.sag)o.frequency.exponentialRampToValueAtTime(f*.82,t0+dt+len);
        g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(S_.vol,t0+dt+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+len);
        o.connect(g).connect(C.destination);o.start(t0+dt);o.stop(t0+dt+len+.05);
      });
    }catch(e){}
  }
};
Sound.load();
try{S.hideDone=localStorage.getItem('gt-hide-done')==='1'}catch(e){S.hideDone=false}

/* ---------- Actions ---------- */
async function toggleLog(hid,date){
  const id=hid+'|'+date;
  if(S.logs.has(id)){S.logs.delete(id);await DB.del('logs',id);Sound.play('undo')}
  else{S.logs.add(id);await DB.put('logs',{id,habitId:hid,date});Sound.play('habit')}
}
const actions={
  'see-overdue'(){S.taskFilter='overdue';S.view='tasks';scrollTo(0,0)},
  async 'archive-task'(el){const t=S.tasks.find(x=>x.id===el.dataset.id);t.archived=true;t.archivedAt=Date.now();await DB.put('tasks',t)},
  async 'unarchive'(el){const t=S.tasks.find(x=>x.id===el.dataset.id);t.archived=false;t.archivedAt=null;await DB.put('tasks',t)},
  'open-archive'(){S.view='archive';scrollTo(0,0)},
  'back-data'(){S.view='data';scrollTo(0,0)},
  async 'purge-archived'(){
    const gone=S.tasks.filter(t=>t.archived&&t.done);
    if(!gone.length||!confirm(`Permanently delete ${gone.length} completed archived task${gone.length>1?'s':''}?\n\nThis can't be undone. Not-completed archived tasks are kept.`))return false;
    for(const t of gone)await DB.del('tasks',t.id);S.tasks=S.tasks.filter(t=>!gone.includes(t));
  },
  'open-habit'(el){openHabit(el.dataset.id);return false},
  async 'cal-toggle'(el){await toggleLog(cal.id,el.dataset.date);drawHabit()},
  'cal-month'(el){const d=new Date(cal.y,cal.m+(+el.dataset.d),1);cal.y=d.getFullYear();cal.m=d.getMonth();drawHabit();return false},
  'dlg-close'(){dlg.close();return false},
  'edit-task'(el){openEdit('task',el.dataset.id);return false},
  'edit-goal'(el){openEdit('goal',el.dataset.id);return false},
  'edit-habit'(el){openEdit('habit',el.dataset.id);return false},
  async 'toggle-task'(el){const t=S.tasks.find(x=>x.id===el.dataset.id);t.done=!t.done;t.doneAt=t.done?Date.now():null;Sound.play(t.done?'task':'undo');await DB.put('tasks',t)},
  'toggle-hide-done'(){S.hideDone=!S.hideDone;try{localStorage.setItem('gt-hide-done',S.hideDone?'1':'0')}catch(e){}},
  'toggle-sound'(){Sound.set(!Sound.on);if(Sound.on)Sound.play('task')},
  async 'del-task'(el){
    const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t)return false;
    if(!confirm(`Delete "${t.title}"?\n\nThis can't be undone.${t.archived?'':' Tip: archive it instead to keep its history.'}`))return false;
    S.tasks=S.tasks.filter(x=>x.id!==t.id);await DB.del('tasks',t.id);
  },
  'task-filter'(el){S.taskFilter=el.dataset.v},
  horizon(el){S.horizon=el.dataset.v},
  'goal-scope'(el){S.goalScope=el.dataset.v},
  async 'done-goal'(el){const g=goalById(el.dataset.id);g.done=!g.done;await DB.put('goals',g)},
  async 'goal-progress'(el){const g=goalById(el.dataset.id);g.progress=+el.value;await DB.put('goals',g)},
  async 'del-goal'(el){
    const id=el.dataset.id;if(!confirm('Delete this goal? Linked tasks and sub-goals are kept but unlinked.'))return false;
    for(const t of S.tasks.filter(t=>t.goalId===id)){t.goalId=null;await DB.put('tasks',t)}
    for(const c of S.goals.filter(c=>c.parentId===id)){c.parentId=null;await DB.put('goals',c)}
    S.goals=S.goals.filter(g=>g.id!==id);await DB.del('goals',id);
  },
  async 'toggle-log'(el){await toggleLog(el.dataset.id,el.dataset.date)},
  async 'del-habit'(el){
    const id=el.dataset.id;if(!confirm('Delete this habit and its history?'))return false;
    S.habits=S.habits.filter(h=>h.id!==id);await DB.del('habits',id);
    for(const k of [...S.logs].filter(k=>k.startsWith(id+'|'))){S.logs.delete(k);await DB.del('logs',k)}
  },
  export(){
    const json=JSON.stringify(backupData());const name=`goal-tracker-${TODAY()}.json`;
    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    // Android saves downloads asynchronously; revoking the link too early leaves an empty file.
    setTimeout(()=>URL.revokeObjectURL(url),120000);
    notify(`Saved ${name} (${(json.length/1024).toFixed(1)} KB) to Downloads.`);return false;
  },
  'backup-copy'(){openBackup('copy');return false},
  'backup-paste'(){openBackup('paste');return false},
  import(){$('#importFile').click();return false},
  async wipe(){if(!confirm('Erase all tasks, goals, habits and history? This cannot be undone.'))return false;
    for(const s of STORES)await DB.clear(s);S.tasks=[];S.goals=[];S.habits=[];S.logs=new Set();}
};

document.addEventListener('click',async e=>{
  const nav=e.target.closest('#nav button');if(nav){S.view=nav.dataset.view;render();return}
  const el=e.target.closest('[data-action]');if(!el||el.type==='checkbox'||el.type==='range')return;
  const fn=actions[el.dataset.action];if(fn&&(await fn(el))!==false)render();
});
document.addEventListener('change',async e=>{
  const el=e.target.closest('[data-action]');
  if(el&&(el.type==='checkbox'||el.type==='range')){await actions[el.dataset.action](el);render()}
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f));const kind=f.dataset.form;
  if(kind==='task'){const t={id:uid(),title:v.title.trim(),notes:(v.notes||'').trim(),due:v.due||null,priority:v.priority,goalId:v.goalId||null,done:false,created:Date.now()};S.tasks.push(t);await DB.put('tasks',t)}
  if(kind==='goal'){const g={id:uid(),title:v.title.trim(),horizon:S.horizon,period:(v.period||currentPeriod(S.horizon)).trim(),parentId:v.parentId||null,notes:(v.notes||'').trim(),progress:0,done:false,created:Date.now()};S.goals.push(g);await DB.put('goals',g)}
  if(kind==='habit'){const h={id:uid(),name:v.name.trim(),target:+v.target,created:Date.now()};S.habits.push(h);await DB.put('habits',h)}
  render();
  const first=$('#app form input[type=text]');if(first)first.focus();
});
/* ---------- Backup & restore ---------- */
function notify(m){typeof toast==='function'?toast(m):alert(m)}
function backupData(){
  return{app:'goal-tracker',version:1,exported:new Date().toISOString(),tasks:S.tasks,goals:S.goals,habits:S.habits,
    logs:[...S.logs].map(id=>{const i=id.lastIndexOf('|');return{id,habitId:id.slice(0,i),date:id.slice(i+1)}})};
}
async function restore(text,source){
  text=(text||'').replace(/^\uFEFF/,'').trim();
  if(!text)throw new Error(source==='file'?'the file is empty (0 bytes), so the export never finished saving. Export again, or use "Copy backup text" instead.':'nothing was pasted.');
  let d;
  try{d=JSON.parse(text)}catch(e){throw new Error(`the ${source} is cut off or isn't valid JSON (${(text.length/1024).toFixed(1)} KB). Export it again, or use "Copy backup text" instead.`)}
  if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.goals))throw new Error("that isn't a Goal Tracker backup.");
  const n=`${d.tasks.length} tasks, ${d.goals.length} goals, ${(d.habits||[]).length} habits, ${(d.logs||[]).length} check-ins`;
  if(!confirm(`Replace all current data with this backup?\n\n${n}`))return false;
  for(const s of STORES){await DB.clear(s);for(const row of (d[s]||[]))await DB.put(s,row)}
  await load();render();return n;
}
function openBackup(mode){
  const copy=mode==='copy';
  dlg.innerHTML=`<form method="dialog" data-backup="${mode}"><h3>${copy?'Backup as text':'Restore from text'}</h3>
    <p class="meta">${copy?'Copy this and paste it somewhere safe, like a note or a message to yourself.':'Paste a backup you copied earlier. This replaces all current data.'}</p>
    <textarea name="text" spellcheck="false" style="min-height:180px;font:12px/1.4 ui-monospace,monospace" ${copy?'readonly':'placeholder="Paste backup here…"'}>${copy?esc(JSON.stringify(backupData())):''}</textarea>
    <div class="dlg-actions"><button class="ghost" value="cancel" formnovalidate>Close</button><button class="btn" value="go">${copy?'Copy':'Restore'}</button></div></form>`;
  dlg.showModal();
  const ta=dlg.querySelector('textarea');copy?ta.select():ta.focus();
}
dlg.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-backup]');if(!f)return;e.preventDefault();
  if(e.submitter&&e.submitter.value==='cancel'){dlg.close();return}
  const ta=f.elements.text;
  if(f.dataset.backup==='copy'){
    try{await navigator.clipboard.writeText(ta.value)}catch(_){ta.select();document.execCommand('copy')}
    if(e.submitter)e.submitter.textContent='Copied ✓';return;
  }
  try{const n=await restore(ta.value,'pasted text');if(n){dlg.close();notify('Restored '+n+'.')}}
  catch(err){alert('Restore failed: '+err.message)}
});
$('#importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  try{const n=await restore(await file.text(),'file');if(n)notify('Imported '+n+'.')}
  catch(err){alert('Import failed: '+err.message)}
  finally{e.target.value=''}
});

/* ---------- Tooltips (hover + tap) ---------- */
const tip=$('#tip');let tipEl=null;
function showTip(el,x,y){tipEl=el;tip.textContent=el.dataset.tip;
  const r=tip.getBoundingClientRect();const half=r.width/2+8;
  tip.style.left=Math.min(Math.max(x,half),innerWidth-half)+'px';tip.style.top=Math.max(y,r.height+14)+'px';tip.classList.add('show')}
function hideTip(){tipEl=null;tip.classList.remove('show')}
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tip]');el?showTip(el,e.clientX,e.clientY):hideTip()});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const el=e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}else hideTip()});
addEventListener('scroll',hideTip,{passive:true});

/* ---------- Theme: auto → light → dark ---------- */
const THEME_LABEL={auto:'◐ Auto',light:'☀ Light',dark:'☾ Dark'};
function getTheme(){return document.documentElement.dataset.theme||'auto'}
function setTheme(t){
  if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  try{t==='auto'?localStorage.removeItem('gt-theme'):localStorage.setItem('gt-theme',t)}catch(e){}
  $('#themeBtn').textContent=THEME_LABEL[t];$('#themeBtn').title='Theme: '+t+' (tap to change)';
}
$('#themeBtn').addEventListener('click',()=>{const order=['auto','light','dark'];setTheme(order[(order.indexOf(getTheme())+1)%3])});
setTheme(getTheme());

(async()=>{
  $('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  await load();render();
})();
