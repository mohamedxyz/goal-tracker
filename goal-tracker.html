<!doctype html>
<!--
  Goal Tracker — single-file edition
  Versioning: MAJOR.MINOR.PATCH (semver.org). Bump APP_VERSION below on every change.
    PATCH = bug fix · MINOR = new feature · MAJOR = breaks old backups or data

  Changelog
  0.28.0 Negative habits ("Avoid" type): things to quit, e.g. no smoking. Every day counts as clean unless you tap it to mark a slip; streak = clean days in a row
  0.27.2 Archived tasks are only reachable from the Data tab (removed the archived-count link from the Tasks tab)
  0.27.1 Fix: goals no longer complete early. A goal at 99.6% used to round up to 100% and auto-complete; progress now only reaches 100% when the target is truly met
  0.27.0 Removed the focus timer
  0.26.0 Task tag folders: give a task a tag and open tasks group into collapsible folders per tag with done counts; with "Hide done today" a habit folder disappears once everything in it is done
  0.25.0 Quality pass: timer clears itself if its goal was deleted; checked speed on 2 years of data with every new feature, old backups (no checklists/schedules/order) load and render in every view
  0.24.0 Reorder habits and folders: Habits tab → Reorder shows ▲▼ on every habit (within its folder) and every folder; order is remembered
  0.23.0 Weekly report (Dashboard → Weekly report): tasks done and missed, habit completion per habit, weekly goal progress and goals finished; browse earlier weeks
  0.22.0 Undo after deleting a task, goal, habit or the completed-archive clean-up: a 6-second Undo button restores it with its links and history
  0.21.0 Focus timer (⏱ in the header): pick a number goal measured in hours or minutes, start, stop: the time is added to the goal; survives reload
  0.20.0 Search (🔍 in the header): finds tasks (including archived and checklist items), goals and habits as you type; tap a result to open it
  0.19.0 Checklists inside tasks: one item per line, tick items off from the task row, "2/4" progress chip; repeats start with a fresh checklist
  0.18.0 Repeating tasks (daily / weekdays / weekly / monthly): completing one creates the next occurrence; un-ticking removes it
  0.17.0 Habit schedules: pick the days a habit is due; streaks skip days off, rates count only due days, today lists and
         folders only include habits due today
  0.16.0 Quality pass: cached date formatters (2 years of data: Tasks tab 60→20 ms, dashboard 18→10 ms, archive 21→6 ms,
         all-periods goals 30→5 ms); aria-labels on every icon button; visible keyboard focus rings
  0.15.0 Weekly planning: "Plan this week" lists monthly goals with open slots and adds weekly steps under them (checkbox or number);
         dashboard prompt when the week has no goals or on Sunday/Monday with open slots
  0.14.0 Native-app feel on phones: bottom tab bar with icons, slimmer header, safe-area padding, theme-colour status bar,
         no tap flash / pull-to-refresh bounce, 32px+ tap targets; toast sits above the tab bar; fix: main content had no top/bottom padding (cards touched the header)
  0.13.0 Backup reminders: last-backup time on the Data tab, dashboard nudge (one-tap copy) when there is no backup or it is >7 days old,
         ask the browser to protect storage from eviction and show whether it is; habit edit/delete buttons get aria-labels
  0.12.0 Habit folders: group habits into sections that turn green when every habit in them is done today; fanfare on finishing a folder
  0.11.0 Compact view toggle for the Habits tab (one tight row per habit, remembered)
  0.10.0 Goals rework: checkbox / number-target / built-from-sub-goals kinds; parents auto-complete only when all expected
         sub-goals are done (cascades up, un-ticking reopens); period-end review (hit / missed / carry over); manual slider removed
  0.9.0  Completed tasks stay in the Tasks tab (dimmed, at the bottom); task notes; confirm before deleting; archive with full task details and "delete completed"
  0.8.0  "Defeat" sound when unchecking; dashboard shows only today's tasks and habits (one-tap check for today)
  0.7.0  Hide habits already done today; completion sounds with on/off switch; version shown in Data tab
  0.6.0  Habit history calendar: toggle any past day, ★ marks the creation day, best streak
  0.5.1  Fix: empty (0 KB) exports on Android; copy/paste backup as text; clearer import errors
  0.5.0  (Installable PWA edition only, no single-file changes)
  0.4.0  Edit tasks, goals and habits after creation
  0.3.0  Dashboard: activity heatmap, tasks chart, goal rings, habit consistency
  0.2.0  Light/dark/auto theme, warmer palette
  0.1.0  First build: tasks, weekly/monthly/annual/5-year goals, habits, IndexedDB storage, JSON export/import
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf5ee">
<title>Goal Tracker</title>
<script>try{const t=localStorage.getItem('gt-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#faf5ee;--card:#fffcf7;--text:#2e2520;--muted:#7d6f64;--line:#ece1d3;--accent:#c4612a;--on-accent:#fff;--soft:#f8e7d8;--ok:#6a8f3a;--on-ok:#fff;--warn:#c98418;--bad:#b9412f;--banner-bg:#fbe8c8;--banner-text:#6b3f12;--radius:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#251e19;--text:#f2e8dd;--muted:#ab9a8a;--line:#3b3129;--accent:#ec9659;--on-accent:#1b1612;--soft:#3d2a1d;--ok:#9cbf6e;--on-ok:#1b1612;--warn:#e6ad4f;--bad:#e8775f;--banner-bg:#4a3318;--banner-text:#f6d9a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#251e19;--text:#f2e8dd;--muted:#ab9a8a;--line:#3b3129;--accent:#ec9659;--on-accent:#1b1612;--soft:#3d2a1d;--ok:#9cbf6e;--on-ok:#1b1612;--warn:#e6ad4f;--bad:#e8775f;--banner-bg:#4a3318;--banner-text:#f6d9a8;color-scheme:dark}
.top .right{display:flex;align-items:center;gap:10px}
#themeBtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,.chip,[role=button],input[type=checkbox]{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.top h1{font-size:19px;margin:0;white-space:nowrap;letter-spacing:-.01em}
.top .date{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
nav button{flex:none;border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
main.wrap{padding-top:18px;padding-bottom:60px}
h2{font-size:16px;margin:22px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat .n{font-size:24px;font-weight:700}
.stat .l{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
form.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=text],textarea{flex:1 1 220px}
textarea{flex-basis:100%;min-height:54px;resize:vertical}
button.btn{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--on-accent);cursor:pointer;font-weight:600}
button.ghost{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--card);color:var(--text);cursor:pointer}
button.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:8px}
button.icon:hover{background:var(--soft);color:var(--text)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.grow{flex:1;min-width:0}
.title{font-weight:550;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.done .title{text-decoration:line-through;color:var(--muted)}
.item.dim{opacity:.55;transition:opacity .15s}
.item.dim:hover,.item.dim:focus-within{opacity:.85}
.subs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}.subs label{display:flex;gap:8px;align-items:center;font-size:14px;min-height:28px}.subs .sdone span{text-decoration:line-through;color:var(--muted)}
.srlist{display:grid;gap:6px;margin:10px 0;max-height:50vh;overflow:auto}.srow{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:inherit;font:inherit;cursor:pointer}.srow span{color:var(--muted);font-size:12px}
#searchBtn{background:none;border:0;font-size:18px;min-width:36px;min-height:36px;cursor:pointer}
.mv{display:inline-flex}.mv .icon{padding:0 6px}
.tnotes{color:var(--muted);font-size:13px;margin-top:3px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:600;margin:18px 0 8px}
.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.arch-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.arch .kvs{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px;font-size:13px}
@media (max-width:520px){.arch .kvs{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.okc{color:var(--ok);font-weight:600}
.arch.notdone .title{color:var(--muted)}
button.danger{color:var(--bad)}
.bar-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11.5px}
.p-high{color:var(--bad)} .p-med{color:var(--warn)} .overdue{color:var(--bad);font-weight:600}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:9px;font:inherit;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.goals{display:flex;flex-direction:column;gap:10px}
.goal .row{display:flex;gap:8px;align-items:flex-start}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.goal.isdone .bar span{background:var(--ok)}
.goal.isdone .title{color:var(--muted);text-decoration:line-through}
.goal input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:0;background:transparent}
.notes{color:var(--muted);font-size:13px;margin-top:6px;white-space:pre-wrap}
.habit{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.days{display:flex;gap:5px}
.habit .grow{flex:1 1 150px}
@media (max-width:520px){.habit .days{width:100%;justify-content:space-between}.habit .day{flex:1;max-width:44px}}
.day{width:34px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--muted);font:600 11px/1.1 inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.day b{font-size:13px;color:var(--text)}
.day.on{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.day.slip{background:var(--bad,#b4442f);border-color:var(--bad,#b4442f);color:#fff}.day.slip b{color:#fff}
.day.on b{color:var(--on-ok)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.heat{display:grid;grid-template-columns:repeat(28,1fr);gap:3px;width:100%;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.heat i.on{background:var(--ok)}
.streak{font-weight:700}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.banner{background:var(--banner-bg);color:var(--banner-text);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.settings .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* ---------- Dashboard visuals ---------- */
:root{--h0:var(--line);--h1:color-mix(in oklab,var(--ok) 38%,var(--card));--h2:color-mix(in oklab,var(--ok) 60%,var(--card));--h3:color-mix(in oklab,var(--ok) 80%,var(--card));--h4:var(--ok)}
.vcard{margin-top:16px}
.vhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.vhead .title{font-size:14.5px}
.vhead .sub{color:var(--muted);font-size:12.5px}
.hm-months{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;font-size:10.5px;color:var(--muted);margin-bottom:3px;height:13px}
.hm-months span{white-space:nowrap;overflow:visible}
.hm{display:grid;grid-template-columns:repeat(26,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px}
.hm i{aspect-ratio:1;border-radius:3px;background:var(--h0)}
.hm i.l1{background:var(--h1)} .hm i.l2{background:var(--h2)} .hm i.l3{background:var(--h3)} .hm i.l4{background:var(--h4)}
.hm i.fut{background:transparent}
.hm i.tod{outline:1.5px solid var(--accent);outline-offset:1px}
.hm-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;color:var(--muted);font-size:11.5px;margin-top:8px}
.hm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hm-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.hm-foot .meta{margin:0}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.ring svg{width:100%;max-width:74px;height:auto;display:block;margin:0 auto}
.ring .rt{fill:none;stroke:var(--line);stroke-width:7}
.ring .rv{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .4s}
.ring .num{fill:var(--text);font:700 15px system-ui,sans-serif}
.ring .lbl{font-size:12px;font-weight:600;margin-top:4px}
.ring .cnt{font-size:11px;color:var(--muted)}
.barchart svg{width:100%;height:auto;display:block}
.barchart .bar{fill:var(--accent)}
.barchart .bar.zero{fill:var(--line)}
.barchart .hit{fill:transparent;cursor:default}
.barchart .hit:hover+.bar,.barchart g:hover .bar{opacity:.8}
.barchart .ax{fill:var(--muted);font:10px system-ui,sans-serif}
.barchart .base{stroke:var(--line);stroke-width:1}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar .top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.hbar .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .top span:last-child{color:var(--muted);flex:none}
.hbar .track{height:8px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}
.hbar .fill{height:100%;border-radius:99px;background:var(--ok)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.split{grid-template-columns:1fr}}
dialog#editDlg{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:18px;width:min(460px,calc(100vw - 32px));box-shadow:0 18px 50px rgba(40,20,5,.25)}
dialog#editDlg::backdrop{background:rgba(30,18,10,.45)}
.dlg h3{margin:0 0 14px;font-size:16px}
.dlg label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.dlg input,.dlg select,.dlg textarea{width:100%}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;margin-top:12px}
.dlg .check input{width:auto;accent-color:var(--accent)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
/* ---------- Habit history ---------- */
.habit-open{cursor:pointer}
.habit-open .chev{color:var(--muted);font-weight:400}
.hist-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist-top h3{margin:0;overflow-wrap:anywhere}
.hist-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 14px;text-align:center}
.hist-stats div{background:var(--bg);border-radius:10px;padding:8px 4px}
.hist-stats b{display:block;font-size:16px}
.hist-stats span{font-size:11px;color:var(--muted)}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-nav .icon{font-size:24px;line-height:1;padding:2px 12px}
.cal-nav .icon:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wk{margin-bottom:4px;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.cd{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:600 13px system-ui,sans-serif;cursor:pointer;padding:0;touch-action:manipulation}
.cd.on{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.cd.tod{outline:2px solid var(--accent);outline-offset:1px}
.cd:disabled{opacity:.35;cursor:default}
.cd .star{position:absolute;top:2px;right:3px;font-size:9px;font-style:normal;line-height:1;color:var(--warn)}
.cd.on .star{color:var(--on-ok)}
.star-inline{font-style:normal;color:var(--warn)}
.cal-foot{margin-top:10px;justify-content:space-between}
.habits-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.habits-bar h2{margin:0}
.habits-bar .meta{margin:0}
.tcheck{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:transparent;font:700 16px/1 system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;touch-action:manipulation}
.tcheck:hover{border-color:var(--ok)}
.tcheck.on{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.allclear{color:var(--ok);font-weight:600;text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
/* ---------- Goals 0.10 ---------- */
.f-num,.f-roll{display:none}
form[data-kind=number] .f-num,form[data-kind=rollup] .f-roll{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 100%}
.dlg form[data-kind=number] .f-num,.dlg form[data-kind=rollup] .f-roll{display:block}
.tag.t-ok{background:color-mix(in oklab,var(--ok) 18%,var(--card));color:var(--ok)}
.tag.t-bad{background:color-mix(in oklab,var(--bad) 15%,var(--card));color:var(--bad)}
.tag.t-warn{background:color-mix(in oklab,var(--warn) 18%,var(--card));color:var(--warn)}
.goal.ismissed .bar span{background:var(--bad)}
.goal.ismissed .title{color:var(--muted)}
.numrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.numrow .ghost{width:40px;height:36px;padding:0;font-size:18px;font-weight:700}
.numval{flex:1;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:700 15px system-ui,sans-serif;cursor:pointer}
.numval span{font-weight:500;color:var(--muted)}
.review-cta{display:flex;align-items:center;gap:12px;margin-bottom:12px;border-color:color-mix(in oklab,var(--warn) 45%,var(--line));background:color-mix(in oklab,var(--warn) 8%,var(--card))}
.rv .rv-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rv .rv-actions .ghost{flex:1 1 auto;font-size:13px;padding:7px 8px}
.rv .rv-actions .ok{color:var(--ok)} .rv .rv-actions .bad{color:var(--bad)}

<body>
<header><div class="wrap">

<script>
/* ---------- Database (IndexedDB) ---------- */
const STORES=['tasks','goals','habits','logs'];
const DB={
  db:null, mem:null,
  open(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open('goal-tracker-db',1);
        r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
        r.onsuccess=()=>{this.db=r.result;res(true)};
        r.onerror=()=>{this.useMemory();res(false)};
      }catch(e){this.useMemory();res(false)}
    });
  },
  useMemory(){this.mem={};STORES.forEach(s=>this.mem[s]=new Map())},
  req(store,mode,fn){
    if(this.mem){return Promise.resolve(fn(null))}
    return new Promise((res,rej)=>{
      const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));
      t.oncomplete=()=>res(r&&'result' in r?r.result:undefined);t.onerror=()=>rej(t.error);
    });
  },
  all(s){return this.mem?Promise.resolve([...this.mem[s].values()]):this.req(s,'readonly',st=>st.getAll())},
  put(s,v){if(this.mem){this.mem[s].set(v.id,v);return Promise.resolve()}return this.req(s,'readwrite',st=>st.put(v))},
  del(s,id){if(this.mem){this.mem[s].delete(id);return Promise.resolve()}return this.req(s,'readwrite',st=>st.delete(id))},
  clear(s){if(this.mem){this.mem[s].clear();return Promise.resolve()}return this.req(s,'readwrite',st=>st.clear())}
};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=()=>ds(new Date());
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);
  return `${y}-W${pad(w)}`;
}
const HORIZONS={weekly:'Weekly',monthly:'Monthly',annual:'Annual',five:'5-Year'};
const PARENT={weekly:'monthly',monthly:'annual',annual:'five',five:null};
function currentPeriod(h){
  const d=new Date(),y=d.getFullYear();
  return h==='weekly'?isoWeek(d):h==='monthly'?ds(d).slice(0,7):h==='annual'?String(y):`${y}-${y+4}`;
}
const _fmts={};
// Creating a formatter is the slow part of toLocale*String, so build each one once and reuse it.
const fmt=(d,o)=>{const k=JSON.stringify(o);return(_fmts[k]||(_fmts[k]=new Intl.DateTimeFormat(undefined,o))).format(d)};
const fmtDate=s=>{if(!s)return'';const d=new Date(s+'T00:00');return fmt(d,{month:'short',day:'numeric'})};

/* ---------- State ---------- */
const S={tasks:[],goals:[],habits:[],logs:new Set(),view:'dash',horizon:'weekly',goalScope:'current',taskFilter:'open',persistent:true};

async function load(){
  S.persistent=await DB.open();
  const [t,g,h,l]=await Promise.all(STORES.map(s=>DB.all(s)));
  S.tasks=t;S.goals=g;S.habits=h;S.logs=new Set(l.map(x=>x.id));
}

/* ---------- Logic ---------- */
const goalById=id=>S.goals.find(g=>g.id===id);
/* Goal kinds:
   check  – done when ticked, or automatically when all linked tasks are done
   number – target + unit (e.g. 40 hours); done automatically at 100%
   rollup – built from sub-goals; progress = sum of children ÷ EXPECTED count (not just the ones created so far),
            so one finished week can't complete a whole month */
const CHILD={monthly:'weekly',annual:'monthly',five:'annual'};
function goalKind(g){return g.kind||(S.goals.some(c=>c.parentId===g.id)?'rollup':'check')}
function periodEnd(h,p){let m;
  if(h==='weekly'&&(m=/^(\d{4})-W(\d{2})$/.exec(p))){const jan4=new Date(+m[1],0,4);const mon=addDays(jan4,-((jan4.getDay()+6)%7)+(+m[2]-1)*7);return ds(addDays(mon,6))}
  if(h==='monthly'&&(m=/^(\d{4})-(\d{2})$/.exec(p)))return ds(new Date(+m[1],+m[2],0));
  if(h==='annual'&&(m=/^(\d{4})$/.exec(p)))return m[1]+'-12-31';
  if(h==='five'&&(m=/^(\d{4})-(\d{4})$/.exec(p)))return m[2]+'-12-31';
  return null;}
function defaultExpected(g){
  if(g.horizon==='monthly'){const m=/^(\d{4})-(\d{2})$/.exec(g.period||'');if(!m)return 4;let n=0;const days=new Date(+m[1],+m[2],0).getDate();
    for(let d=1;d<=days;d++)if(new Date(+m[1],+m[2]-1,d).getDay()===4)n++;return n} // ISO weeks whose Thursday is in the month
  return{annual:12,five:5}[g.horizon]||1;}
const expectedOf=g=>Math.max(1,+g.expected||defaultExpected(g));
const fmtNum=n=>String(+(+n||0).toFixed(2));
function progressRaw(g,seen=new Set()){
  if(seen.has(g.id))return 0;seen.add(g.id);
  const k=goalKind(g);
  if(k==='number'){const t=+g.target||0;const v=+g.value||0;return t<=0?0:v>=t?100:Math.min(99,Math.floor(v/t*100))}
  if(k==='rollup'){const kids=S.goals.filter(c=>c.parentId===g.id);const n=Math.max(expectedOf(g),kids.length);
    const sum=kids.reduce((a,c)=>a+progress(c,seen),0);return sum>=n*100?100:Math.min(99,Math.floor(sum/n))}
  const t=S.tasks.filter(x=>x.goalId===g.id);if(!t.length)return 0;const d=t.filter(x=>x.done).length;return d===t.length?100:Math.min(99,Math.floor(d/t.length*100));
}
function progress(g,seen=new Set()){return g.done?100:progressRaw(g,seen)}
function goalDetail(g){
  const k=goalKind(g);
  if(k==='number')return'';
  if(k==='rollup'){const kids=S.goals.filter(c=>c.parentId===g.id),n=Math.max(expectedOf(g),kids.length),d=kids.filter(c=>c.done).length;
    const lbl=CHILD[g.horizon]?HORIZONS[CHILD[g.horizon]].toLowerCase():'sub';
    return`${d} of ${n} ${lbl} goals done${kids.length<n?` · ${n-kids.length} still to plan`:''}`}
  const t=S.tasks.filter(x=>x.goalId===g.id);return t.length?`${t.filter(x=>x.done).length}/${t.length} linked tasks done`:'tick ✓ when done';
}
const needsReview=g=>{if(g.done||g.status==='missed')return false;const e=periodEnd(g.horizon,g.period);return!!e&&e<TODAY()};
// Auto-complete goals that reached 100% (cascading upward); reopen auto-completed ones that dropped below.
function syncGoals(){
  const changed=new Set(),newly=new Set();
  for(let pass=0,dirty=true;dirty&&pass<10;pass++){dirty=false;
    for(const g of S.goals){
      if(g.status==='missed')continue;
      const raw=progressRaw(g);
      if(g.manualOpen&&raw<100){g.manualOpen=false;changed.add(g)}
      if(!g.done&&!g.manualOpen&&raw>=100){g.done=true;g.autoDone=true;g.doneAt=Date.now();changed.add(g);newly.add(g);dirty=true}
      else if(g.done&&g.autoDone&&raw<100){g.done=false;g.autoDone=false;g.doneAt=null;changed.add(g);newly.delete(g);dirty=true}
    }}
  for(const g of changed)DB.put('goals',g);
  return[...newly].filter(g=>g.done);
}
const logged=(hid,date)=>S.logs.has(hid+'|'+date);
// "Avoid" habits: a logged day is a SLIP; every day from creation until today is clean unless slipped.
const isNeg=h=>h.kind==='avoid';
const bornK=h=>ds(new Date(h.created||Date.now()));
const good=(h,k)=>isNeg(h)?(k>=bornK(h)&&k<=TODAY()&&!S.logs.has(h.id+'|'+k)):S.logs.has(h.id+'|'+k);
const hname=h=>(isNeg(h)?'🚫 ':'')+esc(h.name);
// Schedules: h.days = weekdays it's due (0=Sun…6=Sat); empty/missing = every day.
const hasSched=h=>Array.isArray(h.days)&&h.days.length>0&&h.days.length<7;
const isDue=(h,d)=>!hasSched(h)||h.days.includes(d.getDay());
const dueToday=h=>isDue(h,new Date());
const weekTarget=h=>hasSched(h)?h.days.length:(h.target||7);
const DOW_ORDER=[1,2,3,4,5,6,0];
const schedText=h=>hasSched(h)?DOW_ORDER.filter(n=>h.days.includes(n)).map(n=>fmt(new Date(2024,0,n||7),{weekday:'short'})).join(' · '):'';
// Streak = consecutive DUE days done; days off neither break nor add to it (a check-in on a day off still counts).
function streak(h){
  if(isNeg(h)){let n=0,d=new Date();while(n<3650&&good(h,ds(d))){n++;d=addDays(d,-1)}return n}
  let d=new Date();if(!good(h,ds(d)))d=addDays(d,-1);
  let n=0;for(let i=0;i<1100;i++){if(good(h,ds(d)))n++;else if(isDue(h,d))break;d=addDays(d,-1)}return n;
}
function weekCount(h){
  const d=new Date();const dow=(d.getDay()+6)%7;let n=0;
  for(let i=0;i<=dow;i++)if(good(h,ds(addDays(d,-i))))n++;return n;
}
function rate30(h){let due=0,n=0;for(let i=0;i<30;i++){const d=addDays(new Date(),-i);if(isNeg(h)&&ds(d)<bornK(h))continue;if(isDue(h,d)){due++;if(good(h,ds(d)))n++}}return due?Math.min(100,Math.round(n/due*100)):0}

/* ---------- Components ---------- */
const ARCHIVE_ICON='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>';
function fmtWhen(ts){if(!ts)return'';const d=new Date(ts);const y=d.getFullYear()!==new Date().getFullYear();
  return fmt(d,{month:'short',day:'numeric',...(y?{year:'numeric'}:{}),hour:'numeric',minute:'2-digit'})}
function fmtDay(s){return s?fmt(new Date(s+'T00:00'),{weekday:'short',month:'short',day:'numeric',year:'numeric'}):'—'}
function taskItem(t){
  const g=t.goalId&&goalById(t.goalId);const today=TODAY();
  const overdue=!t.done&&t.due&&t.due<today;
  return `<li class="item ${t.done?'done dim':''}">
    <input type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''} aria-label="Complete">
    <div class="grow"><div class="title">${esc(t.title)}</div>
      ${t.notes?`<div class="tnotes">${esc(t.notes)}</div>`:''}
      ${(t.items||[]).length?`<ul class="subs">${t.items.map((it,i)=>`<li><label class="${it.done?'sdone':''}"><input type="checkbox" data-action="toggle-sub" data-id="${t.id}" data-i="${i}" ${it.done?'checked':''}><span>${esc(it.text)}</span></label></li>`).join('')}</ul>`:''}
      <div class="meta">
        ${(t.items||[]).length?`<span title="Checklist">☑ ${t.items.filter(i=>i.done).length}/${t.items.length}</span>`:''}
        ${t.done&&t.doneAt?`<span>Done ${fmtWhen(t.doneAt)}</span>`:''}
        ${t.due?`<span class="${overdue?'overdue':''}">${overdue?'Overdue · ':''}${t.due===today?'Today':fmtDate(t.due)}</span>`:''}
        ${t.tag?`<span class="tag">#${esc(t.tag)}</span>`:''}

function dayActivity(){

  for(const t of S.tasks){if(t.done&&t.doneAt){const d=ds(new Date(t.doneAt));(m[d]||(m[d]={h:0,t:0})).t++}}

function heatmapCard(){
  const act=dayActivity();const now=new Date();const today=TODAY();
  const monday=addDays(now,-((now.getDay()+6)%7));const start=addDays(monday,-25*7);
  let cells='',months='',total=0,activeDays=0,max=0;
  for(let i=0;i<182;i++){const k=ds(addDays(start,i));const a=act[k];if(a)max=Math.max(max,a.h+a.t)}
  let lastMonth=-1;
  for(let w=0;w<26;w++){
    const colStart=addDays(start,w*7);
    const firstOfMonth=[...Array(7)].map((_,j)=>addDays(colStart,j)).find(d=>d.getDate()===1);
    const mo=firstOfMonth||(w===0?colStart:null);
    if(mo&&mo.getMonth()!==lastMonth){months+=`<span>${fmt(mo,{month:'short'})}</span>`;lastMonth=mo.getMonth()}else months+='<span></span>';
    for(let j=0;j<7;j++){
      const d=addDays(colStart,j);const k=ds(d);
      if(k>today){cells+='<i class="fut"></i>';continue}
      const a=act[k]||{h:0,t:0};const c=a.h+a.t;total+=c;if(c)activeDays++;
      const lvl=c?Math.max(1,Math.ceil(c/max*4)):0;
      const label=fmt(d,{weekday:'short',month:'short',day:'numeric'});
      cells+=`<i class="l${lvl} ${k===today?'tod':''}" data-tip="${label}: ${a.h} habit check-in${a.h===1?'':'s'}, ${a.t} task${a.t===1?'':'s'} done"></i>`;
    }
  }
  return `<div class="card vcard"><div class="vhead"><div class="title">Activity</div><div class="sub">Last 26 weeks</div></div>
    <div class="hm-months">${months}</div><div class="hm" role="img" aria-label="Activity heatmap: ${total} actions on ${activeDays} days">${cells}</div>
    <div class="hm-foot"><div class="meta"><span><b>${total}</b> actions</span><span><b>${activeDays}</b> active days</span></div>
    <div class="hm-legend">Less <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> More</div></div></div>`;
}
function ringsCard(){

function tasksChartCard(){
  const days=14,W=300,H=130,pt=14,pb=20,gap=2;const bw=W/days;
  const counts=[...Array(days)].map((_,i)=>{const d=addDays(new Date(),i-(days-1));const k=ds(d);return{d,k,n:S.tasks.filter(t=>t.done&&t.doneAt&&ds(new Date(t.doneAt))===k).length}});
  const max=Math.max(1,...counts.map(c=>c.n));const sum=counts.reduce((a,c)=>a+c.n,0);
  const base=H-pb,ph=base-pt;
  const bars=counts.map((c,i)=>{
    const x=i*bw+gap/2,w=bw-gap,h=c.n?Math.max(4,c.n/max*ph):3,y=base-h,rr=Math.min(4,w/2,h);
    const path=`M${x},${base}V${y+rr}Q${x},${y} ${x+rr},${y}H${x+w-rr}Q${x+w},${y} ${x+w},${y+rr}V${base}Z`;
    const lab=fmt(c.d,{weekday:'short',month:'short',day:'numeric'});
    const ax=(i%2===(days-1)%2)?`<text class="ax" x="${x+w/2}" y="${H-5}" text-anchor="middle">${c.d.getDate()}</text>`:'';
    return `<g data-tip="${lab}: ${c.n} task${c.n===1?'':'s'} completed"><rect class="hit" x="${i*bw}" y="0" width="${bw}" height="${base}"/><path class="bar ${c.n?'':'zero'}" d="${path}"/>${ax}</g>`;
  }).join('');
  return `<div class="card vcard barchart"><div class="vhead"><div class="title">Tasks completed</div><div class="sub">${sum} in 14 days</div></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed per day, last 14 days, ${sum} total">${bars}<line class="base" x1="0" x2="${W}" y1="${base}" y2="${base}"/></svg></div>`;
}

function habitToday(h){
  const k=TODAY(),on=good(h,k),s=streak(h);
  return `<li class="item ${on?'done':''}">
    <button class="tcheck ${on?'on':''}" data-action="toggle-log" data-id="${h.id}" data-date="${k}" aria-pressed="${on}" aria-label="${isNeg(h)?(on?'Clean today. Tap to log a slip':'Slipped today. Tap to undo'):(on?'Undo':'Check off')+' '+esc(h.name)+' for today'}">${isNeg(h)&&!on?'✗':'✓'}</button>
    <div class="grow habit-open" data-action="open-habit" data-id="${h.id}" role="button" tabindex="0" title="Open history">
      <div class="title">${hname(h)} <span class="chev">›</span></div>
      <div class="meta"><span>${isNeg(h)?'🛡 '+s+' day'+(s===1?'':'s')+' clean':'🔥 '+s+' day'+(s===1?'':'s')}</span><span>This week ${weekCount(h)}/${weekTarget(h)}</span></div></div></li>`;
}
function habitList(full){
  if(!S.habits.length)return `<div class="empty">No habits yet.${full?' Tap a day to check it off.':''}</div>`;
  const today=TODAY(),dueAll=sortedHabits().filter(dueToday),doneToday=dueAll.filter(h=>good(h,today)).length;
  const pool=full?sortedHabits():dueAll,offToday=S.habits.length-dueAll.length;
  if(!pool.length)return `<div class="empty">Nothing due today. ${offToday} habit${offToday>1?'s':''} off.</div>`;
  const bar=`<div class="filters"><button class="chip ${S.hideDone?'on':''}" data-action="toggle-hide-done" aria-pressed="${S.hideDone}">${S.hideDone?'✓ Hiding done today':'Hide done today'}</button>
    ${full?`<button class="chip ${S.compact?'on':''}" data-action="toggle-compact" aria-pressed="${S.compact}">${S.compact?'✓ Compact':'Compact'}</button><button class="chip ${S.reorder?'on':''}" data-action="toggle-reorder" aria-pressed="${!!S.reorder}">${S.reorder?'✓ Reordering':'↕ Reorder'}</button>`:''}
    <span class="meta" style="align-self:center">${doneToday}/${dueAll.length} due done${offToday?` · ${offToday} off today`:''}${S.hideDone&&doneToday?` · ${doneToday} hidden`:''}</span></div>`;
  const wrap=hs=>full?`<div class="goals">${hs.map(h=>habitCard(h,true)).join('')}</div>`:`<ul class="list">${hs.map(habitToday).join('')}</ul>`;
  const groups=new Map(),loose=[];
  for(const h of pool){const g=folderOf(h);if(g){if(!groups.has(g))groups.set(g,[]);groups.get(g).push(h)}else loose.push(h)}
  let out='';
  const gnames=[...groups.keys()].sort((a,b)=>{const x=S.forder.indexOf(a),y=S.forder.indexOf(b);return (x<0?1e6:x)-(y<0?1e6:y)});
  for(const name of gnames){const hs=groups.get(name);
    const due=hs.filter(dueToday),done=due.filter(h=>good(h,today)).length,all=due.length>0&&done===due.length,collapsed=S.collapsed.has(name);
    const vis=S.hideDone?hs.filter(h=>!good(h,today)):hs;
    if(S.hideDone&&!vis.length)continue;
    out+=`<section class="hfolder ${all?'complete':''} ${collapsed||!vis.length?'collapsed':''}">
      <div class="hf-head"><button type="button" class="hf-toggle" data-action="toggle-folder" data-name="${esc(name)}" aria-expanded="${!collapsed}">
        <span class="hf-chev">${collapsed?'▶':'▼'}</span><span class="hf-name">${all?'✓ ':''}${esc(name)}</span></button>
        <span class="hf-count">${all?'All done':due.length?done+'/'+due.length:'Off today'}</span>
        ${full?mvBtns('move-folder','',`data-name="${esc(name)}"`):''}
        <button type="button" class="icon" data-action="rename-folder" data-name="${esc(name)}" title="Rename folder" aria-label="Rename folder">✎</button></div>
      <div class="hf-bar"><span style="width:${due.length?Math.round(done/due.length*100):0}%"></span></div>
      ${collapsed||!vis.length?'':wrap(vis)}</section>`;
  }
  const looseVis=S.hideDone?loose.filter(h=>!good(h,today)):loose;
  if(looseVis.length)out+=wrap(looseVis);
  if(S.hideDone&&dueAll.length&&doneToday===dueAll.length)out+=`<div class="allclear">All habits done for today 🎉</div>`;
  return bar+out;
}

function render(){
  const newly=syncGoals();
  if(S.booted&&newly.length){Sound.play('goal');setTimeout(()=>toast('🎯 Goal complete: '+newly.map(g=>g.title).join(', ')),50)}
  S.booted=true;
  const v={dash:viewDash,tasks:viewTasks,goals:viewGoals,habits:viewHabits,data:viewData,archive:viewArchive}[S.view]||viewDash;
  $('#app').innerHTML=(S.persistent?'':`<div class="banner">This browser blocked storage — data will be lost on reload. Use Export to save it.</div>`)+v();

let cal={id:null,y:0,m:0};
function habitDates(h){return[...S.logs].filter(k=>k.startsWith(h.id+'|')).map(k=>k.slice(k.lastIndexOf('|')+1)).sort()}
function bestStreak(h){const dates=isNeg(h)?[bornK(h)]:habitDates(h);if(!dates.length)return 0;let best=0,run=0;const today=TODAY();
  for(let d=new Date(dates[0]+'T00:00');ds(d)<=today;d=addDays(d,1)){const k=ds(d);
    if(good(h,k)){run++;best=Math.max(best,run)}else if(isDue(h,d)&&(k!==today||isNeg(h)))run=0}return best}
function openHabit(id){const d=new Date();cal={id,y:d.getFullYear(),m:d.getMonth()};drawHabit();dlg.showModal();}
function drawHabit(){
  const h=S.habits.find(x=>x.id===cal.id);if(!h){dlg.close();return}
  const now=new Date(),today=TODAY(),createdK=h.created?ds(new Date(h.created)):null;

  dlg.innerHTML=`<div class="hist">

    <div class="cal cal-wk">${wk}</div><div class="cal">${cells}</div>
    <div class="meta cal-foot"><span>${monthCount} day${monthCount===1?'':'s'} this month</span>${created}</div>
    <p class="meta">Tap any past day to check it off or undo it.</p></div>`;
}

/* ---------- Completion sounds (synthesised, no audio files) ---------- */
const Sound={
  ctx:null,on:true,
  load(){try{this.on=localStorage.getItem('gt-sound')!=='off'}catch(e){}},
  set(v){this.on=v;try{localStorage.setItem('gt-sound',v?'on':'off')}catch(e){}},
  play(kind){
    if(!this.on)return;
    try{
      const C=this.ctx||(this.ctx=new (window.AudioContext||window.webkitAudioContext)());
      if(C.state==='suspended')C.resume();
      // task: bright rising C–E–G · habit: softer two-note "pop" · undo: falling G–E♭–C "womp", last note sags
      const S_={task:{n:[[1046.5,0],[1318.5,.07],[1568,.14]],len:.38,vol:.16},
                habit:{n:[[784,0],[1174.7,.08]],len:.38,vol:.16},
                undo:{n:[[392,0],[311.1,.16],[261.6,.32]],len:.5,vol:.13,sag:true},
                goal:{n:[[784,0],[1046.5,.1],[1318.5,.2],[1568,.3],[2093,.42]],len:.55,vol:.15}}[kind]||null;
      if(!S_)return;
      const t0=C.currentTime+.01;
      S_.n.forEach(([f,dt],i)=>{
        const o=C.createOscillator(),g=C.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t0+dt);
        const last=i===S_.n.length-1,len=last&&S_.sag?S_.len*1.6:S_.len;
        if(last&&S_.sag)o.frequency.exponentialRampToValueAtTime(f*.82,t0+dt+len);
        g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(S_.vol,t0+dt+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+len);
        o.connect(g).connect(C.destination);o.start(t0+dt);o.stop(t0+dt+len+.05);
      });
    }catch(e){}
  }
};

const REPEATS=[['','No repeat'],['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly'],['monthly','Monthly']];

function stepDue(d,rule){const x=new Date(d);
  if(rule==='daily')x.setDate(x.getDate()+1);
  else if(rule==='weekdays'){do x.setDate(x.getDate()+1);while(x.getDay()===0||x.getDay()===6)}
  else if(rule==='weekly')x.setDate(x.getDate()+7);
  else if(rule==='monthly'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  return x}
// Next due date after the task's own date, skipping past dates so an overdue task doesn't spawn more overdue ones.
function nextDue(t){const today=TODAY();let d=stepDue(new Date((t.due||today)+'T00:00'),t.repeat);for(let i=0;i<400&&ds(d)<today;i++)d=stepDue(d,t.repeat);return ds(d)}
async function onTaskDone(t){
  if(!t.repeat)return;
  if(t.done&&!t.nextId){
    const n={id:uid(),title:t.title,notes:t.notes||'',repeat:t.repeat,due:nextDue(t),priority:t.priority,goalId:t.goalId||null,tag:t.tag||'',items:(t.items||[]).map(i=>({text:i.text,done:false})),done:false,created:Date.now(),prevId:t.id};
    t.nextId=n.id;S.tasks.push(n);await DB.put('tasks',n);await DB.put('tasks',t);
    toast(`🔁 Next "${t.title}" on ${fmtDate(n.due)}`);
  }else if(!t.done&&t.nextId){
    const n=S.tasks.find(x=>x.id===t.nextId);
    if(n&&!n.done){S.tasks=S.tasks.filter(x=>x.id!==n.id);await DB.del('tasks',n.id)}
    t.nextId=null;await DB.put('tasks',t);
  }
}

  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f));const kind=f.dataset.form;
  if(kind==='task'){const t={id:uid(),title:v.title.trim(),notes:(v.notes||'').trim(),repeat:v.repeat||'',tag:(v.tag||'').trim(),items:parseItems(v.items),due:v.due||null,priority:v.priority,goalId:v.goalId||null,done:false,created:Date.now()};S.tasks.push(t);await DB.put('tasks',t)}
  if(kind==='goal'){
    let gk=v.kind||'check';if(gk==='rollup'&&S.horizon==='weekly')gk='check';
    if(gk==='number'&&!(+v.target>0)){alert('Set a target number for this goal (for example 40).');return}
    const g={id:uid(),title:v.title.trim(),horizon:S.horizon,period:(v.period||currentPeriod(S.horizon)).trim(),parentId:v.parentId||null,notes:(v.notes||'').trim(),
      kind:gk,target:+v.target||0,unit:(v.unit||'').trim(),value:0,expected:v.expected?Math.max(1,Math.round(+v.expected)):null,done:false,created:Date.now()};
    S.goals.push(g);await DB.put('goals',g)}
  if(kind==='habit'){const av=v.kind==='avoid';const h={id:uid(),name:v.name.trim(),kind:av?'avoid':'',target:av?7:+v.target,group:(v.group||'').trim(),days:av?[]:readDays(f),created:Date.now()};S.habits.push(h);await DB.put('habits',h)}
  render();
  const first=$('#app form input[type=text]');if(first)first.focus();
});
/* ---------- Weekly report ---------- */
const rep_={off:0};
function weekData(off){
  const now=new Date();const mon=addDays(now,-((now.getDay()+6)%7)+off*7);mon.setHours(0,0,0,0);
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));const a=ds(days[0]),z=ds(days[6]),today=TODAY();
  const t0=days[0].getTime(),t1=addDays(days[6],1).getTime();
  const done=S.tasks.filter(t=>t.done&&t.doneAt>=t0&&t.doneAt<t1);
  const missed=S.tasks.filter(t=>!t.done&&t.due&&t.due>=a&&t.due<=z&&t.due<today&&!t.archived);
  const habits=S.habits.map(h=>{const born=ds(new Date(h.created||0));let due=0,n=0;
    for(const d of days){const k=ds(d);if(k>today||k<born)continue;if(isDue(h,d)){due++;if(good(h,k))n++}else if(good(h,k)){due++;n++}}
    return{h,due,n}}).filter(x=>x.due);
  const wk=isoWeek(days[0]);
  const goals=S.goals.filter(g=>g.horizon==='weekly'&&g.period===wk);
  const finished=S.goals.filter(g=>g.done&&g.doneAt>=t0&&g.doneAt<t1);
  return{days,a,z,done,missed,habits,goals,finished};
}
function drawReport(){
  const w=weekData(rep_.off);const hd=w.habits.reduce((x,y)=>x+y.due,0),hn=w.habits.reduce((x,y)=>x+y.n,0);
  const rate=hd?Math.round(hn/hd*100):0;
  const stat=(n,l)=>`<div class="card" style="text-align:center;padding:10px"><div style="font-size:24px;font-weight:700">${n}</div><div class="meta" style="justify-content:center">${l}</div></div>`;
  const label=rep_.off===0?'This week':rep_.off===-1?'Last week':fmt(w.days[0],{month:'short',day:'numeric'})+' – '+fmt(w.days[6],{month:'short',day:'numeric'});
  dlg.innerHTML=`<form method="dialog" data-report><h3>Weekly report</h3>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <button type="button" class="icon" data-action="rep-nav" data-d="-1" aria-label="Previous week">‹</button><b>${label}</b>
      <button type="button" class="icon" data-action="rep-nav" data-d="1" aria-label="Next week" ${rep_.off>=0?'disabled':''}>›</button></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${stat(w.done.length,'tasks done')}${stat(w.missed.length,'tasks missed')}${stat(hd?rate+'%':'—','habits')}</div>
    ${w.habits.length?`<h2 style="margin-top:14px">Habits</h2>${w.habits.map(x=>`<div class="kv"><span>${esc(x.h.name)}</span><span>${x.n}/${x.due}</span></div>`).join('')}`:''}
    ${w.goals.length?`<h2 style="margin-top:14px">Weekly goals</h2>${w.goals.map(g=>`<div class="kv"><span>${esc(g.title)}</span><span>${g.done?'✓ done':Math.round(progress(g))+'%'}</span></div>`).join('')}`:''}
    ${w.finished.length?`<h2 style="margin-top:14px">Goals finished</h2>${w.finished.map(g=>`<div class="kv"><span>${esc(g.title)}</span><span>${HORIZONS[g.horizon]}</span></div>`).join('')}`:''}
    ${w.missed.length?`<h2 style="margin-top:14px">Missed tasks</h2>${w.missed.slice(0,8).map(t=>`<div class="kv"><span>${esc(t.title)}</span><span>${fmtDate(t.due)}</span></div>`).join('')}`:''}
    ${!w.done.length&&!w.habits.length&&!w.goals.length&&!w.missed.length?'<div class="empty">Nothing recorded this week.</div>':''}
    <div class="dlg-actions"><button class="ghost" value="cancel" formnovalidate>Close</button></div></form>`;
}
/* ---------- Search ---------- */
function searchResults(q){
  q=q.trim().toLowerCase();if(!q)return '<div class="empty">Type to search tasks, goals and habits.</div>';
  const has=(...a)=>a.some(x=>String(x||'').toLowerCase().includes(q));
  const row=(k,id,main,sub)=>`<button type="button" class="srow" data-sr="${k}:${id}"><b>${main}</b><span>${sub}</span></button>`;
  const tasks=S.tasks.filter(t=>has(t.title,t.notes,t.tag,(t.items||[]).map(i=>i.text).join(' '))).slice(0,30)
    .map(t=>row('task',t.id,esc(t.title),(t.archived?'Archived task':t.done?'Done task':'Task')+(t.due?' · '+fmtDate(t.due):'')));
  const goals=S.goals.filter(g=>has(g.title,g.notes,g.lesson)).slice(0,30)
    .map(g=>row('goal',g.id,esc(g.title),HORIZONS[g.horizon]+' goal · '+esc(g.period)+(g.done?' · done':'')));
  const habits=S.habits.filter(h=>has(h.name,h.group)).slice(0,30)
    .map(h=>row('habit',h.id,esc(h.name),'Habit'+(h.group?' · '+esc(h.group):'')));
  const all=[...tasks,...goals,...habits];
  return all.length?all.join(''):'<div class="empty">Nothing found.</div>';
}
function openSearch(){
  dlg.innerHTML=`<form method="dialog" data-search><h3>Search</h3>
    <input type="search" name="q" placeholder="Search everything…" autocomplete="off" aria-label="Search">
    <div id="srList" class="srlist">${searchResults('')}</div>
    <div class="dlg-actions"><button class="ghost" value="cancel" formnovalidate>Close</button></div></form>`;
  dlg.showModal();dlg.querySelector('input').focus();
}
dlg.addEventListener('input',e=>{if(e.target.name!=='q'||!('search' in e.target.form.dataset))return;$('#srList').innerHTML=searchResults(e.target.value)});
dlg.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.form&&('search' in e.target.form.dataset))e.preventDefault()});
dlg.addEventListener('click',e=>{const b=e.target.closest('[data-sr]');if(!b)return;const [k,id]=b.dataset.sr.split(':');openEdit(k,id)});
$('#searchBtn').addEventListener('click',openSearch);
/* ---------- Backup & restore ---------- */
function notify(m){typeof toast==='function'?toast(m):alert(m)}
function backupData(){
  return{app:'goal-tracker',version:1,exported:new Date().toISOString(),tasks:S.tasks,goals:S.goals,habits:S.habits,
    logs:[...S.logs].map(id=>{const i=id.lastIndexOf('|');return{id,habitId:id.slice(0,i),date:id.slice(i+1)}})};
}
async function restore(text,source){
  text=(text||'').replace(/^\uFEFF/,'').trim();
  if(!text)throw new Error(source==='file'?'the file is empty (0 bytes), so the export never finished saving. Export again, or use "Copy backup text" instead.':'nothing was pasted.');
  let d;
  try{d=JSON.parse(text)}catch(e){throw new Error(`the ${source} is cut off or isn't valid JSON (${(text.length/1024).toFixed(1)} KB). Export it again, or use "Copy backup text" instead.`)}
  if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.goals))throw new Error("that isn't a Goal Tracker backup.");
  const n=`${d.tasks.length} tasks, ${d.goals.length} goals, ${(d.habits||[]).length} habits, ${(d.logs||[]).length} check-ins`;
  if(!confirm(`Replace all current data with this backup?\n\n${n}`))return false;
  for(const s of STORES){await DB.clear(s);for(const row of (d[s]||[]))await DB.put(s,row)}
  await load();render();return n;
}
function openBackup(mode){
  const copy=mode==='copy';
  dlg.innerHTML=`<form method="dialog" data-backup="${mode}"><h3>${copy?'Backup as text':'Restore from text'}</h3>
    <p class="meta">${copy?'Copy this and paste it somewhere safe, like a note or a message to yourself.':'Paste a backup you copied earlier. This replaces all current data.'}</p>
    <textarea name="text" spellcheck="false" style="min-height:180px;font:12px/1.4 ui-monospace,monospace" ${copy?'readonly':'placeholder="Paste backup here…"'}>${copy?esc(JSON.stringify(backupData())):''}</textarea>
    <div class="dlg-actions"><button class="ghost" value="cancel" formnovalidate>Close</button><button class="btn" value="go">${copy?'Copy':'Restore'}</button></div></form>`;
  dlg.showModal();
  const ta=dlg.querySelector('textarea');copy?ta.select():ta.focus();
}
dlg.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-backup]');if(!f)return;e.preventDefault();
  if(e.submitter&&e.submitter.value==='cancel'){dlg.close();return}
  const ta=f.elements.text;
  if(f.dataset.backup==='copy'){
    let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true}catch(_){try{ta.select();ok=document.execCommand('copy')}catch(__){}}
    if(ok&&ta.value.length>2){markBackup();render()}
    if(e.submitter)e.submitter.textContent=ok?'Copied ✓':'Select all and copy manually';return;
  }
  try{const n=await restore(ta.value,'pasted text');if(n){dlg.close();notify('Restored '+n+'.')}}
  catch(err){alert('Restore failed: '+err.message)}
});
$('#importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  try{const n=await restore(await file.text(),'file');if(n)notify('Imported '+n+'.')}
  catch(err){alert('Import failed: '+err.message)}
  finally{e.target.value=''}
});

/* ---------- Tooltips (hover + tap) ---------- */
const tip=$('#tip');let tipEl=null;
function showTip(el,x,y){tipEl=el;tip.textContent=el.dataset.tip;
  const r=tip.getBoundingClientRect();const half=r.width/2+8;
  tip.style.left=Math.min(Math.max(x,half),innerWidth-half)+'px';tip.style.top=Math.max(y,r.height+14)+'px';tip.classList.add('show')}
function hideTip(){tipEl=null;tip.classList.remove('show')}
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tip]');el?showTip(el,e.clientX,e.clientY):hideTip()});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const el=e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}else hideTip()});
addEventListener('scroll',hideTip,{passive:true});

/* ---------- Theme: auto → light → dark ---------- */
const THEME_LABEL={auto:'◐ Auto',light:'☀ Light',dark:'☾ Dark'};
function getTheme(){return document.documentElement.dataset.theme||'auto'}
function setTheme(t){
  if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  try{t==='auto'?localStorage.removeItem('gt-theme'):localStorage.setItem('gt-theme',t)}catch(e){}
  $('#themeBtn').textContent=THEME_LABEL[t];$('#themeBtn').title='Theme: '+t+' (tap to change)';
  syncThemeColor();
}
// Status-bar colour follows the actual background (handles auto mode too).
function syncThemeColor(){const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).backgroundColor||'#faf5ee'}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncThemeColor)}catch(e){}
$('#themeBtn').addEventListener('click',()=>{const order=['auto','light','dark'];setTheme(order[(order.indexOf(getTheme())+1)%3])});
setTheme(getTheme());

(async()=>{
  $('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  await load();render();
  await checkStorage(true);if(S.view==='data')render();
})();
</script>
