  GoalTerra (formerly Goal Tracker) — single-file edition
  Versioning: MAJOR.MINOR.PATCH (semver.org). Bump APP_VERSION below on every change.
    PATCH = bug fix · MINOR = new feature · MAJOR = breaks old backups or data

  Changelog
  0.82.0 Harder to lose data: automatic safety copies kept in a separate store (daily, before app updates, before a restore, before erasing) with a Restore list in Settings; deleted goals, exams and topics now go to Trash for 30 days like tasks and habits (linked tasks are relinked on restore); Undo for bulk Done, Archive and Edit and for removing a long-streak check-in; Erase everything needs a typed word and can be undone; the last 5 titles and notes of a task or goal can be brought back from the edit screen; a one-time offer to turn on the automatic daily backup in the app, and a Last backup line on the dashboard; a Check my data tool that finds and fixes broken links.
  0.81.0 Game fixes: a defeated week boss stays defeated (no counterattacks after it dies, and a knockout can no longer undo a win); damage beyond the boss HP gives a small overkill XP bonus; one huge week raises the next boss by at most 25%; a "How the game works" sheet in plain words (tap ? on the game card); 11 badges that you keep once earned, with a toast; and a weeks-won-in-a-row counter.
  0.80.0 Plan view, part 3: Undo after moving, resizing, adding or unscheduling a block; a ⚠ marks blocks that overlap and the toolbar names what they overlap with; swipe sideways to change the day (Plan) or month (calendar), which you can switch off; new Settings for the clock (12 or 24 hour) and for which day the calendar week starts on.
  0.79.0 Plan view fixes: choose when your day starts and ends (Settings, default 6:00 to midnight); the block toolbar stays on screen while you scroll and is more compact; in Arabic the tick box no longer covers the title; unscheduled tasks with no date can be placed too; the calendar and Plan open on the same day; the red now line keeps moving.
  0.78.0 Time blocking, part 2: tap a block in the Plan view to select it, then nudge it 15 minutes earlier or later, make it shorter or longer, or tap a time to move it there. Quick add understands times and lengths ("Gym at 6pm for 1h", "Call 18:30 for 45 min"). New reminders before each block starts (Settings > Notifications: on/off and how long before).
  0.77.0 Time blocking: a new Plan view on the Tasks tab shows your day as a timeline. Give a task a start time and length (Edit task, or tap an empty time), or pick an unscheduled task and tap a time to place it. Overlapping blocks sit side by side, tap a block for details or tick it done, and Unschedule from its info sheet.
  0.76.0 Android keyboard, native fix: the app now applies the keyboard and system-bar space itself, once, instead of letting Capacitor pass the keyboard inset on to the web view as well (which could shrink the page twice and leave a blank band above the keyboard). This is the 0.74.5 app (tips, info sheets, auto backup, icons) with the keyboard layout fixed in the Android code.
  0.74.5 Keyboard, new approach: when you tap a text box inside a form (add task, add goal, calendar, search...), the form docks right above the keyboard like a chat box, so you always see what you type and the page never jumps to the end.
  0.74.4 Keyboard: tapping a field no longer scrolls to the end of the page. The page stays where it was and moves only as far as needed to keep the field visible above the keyboard.
  0.74.3 Keyboard: the page no longer scrolls into a blank area when you tap a field. The app now waits for the keyboard to finish opening, scrolls once (no animation), keeps the scroll inside the page and forces a repaint.
  0.74.2 Fixes the Android install ("package appears to be invalid"): the 0.74.0 and 0.74.1 APKs were stamped with version 0.0.0 by mistake, so Android refused them as a downgrade. No change inside the app.
  0.74.1 Fixes the Android download: the release was published as "GoalTerra-.apk" because the build could not read the app version after the code was reformatted. No change inside the app.
  0.74.0 Icons and cleanup: pick an icon for any task, goal or habit (Edit → Icon) and see it next to the name; fixes a large blank gap at the bottom of the page while the keyboard is open in the Android app (the app now uses the safe-area value Capacitor provides, which is zero while the keyboard is open); and a code tidy-up for readers (documented files, consistent formatting) with no change in behaviour.
  0.73.1 Fix: typing with the on-screen keyboard could scroll the page to the blank space at the end. The layout now resizes with the keyboard, the bottom tab bar hides while you type, and the field you are typing in is kept in view.
  0.73.0 Info sheets and automatic backup: tap a task, a goal or the week boss to see its full details (with Edit, Done and Focus buttons); Select mode is more reliable (tap anywhere on a row, long-press a task or habit to start, Back or Escape leaves, Select and Calendar no longer scroll off screen); and Settings → Storage & backup has an automatic daily backup at a time you choose. In the Android app it saves silently to Documents/GoalTerra (last 7 kept) when the app is open after that time and rings a reminder at that time; in a browser it shows a Back up now card.
  0.72.1 Tip cards: each tab shows one short, dismissible lesson the first time (day levels and Game mode on the Dashboard, quick add, goal ladder, build vs avoid habits, how Study picks work). Dismissed tips stay hidden; Settings has Show tips again.
  0.72.0 Declutter: the Dashboard now shows today's tasks first, with the game, stats and coach below; the game card shows just the boss and HP until you tap Details; the three goal buttons became Plan this week plus a menu; done tasks collapse under a single "N done" row and show their date once; task filters stay on one line and the add box hints at quick-add words; number goals lose the redundant tick; the Study tab shows 5 picks and starts with subjects collapsed; Habits' add form sits behind "+ New habit"; Settings groups are collapsible sections; backup has two main buttons (Back up now, Restore) with the rest under Advanced; and every confirm, prompt and alert is now an in-app dialog instead of a browser pop-up.
  0.71.1 Fix (Android app): a white strip with a squashed logo showed under the status bar on some phones. The space behind the status bar now takes the app's background colour and follows theme and palette changes
  0.71.0 Android app support: when this file runs inside the GoalTerra Android app it uses the phone directly. Backups and exports save to Documents/GoalTerra and open the share sheet, sharing with friends uses the share sheet, the back button closes dialogs and returns to Home, the status bar follows the theme, and reminders arrive as notifications (morning plan, evening check-in, classes, exams, focus timer, backup). In a browser nothing changes. Import also accepts backup files that Android labels as plain text
  0.70.0 Release candidate: a saved test suite in tests/ (development only, never part of this file) covering every screen in light, dark and Arabic, the README rewritten for GoalTerra with fresh demo screenshots, and no feature changes
  0.69.0 Speed and accessibility: the game engine now computes everything in one pass and reuses the result until your data changes, so the Dashboard renders about 5x faster with years of data (tested with 5,000 tasks and 3 years of check-ins: about 40 ms). Colours adjusted so every text and button passes 4.5:1 contrast in all six palettes and in light, dark and Black (Clay's orange is a little deeper). Form fields that had no label now have one for screen readers
  0.68.0 Insights 2.0: the weekly report now shows how many Spark, Blaze and Titan days you had, focus time, and (in Game mode) the week's boss and whether you beat it. New monthly review: tasks done and missed, habit rate, focus time, level days, your best week, goals finished at every level, this month's goals with progress, and the month's guardian. Open it from the Dashboard next to Weekly report
  0.67.0 Backup safety: one-tap Back up now (on the reminder card and in Settings) saves a dated goalterra-YYYY-MM-DD.json file. Restoring now shows a preview first: what the backup holds, when it was made, and how it compares with your data today, with a warning if it would remove items. The backup reminder escalates: after 30 days without a backup it turns red and can only be snoozed for a day
  0.66.0 Templates and try-it mode: start from a ready-made ladder (School year, Learn a skill, Get fit) with goals at every level plus matching habits, from the intro, an empty Goals tab or Settings → Your data. Or load sample data to explore the app; a banner lets you clear it in one tap, and only sample items are removed, never your own
  0.65.0 Class timetable (student mode): add your classes with weekday, start and end time and room on the Study tab. The week starts on Saturday, Sunday or Monday to match your school, today's classes show on the Dashboard with the next one highlighted, and Today's picks put subjects you have class in today first
  0.64.0 Game mode, rewards: every weekly boss you beat earns a 🛌 rest token; spend one on today or yesterday and no streak breaks and the boss can't counterattack that day. Attach your own real reward (🎁 "movie night") to the weekly boss, the month's guardian or the year's boss, and claim it when you win. Checklist items now deal their share of a task's damage as you tick them, so big tasks hit as you go
  0.63.0 Game mode, shields and counterattacks: a day that ends with no damage lets the weekly boss counterattack. Each clean day on an avoid habit charges a shield (up to 3) that blocks one counterattack; an unblocked one costs 25 Morale, and any day with damage restores 10. At 0 Morale you're knocked out: the boss heals 20% and Morale resets. You never lose XP, levels or the Bestiary. Counts only from the day Game mode was turned on; an evening warning appears on days with no damage yet
  0.62.0 Game mode, exam elites (student mode): every exam and quiz spawns an elite monster. Study sessions on that subject in the 3 weeks before charge your preparation bar (exam 60, quiz 30), and the score you log afterwards decides it: defeated at your target (60% by default, set in Settings → Game mode) or escaped. Beaten elites add bonus XP (50 exam, 25 quiz) and join the Bestiary
  0.61.0 Game mode, the tower: each month has a crowned guardian you beat with weekly wins and finished monthly goals (HP = the weeks in that month), each year an annual boss beaten by guardians and finished annual goals (HP 10), and your 5-year goal is the final boss. A Tower card sits on top of the goal ladder, the Dashboard boss card shows the guardian, and the Bestiary keeps guardians and annual bosses too. Past months count straight away
  0.60.0 Calendar view in Tasks: a month grid shows how many tasks are due each day (red when overdue) and how many you finished. Tap a day to see its tasks, tick them, and add new ones straight onto that date (smart quick add works there too)
  0.59.0 Focus timer: start a focus session from any task's ⋯ menu. A bar above the tabs counts down (pause, resume or stop), then a short break follows. Finished minutes are saved on the task (⏱ on its row) and, in Game mode, every 5 focused minutes deal 2 damage to the weekly boss. The timer keeps correct time if the screen locks or you leave the app. Focus and break lengths are in Settings → Tasks
  0.58.0 Smart quick add: type "Essay tomorrow !high #uni" and the due date, priority and tag fill themselves. Understands today, tomorrow, weekday names, in 3 days, next week, 25 oct and 25/10 at the end, plus Arabic (اليوم، غدًا، بكرة، باچر، بعد غد، الخميس، بعد 3 أيام). A preview under the box shows what it understood. Works in the ladder's + Task too
  0.57.0 Habits tab split: habits you build and habits you avoid now sit in their own sections (✅ Build and 🛡 Avoid), each with its own count for today; folders still work inside each section
  0.56.0 Arabic, complete: the day banner, all three coach tones, quota and pull-in buttons, Titan prompts, trash and bulk messages, goal planning text and screen-reader labels are now in Arabic. Beast-mode wording in prompts is now Titan
  0.55.0 Calmer Goals tab: the Ladder is now one card per top goal with a thin guide line instead of boxes inside boxes, a small level label (Week, Month, Year, 5 Yr), the percentage on the right, slimmer bars, and a + Task button instead of an always-open input; period labels only show under All periods; shorter tab names. More themes: six colour palettes (Clay, Terra, Ocean, Grape, Rose, Graphite) that work in light and dark, plus a Black (OLED) mode
  0.54.0 Game mode (Settings → Game mode, off by default): every week a generated 8-bit boss appears on the Dashboard, and finishing tasks, habits and study sessions deals damage (priority, early/late, weekly-goal link, Titan crits). Its HP comes from the week you planned, so it can't be sandbagged. Hero level from lifetime XP, four stats earned from what you actually do, and a Bestiary of every boss you beat or let escape. Past weeks count straight away
  0.53.0 Task countdown: the due pill on each task now says Today, Tomorrow, 3 days left or 2 days late (amber when 3 days or less remain); dates more than a week away still show the date, and the exact date is in the tooltip
  0.52.0 New name and logo: the app is now GoalTerra, with the orbit logo in the header, the intro, the browser tab icon and the home-screen icon. Your data, backups and shared files are unaffected
  0.51.0 Level calendar: tap the day banner or the coach message to see a month calendar where every day shows its level (⚡ Spark, 🔥 Blaze, ⚔️ Titan), with monthly counts and the tasks you finished on any day you tap. New first-run intro walks through the goal ladder, day levels, habits, student mode and language; replay it from Settings
  0.50.0 Day levels replace the coach modes: how many tasks you finish today sets your level (Spark, Blaze, Titan). A banner on top of the Dashboard shows today's level and your streak, the coach message gets tougher as you level up, and Titan days switch on the quota and push-back friction. Thresholds are adjustable in Settings
  0.49.0 Monk is now Beast mode and it changes behaviour: a daily quota (your 7-day average + 1) with one-tap fill from future tasks, and a typed reason is required to push back, reschedule or delete work that is due; pushed tasks show ↻ N×
  0.48.0 Coach personalities: Friend (easy), Coach (medium), Monk (hard), or Off; pick in Settings
  0.47.0 Dashboard coach: task stats (today vs your 7-day average, best day, active-day streak) and a challenge message that pushes you to finish more or pull tasks forward from future dates; tone is Challenge, Gentle or Off in Settings
  0.46.0 Goals: new Ladder view (default) shows the whole goal tree with tasks under each goal, tick tasks and add new ones in place, weekly 'tasks left' summary; one-line quick add; tasks can only link to weekly goals
  0.45.1 Dashboard is much shorter: one compact row of tiles, today's tasks/goals/habits first, charts and consistency tucked into a collapsed Insights card
  0.45.0 Tasks tab redesign to match Exams: one-line quick add with a More options drawer, due date as a pill, priority as a coloured edge, and a single ⋯ menu per task (edit, share, archive, delete)
  0.44.0 Select mode for tasks and habits (bulk date, priority, tag, goal, folder, schedule, done, archive, delete); Trash in Settings keeps deleted tasks and habits for 30 days; Student compact mode (tighter layout everywhere)
  0.43.1 Habit consistency card lists Avoid habits in their own "Staying clean" group (% clean, 🛡 streak)
  0.43.0 Dashboard: Avoid habits get their own "Staying clean" section (clean/slipped state, Log slip button) and their own tiles; they no longer count in "Habits done today" or "Best habit streak"
  0.42.0 Study: tap a day cell and pick Weak / OK / Strong / Clear from a small menu, so any rating takes two taps instead of cycling through colours
  0.41.1 Fix: screen flashed for a moment after pressing a button (the page-enter animation replayed on every redraw; it now plays only when you change tabs)
  0.41.0 Polish: redesigned Study tab (stat tiles, agenda-style exams, one-tap Weak/OK/Strong ratings on today's picks, tidier insights); smooth animations across the app (page transitions, staggered cards, press feedback, pop on tick, animated bars, dialog open); respects reduced-motion
  0.40.0 Final quality pass: Study tab 12x faster with hundreds of topics and exams (cached exam lookups and review dates), Tasks tab shows the 40 newest completed tasks with a Show all button (lighter on big lists), Arabic dictionary updated
  0.39.0 Safer restore: rows are validated first (bad rows skipped and reported), settings are filtered, language/student mode apply immediately, and if a restore fails midway your previous data is put back; share dialog keyboard-friendly; dialogs announce their title to screen readers
  0.38.0 Share button on every task, habit, exam and topic: opens the share dialog with just that item ready to send (Settings entry still shares several at once)
  0.37.0 Study insights: per-subject summary (strong/OK/weak/new bar, last studied, due topics, days to exam), a 14-day chart of topics studied per day, and a Study section in the weekly report when student mode is on
  0.36.0 Spaced repetition: every topic gets a next-review date from its latest colour (Weak 1 day, OK 3 days, Strong 1/3/7/14/30 growing with consecutive Strong ratings, shorter before an exam); due topics lead Today's picks and show a Due badge; intervals editable in Settings
  0.35.0 Share with friends (Settings → Share): pick habits, tasks/homework, exams/quizzes and topics, send them as copied text, a .json file or the phone's share sheet; friends import them from a preview (duplicates skipped, no history or personal data included)
  0.34.0 Arabic language support (Settings → Language): full right-to-left layout, Arabic text, dates in Arabic; switch back to English any time
  0.33.0 Exam and quiz logger (Study tab): add exams and quizzes with date, time and subject, countdowns and Dashboard warnings, log scores afterwards, and picks favour subjects with an exam coming up
  0.32.0 Student mode (Settings → Student mode): a Study tab with a retrospective revision timetable. Subjects and topics, tap a day to log a study session with a Weak/OK/Strong colour, daily picks list (weakest and untouched topics first)
  0.31.0 Setting for avoid habits: a day counts as clean unless you log a slip (default) or as a slip unless you confirm it clean; can also be changed per habit (existing check-ins are flipped so history stays correct)
  0.30.0 More task settings: default due date, sort order, tag folders on/off, auto-archive finished tasks, default filter, show/hide notes and checklist on rows, overdue on the Dashboard
  0.29.0 Settings tab (was Data): sounds, theme, hide-done, compact, avoid-habit hiding, delete confirmations, dashboard sections, default task priority, completed-tasks section; backup tools moved under "Your data". Week-start option skipped (touches every week calculation)
  0.28.0 Negative habits ("Avoid" type): things to quit, e.g. no smoking. Every day counts as clean unless you tap it to mark a slip; streak = clean days in a row
  0.27.2 Archived tasks are only reachable from the Data tab (removed the archived-count link from the Tasks tab)
  0.27.1 Fix: goals no longer complete early. A goal at 99.6% used to round up to 100% and auto-complete; progress now only reaches 100% when the target is truly met
  0.27.0 Removed the focus timer
  0.26.0 Task tag folders: give a task a tag and open tasks group into collapsible folders per tag with done counts; with "Hide done today" a habit folder disappears once everything in it is done
  0.25.0 Quality pass: timer clears itself if its goal was deleted; checked speed on 2 years of data with every new feature, old backups (no checklists/schedules/order) load and render in every view
  0.24.0 Reorder habits and folders: Habits tab → Reorder shows ▲▼ on every habit (within its folder) and every folder; order is remembered
  0.23.0 Weekly report (Dashboard → Weekly report): tasks done and missed, habit completion per habit, weekly goal progress and goals finished; browse earlier weeks
  0.22.0 Undo after deleting a task, goal, habit or the completed-archive clean-up: a 6-second Undo button restores it with its links and history
  0.21.0 Focus timer (⏱ in the header): pick a number goal measured in hours or minutes, start, stop: the time is added to the goal; survives reload
  0.20.0 Search (🔍 in the header): finds tasks (including archived and checklist items), goals and habits as you type; tap a result to open it
  0.19.0 Checklists inside tasks: one item per line, tick items off from the task row, "2/4" progress chip; repeats start with a fresh checklist
  0.18.0 Repeating tasks (daily / weekdays / weekly / monthly): completing one creates the next occurrence; un-ticking removes it
  0.17.0 Habit schedules: pick the days a habit is due; streaks skip days off, rates count only due days, today lists and
         folders only include habits due today
  0.16.0 Quality pass: cached date formatters (2 years of data: Tasks tab 60→20 ms, dashboard 18→10 ms, archive 21→6 ms,
         all-periods goals 30→5 ms); aria-labels on every icon button; visible keyboard focus rings
  0.15.0 Weekly planning: "Plan this week" lists monthly goals with open slots and adds weekly steps under them (checkbox or number);
         dashboard prompt when the week has no goals or on Sunday/Monday with open slots
  0.14.0 Native-app feel on phones: bottom tab bar with icons, slimmer header, safe-area padding, theme-colour status bar,
         no tap flash / pull-to-refresh bounce, 32px+ tap targets; toast sits above the tab bar; fix: main content had no top/bottom padding (cards touched the header)
  0.13.0 Backup reminders: last-backup time on the Data tab, dashboard nudge (one-tap copy) when there is no backup or it is >7 days old,
         ask the browser to protect storage from eviction and show whether it is; habit edit/delete buttons get aria-labels
  0.12.0 Habit folders: group habits into sections that turn green when every habit in them is done today; fanfare on finishing a folder
  0.11.0 Compact view toggle for the Habits tab (one tight row per habit, remembered)
  0.10.0 Goals rework: checkbox / number-target / built-from-sub-goals kinds; parents auto-complete only when all expected
         sub-goals are done (cascades up, un-ticking reopens); period-end review (hit / missed / carry over); manual slider removed
  0.9.0  Completed tasks stay in the Tasks tab (dimmed, at the bottom); task notes; confirm before deleting; archive with full task details and "delete completed"
  0.8.0  "Defeat" sound when unchecking; dashboard shows only today's tasks and habits (one-tap check for today)
  0.7.0  Hide habits already done today; completion sounds with on/off switch; version shown in Data tab
  0.6.0  Habit history calendar: toggle any past day, ★ marks the creation day, best streak
  0.5.1  Fix: empty (0 KB) exports on Android; copy/paste backup as text; clearer import errors
  0.5.0  (Installable PWA edition only, no single-file changes)
  0.4.0  Edit tasks, goals and habits after creation
  0.3.0  Dashboard: activity heatmap, tasks chart, goal rings, habit consistency
  0.2.0  Light/dark/auto theme, warmer palette
  0.1.0  First build: tasks, weekly/monthly/annual/5-year goals, habits, IndexedDB storage, JSON export/import
-->

.pal {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--card);
  box-shadow: 0 0 0 1px var(--line);
  cursor: pointer;
  padding: 0;
}
.pal.on {
  box-shadow: 0 0 0 2px var(--text);
}
.top .right {
  display: flex;
  align-items: center;
  gap: 10px;
}
#themeBtn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  border-radius: 999px;
  padding: 5px 11px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
* {
  box-sizing: border-box;
}
html {
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
button,
.chip,
[role='button'],
input[type='checkbox'] {
  touch-action: manipulation;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font:
    15px/1.45 system-ui,
    -apple-system,
    'Segoe UI',
    Roboto,
    sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 16px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0 8px;
}
.top h1 {
  font-size: 19px;
  margin: 0;
  white-space: nowrap;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 7px;
}
.top h1 .lt {
  color: #237a53;
}
.top h1 svg {
  flex: none;
}
:root {
  --logo-ring: transparent;
  --logo-orbit: #2e9e6b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --logo-ring: #5cc2b5;
    --logo-orbit: #3dbe82;
  }
  :root:not([data-theme='light']) .top h1 .lt {
    color: #5bc48e;
  }
}
:root[data-theme='dark'],
:root[data-theme='black'] {
  --logo-ring: #5cc2b5;
  --logo-orbit: #3dbe82;
}
:root[data-theme='dark'] .top h1 .lt,
:root[data-theme='black'] .top h1 .lt {
  color: #5bc48e;
}
.top .date {
  color: var(--muted);
  font-size: 13px;
}
nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 10px;
}
nav button {
  flex: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 7px 13px;
  border-radius: 999px;
  font: inherit;
  cursor: pointer;
}
nav button.on {
  background: var(--soft);
  color: var(--accent);
  font-weight: 600;
}
main.wrap {
  padding-top: 18px;
  padding-bottom: 60px;
}
h2 {
  font-size: 16px;
  margin: 22px 0 10px;
}
h2:first-child {
  margin-top: 0;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.stat .n {
  font-size: 24px;
  font-weight: 700;
}
.stat .l {
  color: var(--muted);
  font-size: 12.5px;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 720px) {
  .grid2 {
    grid-template-columns: 1fr;
  }
}
form.add {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
input,
select,
textarea {
  font: inherit;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  min-width: 0;
}
input[type='text'],
textarea {
  flex: 1 1 220px;
}
textarea {
  flex-basis: 100%;
  min-height: 54px;
  resize: vertical;
}
button.btn {
  font: inherit;
  border: 0;
  border-radius: 10px;
  padding: 8px 14px;
  background: var(--accent);
  color: var(--on-accent);
  cursor: pointer;
  font-weight: 600;
}
button.ghost {
  font: inherit;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 12px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
}
button.icon {
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 15px;
  padding: 4px 6px;
  border-radius: 8px;
}
button.icon:hover {
  background: var(--soft);
  color: var(--text);
}
ul.list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
}
.item input[type='checkbox'] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  flex: none;
}
.grow {
  flex: 1;
  min-width: 0;
}
.title {
  font-weight: 550;
  overflow-wrap: anywhere;
}
.meta {
  color: var(--muted);
  font-size: 12.5px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  margin-top: 2px;
}
.done .title {
  text-decoration: line-through;
  color: var(--muted);
}
.item.dim {
  opacity: 0.55;
  transition: opacity 0.15s;
}
.item.dim:hover,
.item.dim:focus-within {
  opacity: 0.85;
}
.subs {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  display: grid;
  gap: 2px;
}
.subs label {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 14px;
  min-height: 28px;
}
.subs .sdone span {
  text-decoration: line-through;
  color: var(--muted);
}
.srlist {
  display: grid;
  gap: 6px;
  margin: 10px 0;
  max-height: 50vh;
  overflow: auto;
}
.srow {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  gap: 2px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.srow span {
  color: var(--muted);
  font-size: 12px;
}
#searchBtn {
  background: none;
  border: 0;
  font-size: 18px;
  min-width: 36px;
  min-height: 36px;
  cursor: pointer;
}
.mv {
  display: inline-flex;
}
.mv .icon {
  padding: 0 6px;
}
[data-view][hidden] {
  display: none !important;
}
.tc {
  width: 100%;
  min-width: 0;
  height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  font: 600 11px/1.1 inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
.tc b {
  font-size: 13px;
  color: inherit;
}
.tc.c1 {
  background: #b4442f;
  border-color: #b4442f;
  color: #fff;
}
.tc.c2 {
  background: #d9a13b;
  border-color: #d9a13b;
  color: #2e2520;
}
.tc.c3 {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--on-ok);
}
.tc.today {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.trow {
  padding: 8px 0;
  border-top: 1px dashed var(--line);
}
.trow:first-child {
  border-top: 0;
}
.trow .top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.trow .top .grow {
  min-width: 0;
}
.tgrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cdot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 5px;
  background: var(--line);
}
.cdot.c1 {
  background: #b4442f;
}
.cdot.c2 {
  background: #d9a13b;
}
.cdot.c3 {
  background: var(--ok);
}
[dir='rtl'] .srow {
  text-align: right;
}
[dir='rtl'] .cdot {
  margin-right: 0;
  margin-left: 5px;
}
[dir='rtl'] .kv span:last-child {
  text-align: left;
}
[dir='rtl'] .cd .star {
  right: auto;
  left: 3px;
}
[dir='rtl'] #toast button {
  margin-left: 0;
  margin-right: 10px;
}
[dir='rtl'] .backup-cta {
  padding-right: 16px;
  padding-left: 46px;
}
[dir='rtl'] .backup-cta .icon {
  right: auto;
  left: 8px;
}
[dir='rtl'] .daypick .dp-lbl {
  margin-right: 0;
  margin-left: 2px;
}
[dir='rtl'] .daypick .dp-hint {
  margin-left: 0;
  margin-right: 2px;
}
[dir='rtl'] input.sw::after {
  left: auto;
  right: 3px;
}
[dir='rtl'] input.sw:checked::after {
  transform: translateX(-18px);
}
[dir='rtl'] input[type='date'],
[dir='rtl'] input[type='time'],
[dir='rtl'] input[type='number'] {
  text-align: right;
}
.stack {
  display: flex;
  height: 10px;
  border-radius: 99px;
  overflow: hidden;
  background: var(--line);
  margin-top: 6px;
}
.stack .s3 {
  background: var(--ok);
}
.stack .s2 {
  background: #d9a13b;
}
.stack .s1 {
  background: #b4442f;
}
.stack .s0 {
  background: var(--line);
}
.sbars {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 84px;
  margin-top: 8px;
}
.sbar {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 3px;
  min-width: 0;
}
.sbar i {
  display: block;
  width: 100%;
  border-radius: 4px 4px 0 0;
  background: var(--line);
}
.sbar i.on {
  background: var(--accent);
}
.sbar span {
  font-size: 10px;
  color: var(--muted);
  line-height: 1;
}
/* ---- Study polish ---- */
.stiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.stile {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stile b {
  font-size: 26px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stile span {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.25;
}
.stile.hot b {
  color: #b4442f;
}
.stile.ok b {
  color: var(--ok);
}
.scard {
  margin-bottom: 12px;
}
.shead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 3px 10px;
  font: 600 12px/1.3 inherit;
  background: var(--line);
  color: var(--text);
  border: 0;
  white-space: nowrap;
}
.pill.hot {
  background: #b4442f;
  color: #fff;
}
.pill.soon {
  background: color-mix(in oklab, #d9a13b 26%, transparent);
  color: var(--text);
}
.pill.warm {
  background: #d9a13b;
  color: #2e2520;
}
.pill.ok {
  background: color-mix(in oklab, var(--ok) 22%, transparent);
  color: var(--ok);
}
.pill.warn {
  background: var(--soft);
  color: var(--accent);
  cursor: pointer;
}
.exrow {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px dashed var(--line);
}
.exrow:first-of-type {
  border-top: 0;
}
.datebox {
  flex: none;
  width: 46px;
  border-radius: 12px;
  background: var(--soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 0;
  line-height: 1.1;
}
.datebox small {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.datebox b {
  font-size: 19px;
}
.exrow.hot .datebox {
  background: #b4442f;
}
.exrow.hot .datebox small,
.exrow.hot .datebox b {
  color: #fff;
}
.exrow.warm .datebox {
  background: color-mix(in oklab, #d9a13b 45%, var(--card));
}
.exr {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex: none;
}
.mini {
  display: flex;
}
.mini .icon {
  min-width: 30px;
  min-height: 30px;
  opacity: 0.75;
}
.pick {
  border: 1px solid var(--line);
  border-inline-start: 4px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin-top: 8px;
  background: var(--card);
  overflow: hidden;
  max-height: 160px;
  transition:
    max-height 0.26s ease,
    opacity 0.22s ease,
    margin 0.26s ease,
    padding 0.26s ease,
    transform 0.26s ease;
}
.pick.c1 {
  border-inline-start-color: #b4442f;
}
.pick.c2 {
  border-inline-start-color: #d9a13b;
}
.pick.c3 {
  border-inline-start-color: var(--ok);
}
.pick.due {
  border-inline-start-color: #b4442f;
  background: color-mix(in oklab, #b4442f 6%, var(--card));
}
.pick.leaving {
  max-height: 0;
  opacity: 0;
  margin-top: 0;
  padding-top: 0;
  padding-bottom: 0;
  transform: translateX(24px);
}
[dir='rtl'] .pick.leaving {
  transform: translateX(-24px);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 5px;
}
.chip2 {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--line);
  color: var(--text);
}
.chip2.mute {
  background: transparent;
  color: var(--muted);
  padding-inline: 2px;
}
.chip2.due {
  background: #b4442f;
  color: #fff;
}
.rate {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 9px;
}
.rb {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  border-radius: 10px;
  min-height: 38px;
  font: 600 13px inherit;
  cursor: pointer;
  transition:
    background 0.15s,
    color 0.15s,
    border-color 0.15s,
    transform 0.12s;
}
.rb.c1:hover,
.rb.c1:focus-visible {
  background: #b4442f;
  border-color: #b4442f;
  color: #fff;
}
.rb.c2:hover,
.rb.c2:focus-visible {
  background: #d9a13b;
  border-color: #d9a13b;
  color: #2e2520;
}
.rb.c3:hover,
.rb.c3:focus-visible {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--on-ok);
}
.stack.thin {
  height: 6px;
  margin: 2px 2px 8px;
}
.hfolder.collapsed .stack.thin {
  margin-bottom: 2px;
}
.addtopics summary {
  cursor: pointer;
  font-weight: 650;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.addtopics summary::after {
  content: '+';
  font-size: 20px;
  line-height: 1;
  color: var(--accent);
  transition: transform 0.2s;
}
.addtopics[open] summary::after {
  transform: rotate(45deg);
}
.addtopics summary::-webkit-details-marker {
  display: none;
}
.legend {
  margin: 2px 0 12px;
  line-height: 1.7;
}
.celebrate .party {
  display: inline-block;
  font-size: 26px;
  animation: bob 1.4s ease-in-out infinite;
}
/* ---- Motion ---- */
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes popk {
  0% {
    transform: scale(0.82);
  }
  55% {
    transform: scale(1.14);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes growx {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes growy {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}
@keyframes dlgin {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fadek {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes bob {
  0%,
  100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-5px) rotate(8deg);
  }
}
@keyframes tabpop {
  0% {
    transform: scale(0.8);
  }
  60% {
    transform: scale(1.15);
  }
  100% {
    transform: scale(1);
  }
}
#app.enter > * {
  animation: rise 0.38s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
.pop {
  animation: popk 0.4s cubic-bezier(0.3, 1.5, 0.5, 1);
}
#app.enter .hf-bar > span,
#app.enter .stack > span,
#app.enter .bar > i,
#app.enter .bar > span {
  transform-origin: left center;
  animation: growx 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: 0.12s;
}
[dir='rtl'] #app.enter .hf-bar > span,
[dir='rtl'] #app.enter .stack > span,
[dir='rtl'] #app.enter .bar > i,
[dir='rtl'] #app.enter .bar > span {
  transform-origin: right center;
}
#app.enter .sbar > i {
  transform-origin: bottom;
  animation: growy 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: 0.15s;
}
dialog#editDlg[open] {
  animation: dlgin 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
}
dialog#editDlg[open]::backdrop {
  animation: fadek 0.24s ease;
}
button,
.chip,
.tc,
.day,
.tcheck,
.icon,
.rb,
.pill {
  transition:
    transform 0.12s ease,
    background-color 0.15s ease,
    border-color 0.15s ease,
    color 0.15s ease,
    opacity 0.15s ease;
}
button:active:not(:disabled),
.tc:active,
.day:active,
.rb:active {
  transform: scale(0.94);
}
.item,
.card,
.hfolder {
  transition:
    background-color 0.25s ease,
    border-color 0.25s ease,
    opacity 0.25s ease;
}
#tabbar button.on .ti svg {
  animation: tabpop 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
#cellMenu {
  position: fixed;
  z-index: 70;
  display: none;
  gap: 6px;
  padding: 6px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(40, 20, 5, 0.28);
}
#cellMenu.show {
  display: flex;
  animation: dlgin 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#cellMenu .rb {
  min-width: 64px;
  padding: 0 10px;
}
.tnotes {
  color: var(--muted);
  font-size: 13px;
  margin-top: 3px;
  white-space: pre-wrap;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  margin: 18px 0 8px;
}
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}
.arch-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.arch .kvs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 16px;
  margin-top: 10px;
  font-size: 13px;
}
@media (max-width: 520px) {
  .arch .kvs {
    grid-template-columns: 1fr;
  }
}
.kv {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px dashed var(--line);
  padding-bottom: 4px;
}
.kv span:first-child {
  color: var(--muted);
}
.kv span:last-child {
  text-align: right;
  overflow-wrap: anywhere;
}
.okc {
  color: var(--ok);
  font-weight: 600;
}
.arch.notdone .title {
  color: var(--muted);
}
button.danger {
  color: var(--bad);
}
.bar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.tag {
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--accent);
  font-size: 11.5px;
}
.p-high {
  color: var(--bad);
}
.p-med {
  color: var(--warn);
}
.overdue {
  color: var(--bad);
  font-weight: 600;
}
.seg {
  display: flex;
  gap: 4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 14px;
  overflow-x: auto;
}
.seg button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 7px 10px;
  border-radius: 9px;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.seg button.on {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}
.goals {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.goal .row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.bar {
  height: 8px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin: 10px 0 4px;
}
.bar span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.25s;
}
.goal.isdone .bar span {
  background: var(--ok);
}
.goal.isdone .title {
  color: var(--muted);
  text-decoration: line-through;
}
.goal input[type='range'] {
  width: 100%;
  accent-color: var(--accent);
  padding: 0;
  border: 0;
  background: transparent;
}
.notes {
  color: var(--muted);
  font-size: 13px;
  margin-top: 6px;
  white-space: pre-wrap;
}
.habit {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.days {
  display: flex;
  gap: 5px;
}
.habit .grow {
  flex: 1 1 150px;
}
@media (max-width: 520px) {
  .habit .days {
    width: 100%;
    justify-content: space-between;
  }
  .habit .day {
    flex: 1;
    max-width: 44px;
  }
}
.day {
  width: 34px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--card);
  color: var(--muted);
  font: 600 11px/1.1 inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.day b {
  font-size: 13px;
  color: var(--text);
}
.day.on {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--on-ok);
}
.day.slip {
  background: var(--bad, #b4442f);
  border-color: var(--bad, #b4442f);
  color: #fff;
}
.day.slip b {
  color: #fff;
}
.day.on b {
  color: var(--on-ok);
}
.day.today {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.heat {
  display: grid;
  grid-template-columns: repeat(28, 1fr);
  gap: 3px;
  width: 100%;
  margin-top: 8px;
}
.heat i {
  aspect-ratio: 1;
  border-radius: 3px;
  background: var(--line);
}
.heat i.on {
  background: var(--ok);
}
.streak {
  font-weight: 700;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 18px;
  border: 1px dashed var(--line);
  border-radius: 12px;
}
.filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  border-radius: 999px;
  padding: 5px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
.chip.on {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.banner {
  background: var(--banner-bg);
  color: var(--banner-text);
  padding: 8px 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 13px;
}
.settings .row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
/* ---------- Dashboard visuals ---------- */
:root {
  --h0: var(--line);
  --h1: color-mix(in oklab, var(--ok) 38%, var(--card));
  --h2: color-mix(in oklab, var(--ok) 60%, var(--card));
  --h3: color-mix(in oklab, var(--ok) 80%, var(--card));
  --h4: var(--ok);
}
.vcard {
  margin-top: 16px;
}
.vhead {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 10px;
}
.vhead .title {
  font-size: 14.5px;
}
.vhead .sub {
  color: var(--muted);
  font-size: 12.5px;
}
.hm-months {
  display: grid;
  grid-template-columns: repeat(26, 1fr);
  gap: 3px;
  font-size: 10.5px;
  color: var(--muted);
  margin-bottom: 3px;
  height: 13px;
}
.hm-months span {
  white-space: nowrap;
  overflow: visible;
}
.hm {
  display: grid;
  grid-template-columns: repeat(26, 1fr);
  grid-template-rows: repeat(7, auto);
  grid-auto-flow: column;
  gap: 3px;
}
.hm i {
  aspect-ratio: 1;
  border-radius: 3px;
  background: var(--h0);
}
.hm i.l1 {
  background: var(--h1);
}
.hm i.l2 {
  background: var(--h2);
}
.hm i.l3 {
  background: var(--h3);
}
.hm i.l4 {
  background: var(--h4);
}
.hm i.fut {
  background: transparent;
}
.hm i.tod {
  outline: 1.5px solid var(--accent);
  outline-offset: 1px;
}
.hm-legend {
  display: flex;
  align-items: center;
  gap: 4px;
  justify-content: flex-end;
  color: var(--muted);
  font-size: 11.5px;
  margin-top: 8px;
}
.hm-legend i {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  display: inline-block;
}
.hm-foot {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
}
.hm-foot .meta {
  margin: 0;
}
.rings {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  text-align: center;
}
.ring svg {
  width: 100%;
  max-width: 74px;
  height: auto;
  display: block;
  margin: 0 auto;
}
.ring .rt {
  fill: none;
  stroke: var(--line);
  stroke-width: 7;
}
.ring .rv {
  fill: none;
  stroke: var(--accent);
  stroke-width: 7;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dasharray 0.4s;
}
.ring .num {
  fill: var(--text);
  font:
    700 15px system-ui,
    sans-serif;
}
.ring .lbl {
  font-size: 12px;
  font-weight: 600;
  margin-top: 4px;
}
.ring .cnt {
  font-size: 11px;
  color: var(--muted);
}
.barchart svg {
  width: 100%;
  height: auto;
  display: block;
}
.barchart .bar {
  fill: var(--accent);
}
.barchart .bar.zero {
  fill: var(--line);
}
.barchart .hit {
  fill: transparent;
  cursor: default;
}
.barchart .hit:hover + .bar,
.barchart g:hover .bar {
  opacity: 0.8;
}
.barchart .ax {
  fill: var(--muted);
  font:
    10px system-ui,
    sans-serif;
}
.barchart .base {
  stroke: var(--line);
  stroke-width: 1;
}
.hbars {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.hbar .top {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  gap: 8px;
}
.hbar .top span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hbar .top span:last-child {
  color: var(--muted);
  flex: none;
}
.hbar .track {
  height: 8px;
  border-radius: 99px;
  background: var(--line);
  margin-top: 4px;
  overflow: hidden;
}
.hsub {
  margin: 14px 0 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.hbar.neg .fill {
  background: #2f9e6b;
}
.hbar .fill {
  height: 100%;
  border-radius: 99px;
  background: var(--ok);
}
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 720px) {
  .split {
    grid-template-columns: 1fr;
  }
}
dialog#editDlg {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  color: var(--text);
  padding: 18px;
  width: min(460px, calc(100vw - 32px));
  box-shadow: 0 18px 50px rgba(40, 20, 5, 0.25);
}
dialog#editDlg::backdrop {
  background: rgba(30, 18, 10, 0.45);
}
.filters.nowrap {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.filters.nowrap .chip {
  flex: none;
  white-space: nowrap;
}
.rpg:not(.open) .rpg-x {
  display: none;
}
.hbtns {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.chipmenu {
  position: relative;
  display: inline-block;
}
.chipmenu summary {
  list-style: none;
  cursor: pointer;
}
.chipmenu summary::-webkit-details-marker {
  display: none;
}
.chipmenu > div {
  position: absolute;
  inset-inline-end: 0;
  top: calc(100% + 4px);
  z-index: 6;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 150px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}
.setacc > .title {
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0;
  min-height: 30px;
}
.setacc > .title::after {
  content: '▸';
  color: var(--muted);
}
.setacc.open > .title::after {
  content: '▾';
}
.setacc:not(.open) > *:not(.title) {
  display: none;
}
.setacc.open > .title {
  margin-bottom: 8px;
}
.habadd {
  margin-bottom: 12px;
}
.tipcard {
  display: flex;
  gap: 10px;
  align-items: center;
  background: var(--soft);
  border-color: transparent;
}
.tipcard p {
  margin: 4px 0 0;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--text);
}
dialog#askDlg {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  color: var(--text);
  padding: 18px;
  width: min(380px, calc(100vw - 32px));
  box-shadow: 0 18px 50px rgba(40, 20, 5, 0.25);
}
dialog#askDlg::backdrop {
  background: rgba(30, 18, 10, 0.45);
}
#askMsg {
  margin: 0 0 12px;
  white-space: pre-wrap;
  line-height: 1.45;
}
#askDlg input {
  width: 100%;
  margin-bottom: 12px;
}
#askDlg .row {
  justify-content: flex-end;
  gap: 8px;
}

.dlg h3 {
  margin: 0 0 14px;
  font-size: 16px;
}
.dlg label {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin: 10px 0 4px;
}
.dlg input,
.dlg select,
.dlg textarea {
  width: 100%;
}
.dlg .two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.dlg .check {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-size: 14px;
  margin-top: 12px;
}
.dlg .check input {
  width: auto;
  accent-color: var(--accent);
}
.dlg-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}
/* ---------- Habit history ---------- */
.habit-open {
  cursor: pointer;
}
.habit-open .chev {
  color: var(--muted);
  font-weight: 400;
}
.hist-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.hist-top h3 {
  margin: 0;
  overflow-wrap: anywhere;
}
.hist-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 12px 0 14px;
  text-align: center;
}
.hist-stats div {
  background: var(--bg);
  border-radius: 10px;
  padding: 8px 4px;
}
.hist-stats b {
  display: block;
  font-size: 16px;
}
.hist-stats span {
  font-size: 11px;
  color: var(--muted);
}
.cal-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.cal-nav .icon {
  font-size: 24px;
  line-height: 1;
  padding: 2px 12px;
}
.cal-nav .icon:disabled {
  opacity: 0.3;
  cursor: default;
}
.cal {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.cal-wk {
  margin-bottom: 4px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.cd {
  position: relative;
  aspect-ratio: 1;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--text);
  font:
    600 13px system-ui,
    sans-serif;
  cursor: pointer;
  padding: 0;
  touch-action: manipulation;
}
.cd.on {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--on-ok);
}
.cd.tod {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.cd:disabled {
  opacity: 0.35;
  cursor: default;
}
.cd .star {
  position: absolute;
  top: 2px;
  right: 3px;
  font-size: 9px;
  font-style: normal;
  line-height: 1;
  color: var(--warn);
}
.cd.on .star {
  color: var(--on-ok);
}
.star-inline {
  font-style: normal;
  color: var(--warn);
}
.cal-foot {
  margin-top: 10px;
  justify-content: space-between;
}
.habits-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 12px;
}
.habits-bar h2 {
  margin: 0;
}
.habits-bar .meta {
  margin: 0;
}
.tcheck {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--card);
  color: transparent;
  font:
    700 16px/1 system-ui,
    sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition:
    background 0.15s,
    border-color 0.15s;
  touch-action: manipulation;
}
.tcheck:hover {
  border-color: var(--ok);
}
.tcheck.on {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--on-ok);
}
.allclear {
  color: var(--ok);
  font-weight: 600;
  text-align: center;
  padding: 18px;
  border: 1px dashed var(--line);
  border-radius: 12px;
}
/* ---------- Goals 0.10 ---------- */
.f-num,
.f-roll {
  display: none;
}
form[data-kind='number'] .f-num,
form[data-kind='rollup'] .f-roll {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  flex: 1 1 100%;
}
.dlg form[data-kind='number'] .f-num,
.dlg form[data-kind='rollup'] .f-roll {
  display: block;
}
.tag.t-ok {
  background: color-mix(in oklab, var(--ok) 18%, var(--card));
  color: var(--ok);
}
.tag.t-bad {
  background: color-mix(in oklab, var(--bad) 15%, var(--card));
  color: var(--bad);
}
.tag.t-warn {
  background: color-mix(in oklab, var(--warn) 18%, var(--card));
  color: var(--warn);
}
.goal.ismissed .bar span {
  background: var(--bad);
}
.goal.ismissed .title {
  color: var(--muted);
}
.numrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.numrow .ghost {
  width: 40px;
  height: 36px;
  padding: 0;
  font-size: 18px;
  font-weight: 700;
}
.numval {
  flex: 1;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font:
    700 15px system-ui,
    sans-serif;
  cursor: pointer;
}
.numval span {
  font-weight: 500;
  color: var(--muted);
}
.review-cta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  border-color: color-mix(in oklab, var(--warn) 45%, var(--line));
  background: color-mix(in oklab, var(--warn) 8%, var(--card));
}
.rv .rv-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.rv .rv-actions .ghost {
  flex: 1 1 auto;
  font-size: 13px;
  padding: 7px 8px;
}
.rv .rv-actions .ok {
  color: var(--ok);
}
.rv .rv-actions .bad {
  color: var(--bad);
}
.rv .rv-note {
  width: 100%;
  margin-top: 8px;
  font-size: 13px;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + var(--sab));
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  background: var(--text);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  transition: 0.2s;
  max-width: calc(100vw - 32px);
}
#toast.act {
  pointer-events: auto;
}
#toast button {
  margin-left: 10px;
  background: none;
  border: 1px solid currentColor;
  color: inherit;
  border-radius: 8px;
  padding: 2px 10px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
#focusBar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + var(--sab));
  z-index: 25;
  width: min(460px, calc(100vw - 24px));
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 8px 8px 14px;
  border-radius: 14px;
  background: var(--text);
  color: var(--bg);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
}
#focusBar[hidden] {
  display: none;
}
#focusBar .ft-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}
#focusBar .ft-ph {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.8;
}
#focusBar .ft-t {
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#focusBar .ft-time {
  font:
    700 20px/1 ui-monospace,
    Menlo,
    monospace;
  font-variant-numeric: tabular-nums;
}
#focusBar button {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid color-mix(in oklab, var(--bg) 35%, transparent);
  background: transparent;
  color: inherit;
  font: 600 15px inherit;
  cursor: pointer;
  flex: none;
}
#focusBar.brk {
  background: var(--ok);
  color: var(--on-ok);
}
body.ftOn main.wrap {
  padding-bottom: calc(150px + var(--sab));
}
@media (max-width: 700px) {
  #focusBar {
    bottom: calc(72px + var(--sab));
  }
}
/* ---------- Compact habits ---------- */
.card.hcompact {
  padding: 8px 12px;
}
.hcompact .habit {
  flex-wrap: nowrap;
  gap: 8px;
}

<script>
/**
 * Data layer and shared state: the IndexedDB wrapper (DB), small helpers (dates, escaping, ids), the state object S and load(), goal progress and syncing, the app version (APP_VERSION) and the L2 language helper.
 * (All src/js files are joined, in filename order, into one shared scope. See src/README.md.)
 */

/* ---------- Database (IndexedDB) ---------- */
const STORES = ['tasks', 'goals', 'habits', 'logs', 'topics', 'exams', 'trash'];
let DBV = 0;
const DB = {
  db: null,
  mem: null,
  open() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open('goal-tracker-db', 4);
        r.onupgradeneeded = () => {
          const d = r.result;
          STORES.forEach((s) => {
            if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
          });
        };
        r.onsuccess = () => {
          this.db = r.result;
          res(true);
        };
        r.onerror = () => {
          this.useMemory();
          res(false);
        };
      } catch (e) {
        this.useMemory();
        res(false);
      }
    });
  },
  useMemory() {
    this.mem = {};
    STORES.forEach((s) => (this.mem[s] = new Map()));
  },
  req(store, mode, fn) {
    if (this.mem) {
      return Promise.resolve(fn(null));
    }
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  all(s) {
    return this.mem ? Promise.resolve([...this.mem[s].values()]) : this.req(s, 'readonly', (st) => st.getAll());
  },
  put(s, v) {
    DBV++;
    if (this.mem) {
      this.mem[s].set(v.id, v);
      return Promise.resolve();
    }
    return this.req(s, 'readwrite', (st) => st.put(v));
  },
  del(s, id) {
    DBV++;
    if (this.mem) {
      this.mem[s].delete(id);
      return Promise.resolve();
    }
    return this.req(s, 'readwrite', (st) => st.delete(id));
  },
  clear(s) {
    DBV++;
    if (this.mem) {
      this.mem[s].clear();
      return Promise.resolve();
    }
    return this.req(s, 'readwrite', (st) => st.clear());
  },
};

/* ---------- Helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) =>
  String(s ?? '').replace(
    /[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
  );
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, '0');
const ds = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
};
const TODAY = () => ds(new Date());
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return `${y}-W${pad(w)}`;
}
const HORIZONS = { weekly: 'Weekly', monthly: 'Monthly', annual: 'Annual', five: '5-Year' };
const PARENT = { weekly: 'monthly', monthly: 'annual', annual: 'five', five: null };
function currentPeriod(h) {
  const d = new Date(),
    y = d.getFullYear();
  return h === 'weekly'
    ? isoWeek(d)
    : h === 'monthly'
      ? ds(d).slice(0, 7)
      : h === 'annual'
        ? String(y)
        : `${y}-${y + 4}`;
}
let LOCALE;
const _fmts = {};
// Creating a formatter is the slow part of toLocale*String, so build each one once and reuse it.
const fmt = (d, o) => {
  const k = LOCALE + JSON.stringify(o);
  return (_fmts[k] || (_fmts[k] = new Intl.DateTimeFormat(LOCALE, o))).format(d);
};
const fmtDate = (s) => {
  if (!s) return '';
  const d = new Date(s + 'T00:00');
  return fmt(d, { month: 'short', day: 'numeric' });
};

/* ---------- State ---------- */
const S = {
  tasks: [],
  goals: [],
  habits: [],
  topics: [],
  exams: [],
  logs: new Set(),
  view: 'dash',
  horizon: 'ladder',
  goalScope: 'current',
  taskFilter: 'open',
  persistent: true,
  trash: [],
  sel: new Set(),
  selMode: null,
};

const TRASH_DAYS = 30;
async function load() {
  S.persistent = await DB.open();
  const [t, g, h, l, tp, ex, tr] = await Promise.all(STORES.map((s) => DB.all(s)));
  const cut = Date.now() - TRASH_DAYS * 864e5;
  S.trash = (tr || []).filter((r) => r && r.data && (r.at || 0) >= cut);
  for (const r of tr || []) if (!S.trash.includes(r)) DB.del('trash', r.id);
  S.exams = ex;
  S.topics = tp;
  S.tasks = t;
  S.goals = g;
  S.habits = h;
  S.logs = new Set(l.map((x) => x.id));
}

/* ---------- Logic ---------- */
const goalById = (id) => S.goals.find((g) => g.id === id);
/* Goal kinds:
   check  – done when ticked, or automatically when all linked tasks are done
   number – target + unit (e.g. 40 hours); done automatically at 100%
   rollup – built from sub-goals; progress = sum of children ÷ EXPECTED count (not just the ones created so far),
            so one finished week can't complete a whole month */
const CHILD = { monthly: 'weekly', annual: 'monthly', five: 'annual' };
function goalKind(g) {
  return g.kind || (S.goals.some((c) => c.parentId === g.id) ? 'rollup' : 'check');
}
function periodEnd(h, p) {
  let m;
  if (h === 'weekly' && (m = /^(\d{4})-W(\d{2})$/.exec(p))) {
    const jan4 = new Date(+m[1], 0, 4);
    const mon = addDays(jan4, -((jan4.getDay() + 6) % 7) + (+m[2] - 1) * 7);
    return ds(addDays(mon, 6));
  }
  if (h === 'monthly' && (m = /^(\d{4})-(\d{2})$/.exec(p))) return ds(new Date(+m[1], +m[2], 0));
  if (h === 'annual' && (m = /^(\d{4})$/.exec(p))) return m[1] + '-12-31';
  if (h === 'five' && (m = /^(\d{4})-(\d{4})$/.exec(p))) return m[2] + '-12-31';
  return null;
}
function defaultExpected(g) {
  if (g.horizon === 'monthly') {
    const m = /^(\d{4})-(\d{2})$/.exec(g.period || '');
    if (!m) return 4;
    let n = 0;
    const days = new Date(+m[1], +m[2], 0).getDate();
    for (let d = 1; d <= days; d++) if (new Date(+m[1], +m[2] - 1, d).getDay() === 4) n++;
    return n;
  } // ISO weeks whose Thursday is in the month
  return { annual: 12, five: 5 }[g.horizon] || 1;
}
const expectedOf = (g) => Math.max(1, +g.expected || defaultExpected(g));
const fmtNum = (n) => String(+(+n || 0).toFixed(2));
function progressRaw(g, seen = new Set()) {
  if (seen.has(g.id)) return 0;
  seen.add(g.id);
  const k = goalKind(g);
  if (k === 'number') {
    const t = +g.target || 0;
    const v = +g.value || 0;
    return t <= 0 ? 0 : v >= t ? 100 : Math.min(99, Math.floor((v / t) * 100));
  }
  if (k === 'rollup') {
    const kids = S.goals.filter((c) => c.parentId === g.id);
    const n = Math.max(expectedOf(g), kids.length);
    const sum = kids.reduce((a, c) => a + progress(c, seen), 0);
    return sum >= n * 100 ? 100 : Math.min(99, Math.floor(sum / n));
  }
  const t = S.tasks.filter((x) => x.goalId === g.id);
  if (!t.length) return 0;
  const d = t.filter((x) => x.done).length;
  return d === t.length ? 100 : Math.min(99, Math.floor((d / t.length) * 100));
}
function progress(g, seen = new Set()) {
  return g.done ? 100 : progressRaw(g, seen);
}
function goalDetail(g) {
  const k = goalKind(g);
  if (k === 'number') return '';
  if (k === 'rollup') {
    const kids = S.goals.filter((c) => c.parentId === g.id),
      n = Math.max(expectedOf(g), kids.length),
      d = kids.filter((c) => c.done).length;
    const lbl = CHILD[g.horizon] ? HORIZONS[CHILD[g.horizon]].toLowerCase() : 'sub';
    return `${d} of ${n} ${lbl} goals done${kids.length < n ? ` · ${n - kids.length} still to plan` : ''}`;
  }
  const t = S.tasks.filter((x) => x.goalId === g.id);
  return t.length ? `${t.filter((x) => x.done).length}/${t.length} linked tasks done` : 'tick ✓ when done';
}
const needsReview = (g) => {
  if (g.done || g.status === 'missed') return false;
  const e = periodEnd(g.horizon, g.period);
  return !!e && e < TODAY();
};
// Auto-complete goals that reached 100% (cascading upward); reopen auto-completed ones that dropped below.
function syncGoals() {
  const changed = new Set(),
    newly = new Set();
  for (let pass = 0, dirty = true; dirty && pass < 10; pass++) {
    dirty = false;
    for (const g of S.goals) {
      if (g.status === 'missed') continue;
      const raw = progressRaw(g);
      if (g.manualOpen && raw < 100) {
        g.manualOpen = false;
        changed.add(g);
      }
      if (!g.done && !g.manualOpen && raw >= 100) {
        g.done = true;
        g.autoDone = true;
        g.doneAt = Date.now();
        changed.add(g);
        newly.add(g);
        dirty = true;
      } else if (g.done && g.autoDone && raw < 100) {
        g.done = false;
        g.autoDone = false;
        g.doneAt = null;
        changed.add(g);
        newly.delete(g);
        dirty = true;
      }
    }
  }
  for (const g of changed) DB.put('goals', g);
  return [...newly].filter((g) => g.done);
}
const logged = (hid, date) => S.logs.has(hid + '|' + date);
// "Avoid" habits: a logged day is a SLIP; every day from creation until today is clean unless slipped.
const isNeg = (h) => h.kind === 'avoid';
const bornK = (h) => ds(new Date(h.created || Date.now()));
const slipMode = (h) => isNeg(h) && h.mode !== 'confirm';
const good = (h, k) =>
  slipMode(h) ? k >= bornK(h) && k <= TODAY() && !S.logs.has(h.id + '|' + k) : S.logs.has(h.id + '|' + k);
const hname = (h) => (h.icon ? esc(h.icon) + ' ' : isNeg(h) ? '🚫 ' : '') + esc(h.name);
// Schedules: h.days = weekdays it's due (0=Sun…6=Sat); empty/missing = every day.
const hasSched = (h) => Array.isArray(h.days) && h.days.length > 0 && h.days.length < 7;
const isDue = (h, d) => !hasSched(h) || h.days.includes(d.getDay());
const dueToday = (h) => isDue(h, new Date());
const weekTarget = (h) => (hasSched(h) ? h.days.length : h.target || 7);
const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];
const schedText = (h) =>
  hasSched(h)
    ? DOW_ORDER.filter((n) => h.days.includes(n))
        .map((n) => fmt(new Date(2024, 0, n || 7), { weekday: 'short' }))
        .join(' · ')
    : '';
// Streak = consecutive DUE days done; days off neither break nor add to it (a check-in on a day off still counts).
let _rest = null;
const isRest = (k) => (_rest || (_rest = new Set((S.cfg.restDays || '').split(',').filter(Boolean)))).has(k);
function streak(h) {
  if (slipMode(h)) {
    let n = 0,
      d = new Date();
    for (let i = 0; i < 4000; i++) {
      const k = ds(d);
      if (good(h, k)) n++;
      else if (!isRest(k) || k < bornK(h)) break;
      d = addDays(d, -1);
    }
    return n;
  }
  let d = new Date();
  if (!good(h, ds(d))) d = addDays(d, -1);
  let n = 0;
  for (let i = 0; i < 1100; i++) {
    if (good(h, ds(d))) n++;
    else if (isDue(h, d) && !isRest(ds(d))) break;
    d = addDays(d, -1);
  }
  return n;
}
function weekCount(h) {
  const d = new Date();
  const dow = (d.getDay() + 6) % 7;
  let n = 0;
  for (let i = 0; i <= dow; i++) if (good(h, ds(addDays(d, -i)))) n++;
  return n;
}
function rate30(h) {
  let due = 0,
    n = 0;
  for (let i = 0; i < 30; i++) {
    const d = addDays(new Date(), -i);
    if (isNeg(h) && ds(d) < bornK(h)) continue;
    if (isDue(h, d)) {
      due++;
      if (good(h, ds(d))) n++;
    }
  }
  return due ? Math.min(100, Math.round((n / due) * 100)) : 0;
}

/* ---------- Version ---------- */
const APP_VERSION = '0.82.0';

/* Pick the English or Arabic text for the current language. Call it at render time, never while the file is loading. */
const L2 = (en, ar) => (S.cfg.lang === 'ar' ? ar : en);
/**
 * In-app replacements for the browser's confirm, prompt and alert: askConfirm, askPrompt, askAlert.
 * They are async, so always await them.
 * (All src/js files are joined, in filename order, into one shared scope. See src/README.md.)
 */

/* ---------- In-app dialogs (replace confirm / prompt / alert) ---------- */
function askUI(msg, o = {}) {
  return new Promise((res) => {
    const d = document.getElementById('askDlg'),
      inp = d.querySelector('#askIn'),
      no = d.querySelector('#askNo'),
      yes = d.querySelector('#askYes');
    d.querySelector('#askMsg').textContent = String(msg);
    inp.hidden = !o.input;
    inp.value = o.def == null ? '' : String(o.def);
    no.hidden = !!o.alertOnly;
    let out = o.input ? null : false;
    if (o.alertOnly) out = true;
    const fin = () => {
      d.removeEventListener('close', fin);
      res(out);
    };
    d.addEventListener('close', fin);
    yes.onclick = () => {
      out = o.input ? inp.value : true;
      d.close();
    };
    no.onclick = () => {
      out = o.input ? null : false;
      d.close();
    };
    inp.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        yes.click();
      }
    };
    if (!d.open) d.showModal();
    if (o.input)
      setTimeout(() => {
        inp.focus();
        inp.select();
      }, 40);
  });
}
const askConfirm = (m) => askUI(m),
  askPrompt = (m, def) => askUI(m, { input: true, def }),
  askAlert = (m) => askUI(m, { alertOnly: true });
/**
 * HTML for one task row (taskItem), one habit card (habitCard) and shared date formatting (fmtDay, dueLeft).
 * (All src/js files are joined, in filename order, into one shared scope. See src/README.md.)
 */

/* ---------- Components ---------- */
const ARCHIVE_ICON =
  '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>';
function fmtWhen(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const y = d.getFullYear() !== new Date().getFullYear();
  return fmt(d, {
    month: 'short',
    day: 'numeric',
    ...(y ? { year: 'numeric' } : {}),
    hour: 'numeric',
    minute: '2-digit',
  });
}
function fmtDay(s) {
  return s ? fmt(new Date(s + 'T00:00'), { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : '—';
}
function dueLeft(due) {
  const n = Math.round((new Date(due + 'T00:00') - new Date(TODAY() + 'T00:00')) / 864e5);
  const txt =
    n < 0
      ? `${-n} day${n === -1 ? '' : 's'} late`
      : n === 0
        ? 'Today'
        : n === 1
          ? 'Tomorrow'
          : n <= 7
            ? `${n} days left`
            : fmtDate(due);
  const cls = n < 0 ? 'hot' : n === 0 ? 'warm' : n <= 3 ? 'soon' : '';
  return `<span class="pill ${cls}" title="${fmtDay(due)}">${txt}</span>`;
}
function taskItem(t) {
  const g = t.goalId && goalById(t.goalId);
  const today = TODAY();
  const overdue = !t.done && t.due && t.due < today;
  const sm = selOn('tasks');
  const dp = t.done ? '' : t.due ? dueLeft(t.due) : '';
  return `<li class="item trow2 pr-${t.priority || 'low'} ${t.done ? 'done dim' : ''} ${sm && S.sel.has(t.id) ? 'selected' : ''}">
    ${sm ? selBox(t.id) : `<input type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done ? 'checked' : ''} aria-label="Complete">`}
    <div class="grow" ${sm ? `data-action="sel-toggle" data-id="${t.id}" role="button" tabindex="0"` : `data-action="info-task" data-id="${t.id}" role="button" tabindex="0"`}><div class="title">${iconPrefix(t)}${esc(t.title)}</div>
      ${t.notes && S.cfg.showNotes ? `<div class="tnotes">${esc(t.notes)}</div>` : ''}
      ${(t.items || []).length && S.cfg.showSubs ? `<ul class="subs">${t.items.map((it, i) => `<li><label class="${it.done ? 'sdone' : ''}"><input type="checkbox" data-action="toggle-sub" data-id="${t.id}" data-i="${i}" ${it.done ? 'checked' : ''}><span>${esc(it.text)}</span></label></li>`).join('')}</ul>` : ''}
      <div class="meta">
        ${(t.items || []).length ? `<span title="Checklist">☑ ${t.items.filter((i) => i.done).length}/${t.items.length}</span>` : ''}
        ${t.done && t.doneAt ? `<span>Done ${fmtWhen(t.doneAt)}</span>` : ''}
        ${t.done && t.due && !(t.doneAt && ds(new Date(t.doneAt)) === t.due) ? `<span>${fmtDate(t.due)}</span>` : ''}
        ${isBlock(t) && !t.done ? `<span title="${L2('Scheduled', 'مجدولة')}">🕐 ${blockTime(t)}</span>` : ''}
        ${t.tag ? `<span class="tag">#${esc(t.tag)}</span>` : ''}
        ${t.focus ? `<span title="Focus time">⏱ ${fmtMin(t.focus)}</span>` : ''}
        ${(t.pushes || []).length ? `<span title="Pushed back: ${esc(t.pushes[t.pushes.length - 1].why)}">↻ ${t.pushes.length}×</span>` : ''}
        ${t.repeat ? `<span title="Repeats">🔁 ${REPEAT_LABEL[t.repeat] || ''}</span>` : ''}
        ${g ? `<span class="tag">${esc(g.title)}</span>` : ''}

async function trashAdd(kind, data, logs, links) {
  const r = { id: kind + ':' + data.id, kind, at: Date.now(), data, logs: logs || [] };
  if (links) r.links = links;
  S.trash = S.trash.filter((x) => x.id !== r.id);

}
async function removeTasks(list) {
  for (const t of list) {

    await DB.del('tasks', t.id);
    await trashAdd('task', t);
  }
}
async function removeHabits(list) {
  for (const h of list) {
    const keys = [...S.logs].filter((k) => k.startsWith(h.id + '|'));
    S.habits = S.habits.filter((x) => x.id !== h.id);
    await DB.del('habits', h.id);
    for (const k of keys) {
      S.logs.delete(k);
      await DB.del('logs', k);
    }
    await trashAdd('habit', h, keys);
  }
}
async function trashRestore(id) {
  const r = S.trash.find((x) => x.id === id);
  if (!r) return;
  if (r.kind === 'task') {
    if (!S.tasks.some((x) => x.id === r.data.id)) {
      S.tasks.push(r.data);
      await DB.put('tasks', r.data);
    }
  } else if (r.kind === 'goal') {
    if (!S.goals.some((x) => x.id === r.data.id)) {
      S.goals.push(r.data);
      await DB.put('goals', r.data);
      for (const t of S.tasks.filter((x) => (r.links?.tasks || []).includes(x.id) && !x.goalId)) {
        t.goalId = r.data.id;
        await DB.put('tasks', t);
      }
      for (const c of S.goals.filter((x) => (r.links?.goals || []).includes(x.id) && !x.parentId)) {
        c.parentId = r.data.id;
        await DB.put('goals', c);
      }
    }
  } else if (r.kind === 'exam' || r.kind === 'topic') {
    const st = r.kind === 'exam' ? 'exams' : 'topics';
    if (!S[st].some((x) => x.id === r.data.id)) {
      S[st].push(r.data);
      await DB.put(st, r.data);
    }
  } else {
    if (!S.habits.some((x) => x.id === r.data.id)) {
      S.habits.push(r.data);
      await DB.put('habits', r.data);
    }
    for (const k of r.logs || []) {
      const i = k.lastIndexOf('|');
      S.logs.add(k);
      await DB.put('logs', { id: k, habitId: k.slice(0, i), date: k.slice(i + 1) });
    }
  }
  S.trash = S.trash.filter((x) => x.id !== id);
  await DB.del('trash', id);
}

async function applyBulk(kind, f) {
  const v = Object.fromEntries(new FormData(f)),
    ids = [...S.sel];
  const before = (kind === 'bulktasks' ? S.tasks : S.habits)
    .filter((x) => ids.includes(x.id))
    .map((x) => structuredClone(x));
  let n = 0;
  if (kind === 'bulktasks') {
    const lat = (t) => {
      const m = v.dmode;
      return (
        m === 'tomorrow' ||
        m === 'week' ||
        m === 'plus1' ||
        m === 'none' ||
        (m === 'pick' && v.due && v.due > (t.due || ''))
      );
    };
    let why = null;
    if (
      beastOn() &&
      ids.some((id) => {
        const t = S.tasks.find((x) => x.id === id);
        return t && !t.done && t.due && t.due <= TODAY() && lat(t);
      })
    ) {
      why = await askWhy('pushing these back');
      if (!why) {
        toast('Not applied. Titan wants a reason.');
        return false;
      }
    }
    for (const id of ids) {
      const t = S.tasks.find((x) => x.id === id);
      if (!t) continue;
      const m = v.dmode;
      if (why && !t.done && t.due && t.due <= TODAY() && lat(t))
        (t.pushes = t.pushes || []).push({ at: Date.now(), from: t.due, to: null, why });
      if (m === 'today') t.due = TODAY();
      else if (m === 'tomorrow') t.due = ds(addDays(new Date(), 1));
      else if (m === 'week') t.due = ds(addDays(new Date(), 7));
      else if (m === 'plus1') t.due = ds(addDays(new Date((t.due || TODAY()) + 'T00:00'), 1));
      else if (m === 'pick' && v.due) t.due = v.due;
      else if (m === 'none') t.due = null;
      if (v.priority) t.priority = v.priority;
      if (v.notag) t.tag = '';
      else if ((v.tag || '').trim()) t.tag = v.tag.trim();
      if (v.goalId === '-') t.goalId = null;
      else if (v.goalId) t.goalId = v.goalId;
      await DB.put('tasks', t);
      n++;
    }
  } else {
    const days = v.setdays ? readDays(f) : null;
    for (const id of ids) {
      const h = S.habits.find((x) => x.id === id);
      if (!h) continue;
      if (v.nogroup) h.group = '';
      else if ((v.group || '').trim()) h.group = v.group.trim();
      if (!isNeg(h)) {
        if (v.target) h.target = +v.target;
        if (days) h.days = days;
      }
      await DB.put('habits', h);
      n++;
    }
  }
  S.selMode = null;
  S.sel.clear();
  const bk = kind === 'bulktasks' ? 'tasks' : 'habits';
  toastUndo(`Updated ${n} ${kind === 'bulktasks' ? 'task' : 'habit'}${n === 1 ? '' : 's'}.`, async () => {
    for (const b of before) {
      const i = S[bk].findIndex((x) => x.id === b.id);
      if (i >= 0) S[bk][i] = b;
      else S[bk].push(b);
      await DB.put(bk, b);
    }
  });
}

    changed = S._lv !== S.view;

    app.classList.remove('enter');
    [...app.children].forEach((c, i) => c.style.setProperty('--i', Math.min(i, 9)));

    app.classList.add('enter');
    clearTimeout(S._enterT);

  } else if (!changed) {
    clearTimeout(S._enterT);
    app.classList.remove('enter');
  }
  if (S.popKey) {
    const q = S.popKey;

    let el = null;
    try {
      el = app.querySelector(q);
    } catch (_) {}

      el.classList.add('pop');

dlg.addEventListener('submit', async (e) => {

    } else if (v.status === 'missed') {

    } else {
      if (g.done && progressRaw(g) >= 100) g.manualOpen = true;
      g.done = false;
