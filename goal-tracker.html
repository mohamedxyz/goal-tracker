  GoalTerra (formerly Goal Tracker) — single-file edition
  Versioning: MAJOR.MINOR.PATCH (semver.org). Bump APP_VERSION below on every change.
    PATCH = bug fix · MINOR = new feature · MAJOR = breaks old backups or data

  Changelog
  0.67.0 Backup safety: one-tap Back up now (on the reminder card and in Settings) saves a dated goalterra-YYYY-MM-DD.json file. Restoring now shows a preview first: what the backup holds, when it was made, and how it compares with your data today, with a warning if it would remove items. The backup reminder escalates: after 30 days without a backup it turns red and can only be snoozed for a day
  0.66.0 Templates and try-it mode: start from a ready-made ladder (School year, Learn a skill, Get fit) with goals at every level plus matching habits, from the intro, an empty Goals tab or Settings → Your data. Or load sample data to explore the app; a banner lets you clear it in one tap, and only sample items are removed, never your own
  0.65.0 Class timetable (student mode): add your classes with weekday, start and end time and room on the Study tab. The week starts on Saturday, Sunday or Monday to match your school, today's classes show on the Dashboard with the next one highlighted, and Today's picks put subjects you have class in today first
  0.64.0 Game mode, rewards: every weekly boss you beat earns a 🛌 rest token; spend one on today or yesterday and no streak breaks and the boss can't counterattack that day. Attach your own real reward (🎁 "movie night") to the weekly boss, the month's guardian or the year's boss, and claim it when you win. Checklist items now deal their share of a task's damage as you tick them, so big tasks hit as you go
  0.63.0 Game mode, shields and counterattacks: a day that ends with no damage lets the weekly boss counterattack. Each clean day on an avoid habit charges a shield (up to 3) that blocks one counterattack; an unblocked one costs 25 Morale, and any day with damage restores 10. At 0 Morale you're knocked out: the boss heals 20% and Morale resets. You never lose XP, levels or the Bestiary. Counts only from the day Game mode was turned on; an evening warning appears on days with no damage yet
  0.62.0 Game mode, exam elites (student mode): every exam and quiz spawns an elite monster. Study sessions on that subject in the 3 weeks before charge your preparation bar (exam 60, quiz 30), and the score you log afterwards decides it: defeated at your target (60% by default, set in Settings → Game mode) or escaped. Beaten elites add bonus XP (50 exam, 25 quiz) and join the Bestiary
  0.61.0 Game mode, the tower: each month has a crowned guardian you beat with weekly wins and finished monthly goals (HP = the weeks in that month), each year an annual boss beaten by guardians and finished annual goals (HP 10), and your 5-year goal is the final boss. A Tower card sits on top of the goal ladder, the Dashboard boss card shows the guardian, and the Bestiary keeps guardians and annual bosses too. Past months count straight away
  0.60.0 Calendar view in Tasks: a month grid shows how many tasks are due each day (red when overdue) and how many you finished. Tap a day to see its tasks, tick them, and add new ones straight onto that date (smart quick add works there too)
  0.59.0 Focus timer: start a focus session from any task's ⋯ menu. A bar above the tabs counts down (pause, resume or stop), then a short break follows. Finished minutes are saved on the task (⏱ on its row) and, in Game mode, every 5 focused minutes deal 2 damage to the weekly boss. The timer keeps correct time if the screen locks or you leave the app. Focus and break lengths are in Settings → Tasks
  0.58.0 Smart quick add: type "Essay tomorrow !high #uni" and the due date, priority and tag fill themselves. Understands today, tomorrow, weekday names, in 3 days, next week, 25 oct and 25/10 at the end, plus Arabic (اليوم، غدًا، بكرة، باچر، بعد غد، الخميس، بعد 3 أيام). A preview under the box shows what it understood. Works in the ladder's + Task too
  0.57.0 Habits tab split: habits you build and habits you avoid now sit in their own sections (✅ Build and 🛡 Avoid), each with its own count for today; folders still work inside each section
  0.56.0 Arabic, complete: the day banner, all three coach tones, quota and pull-in buttons, Titan prompts, trash and bulk messages, goal planning text and screen-reader labels are now in Arabic. Beast-mode wording in prompts is now Titan
  0.55.0 Calmer Goals tab: the Ladder is now one card per top goal with a thin guide line instead of boxes inside boxes, a small level label (Week, Month, Year, 5 Yr), the percentage on the right, slimmer bars, and a + Task button instead of an always-open input; period labels only show under All periods; shorter tab names. More themes: six colour palettes (Clay, Terra, Ocean, Grape, Rose, Graphite) that work in light and dark, plus a Black (OLED) mode
  0.54.0 Game mode (Settings → Game mode, off by default): every week a generated 8-bit boss appears on the Dashboard, and finishing tasks, habits and study sessions deals damage (priority, early/late, weekly-goal link, Titan crits). Its HP comes from the week you planned, so it can't be sandbagged. Hero level from lifetime XP, four stats earned from what you actually do, and a Bestiary of every boss you beat or let escape. Past weeks count straight away
  0.53.0 Task countdown: the due pill on each task now says Today, Tomorrow, 3 days left or 2 days late (amber when 3 days or less remain); dates more than a week away still show the date, and the exact date is in the tooltip
  0.52.0 New name and logo: the app is now GoalTerra, with the orbit logo in the header, the intro, the browser tab icon and the home-screen icon. Your data, backups and shared files are unaffected
  0.51.0 Level calendar: tap the day banner or the coach message to see a month calendar where every day shows its level (⚡ Spark, 🔥 Blaze, ⚔️ Titan), with monthly counts and the tasks you finished on any day you tap. New first-run intro walks through the goal ladder, day levels, habits, student mode and language; replay it from Settings
  0.50.0 Day levels replace the coach modes: how many tasks you finish today sets your level (Spark, Blaze, Titan). A banner on top of the Dashboard shows today's level and your streak, the coach message gets tougher as you level up, and Titan days switch on the quota and push-back friction. Thresholds are adjustable in Settings
  0.49.0 Monk is now Beast mode and it changes behaviour: a daily quota (your 7-day average + 1) with one-tap fill from future tasks, and a typed reason is required to push back, reschedule or delete work that is due; pushed tasks show ↻ N×
  0.48.0 Coach personalities: Friend (easy), Coach (medium), Monk (hard), or Off; pick in Settings
  0.47.0 Dashboard coach: task stats (today vs your 7-day average, best day, active-day streak) and a challenge message that pushes you to finish more or pull tasks forward from future dates; tone is Challenge, Gentle or Off in Settings
  0.46.0 Goals: new Ladder view (default) shows the whole goal tree with tasks under each goal, tick tasks and add new ones in place, weekly 'tasks left' summary; one-line quick add; tasks can only link to weekly goals
  0.45.1 Dashboard is much shorter: one compact row of tiles, today's tasks/goals/habits first, charts and consistency tucked into a collapsed Insights card
  0.45.0 Tasks tab redesign to match Exams: one-line quick add with a More options drawer, due date as a pill, priority as a coloured edge, and a single ⋯ menu per task (edit, share, archive, delete)
  0.44.0 Select mode for tasks and habits (bulk date, priority, tag, goal, folder, schedule, done, archive, delete); Trash in Settings keeps deleted tasks and habits for 30 days; Student compact mode (tighter layout everywhere)
  0.43.1 Habit consistency card lists Avoid habits in their own "Staying clean" group (% clean, 🛡 streak)
  0.43.0 Dashboard: Avoid habits get their own "Staying clean" section (clean/slipped state, Log slip button) and their own tiles; they no longer count in "Habits done today" or "Best current streak"
  0.42.0 Study: tap a day cell and pick Weak / OK / Strong / Clear from a small menu, so any rating takes two taps instead of cycling through colours
  0.41.1 Fix: screen flashed for a moment after pressing a button (the page-enter animation replayed on every redraw; it now plays only when you change tabs)
  0.41.0 Polish: redesigned Study tab (stat tiles, agenda-style exams, one-tap Weak/OK/Strong ratings on today's picks, tidier insights); smooth animations across the app (page transitions, staggered cards, press feedback, pop on tick, animated bars, dialog open); respects reduced-motion
  0.40.0 Final quality pass: Study tab 12x faster with hundreds of topics and exams (cached exam lookups and review dates), Tasks tab shows the 40 newest completed tasks with a Show all button (lighter on big lists), Arabic dictionary updated
  0.39.0 Safer restore: rows are validated first (bad rows skipped and reported), settings are filtered, language/student mode apply immediately, and if a restore fails midway your previous data is put back; share dialog keyboard-friendly; dialogs announce their title to screen readers
  0.38.0 Share button on every task, habit, exam and topic: opens the share dialog with just that item ready to send (Settings entry still shares several at once)
  0.37.0 Study insights: per-subject summary (strong/OK/weak/new bar, last studied, due topics, days to exam), a 14-day chart of topics studied per day, and a Study section in the weekly report when student mode is on
  0.36.0 Spaced repetition: every topic gets a next-review date from its latest colour (Weak 1 day, OK 3 days, Strong 1/3/7/14/30 growing with consecutive Strong ratings, shorter before an exam); due topics lead Today's picks and show a Due badge; intervals editable in Settings
  0.35.0 Share with friends (Settings → Share): pick habits, tasks/homework, exams/quizzes and topics, send them as copied text, a .json file or the phone's share sheet; friends import them from a preview (duplicates skipped, no history or personal data included)
  0.34.0 Arabic language support (Settings → Language): full right-to-left layout, Arabic text, dates in Arabic; switch back to English any time
  0.33.0 Exam and quiz logger (Study tab): add exams and quizzes with date, time and subject, countdowns and Dashboard warnings, log scores afterwards, and picks favour subjects with an exam coming up
  0.32.0 Student mode (Settings → Student mode): a Study tab with a retrospective revision timetable. Subjects and topics, tap a day to log a study session with a Weak/OK/Strong colour, daily picks list (weakest and untouched topics first)
  0.31.0 Setting for avoid habits: a day counts as clean unless you log a slip (default) or as a slip unless you confirm it clean; can also be changed per habit (existing check-ins are flipped so history stays correct)
  0.30.0 More task settings: default due date, sort order, tag folders on/off, auto-archive finished tasks, default filter, show/hide notes and checklist on rows, overdue on the Dashboard
  0.29.0 Settings tab (was Data): sounds, theme, hide-done, compact, avoid-habit hiding, delete confirmations, dashboard sections, default task priority, completed-tasks section; backup tools moved under "Your data". Week-start option skipped (touches every week calculation)
  0.28.0 Negative habits ("Avoid" type): things to quit, e.g. no smoking. Every day counts as clean unless you tap it to mark a slip; streak = clean days in a row
  0.27.2 Archived tasks are only reachable from the Data tab (removed the archived-count link from the Tasks tab)
  0.27.1 Fix: goals no longer complete early. A goal at 99.6% used to round up to 100% and auto-complete; progress now only reaches 100% when the target is truly met
  0.27.0 Removed the focus timer
  0.26.0 Task tag folders: give a task a tag and open tasks group into collapsible folders per tag with done counts; with "Hide done today" a habit folder disappears once everything in it is done
  0.25.0 Quality pass: timer clears itself if its goal was deleted; checked speed on 2 years of data with every new feature, old backups (no checklists/schedules/order) load and render in every view
  0.24.0 Reorder habits and folders: Habits tab → Reorder shows ▲▼ on every habit (within its folder) and every folder; order is remembered
  0.23.0 Weekly report (Dashboard → Weekly report): tasks done and missed, habit completion per habit, weekly goal progress and goals finished; browse earlier weeks
  0.22.0 Undo after deleting a task, goal, habit or the completed-archive clean-up: a 6-second Undo button restores it with its links and history
  0.21.0 Focus timer (⏱ in the header): pick a number goal measured in hours or minutes, start, stop: the time is added to the goal; survives reload
  0.20.0 Search (🔍 in the header): finds tasks (including archived and checklist items), goals and habits as you type; tap a result to open it
  0.19.0 Checklists inside tasks: one item per line, tick items off from the task row, "2/4" progress chip; repeats start with a fresh checklist
  0.18.0 Repeating tasks (daily / weekdays / weekly / monthly): completing one creates the next occurrence; un-ticking removes it
  0.17.0 Habit schedules: pick the days a habit is due; streaks skip days off, rates count only due days, today lists and
         folders only include habits due today
  0.16.0 Quality pass: cached date formatters (2 years of data: Tasks tab 60→20 ms, dashboard 18→10 ms, archive 21→6 ms,
         all-periods goals 30→5 ms); aria-labels on every icon button; visible keyboard focus rings
  0.15.0 Weekly planning: "Plan this week" lists monthly goals with open slots and adds weekly steps under them (checkbox or number);
         dashboard prompt when the week has no goals or on Sunday/Monday with open slots
  0.14.0 Native-app feel on phones: bottom tab bar with icons, slimmer header, safe-area padding, theme-colour status bar,
         no tap flash / pull-to-refresh bounce, 32px+ tap targets; toast sits above the tab bar; fix: main content had no top/bottom padding (cards touched the header)
  0.13.0 Backup reminders: last-backup time on the Data tab, dashboard nudge (one-tap copy) when there is no backup or it is >7 days old,
         ask the browser to protect storage from eviction and show whether it is; habit edit/delete buttons get aria-labels
  0.12.0 Habit folders: group habits into sections that turn green when every habit in them is done today; fanfare on finishing a folder
  0.11.0 Compact view toggle for the Habits tab (one tight row per habit, remembered)
  0.10.0 Goals rework: checkbox / number-target / built-from-sub-goals kinds; parents auto-complete only when all expected
         sub-goals are done (cascades up, un-ticking reopens); period-end review (hit / missed / carry over); manual slider removed
  0.9.0  Completed tasks stay in the Tasks tab (dimmed, at the bottom); task notes; confirm before deleting; archive with full task details and "delete completed"
  0.8.0  "Defeat" sound when unchecking; dashboard shows only today's tasks and habits (one-tap check for today)
  0.7.0  Hide habits already done today; completion sounds with on/off switch; version shown in Data tab
  0.6.0  Habit history calendar: toggle any past day, ★ marks the creation day, best streak
  0.5.1  Fix: empty (0 KB) exports on Android; copy/paste backup as text; clearer import errors
  0.5.0  (Installable PWA edition only, no single-file changes)
  0.4.0  Edit tasks, goals and habits after creation
  0.3.0  Dashboard: activity heatmap, tasks chart, goal rings, habit consistency
  0.2.0  Light/dark/auto theme, warmer palette
  0.1.0  First build: tasks, weekly/monthly/annual/5-year goals, habits, IndexedDB storage, JSON export/import

.pals{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pal{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}.pal.on{box-shadow:0 0 0 2px var(--text)}
.top .right{display:flex;align-items:center;gap:10px}
#themeBtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,.chip,[role=button],input[type=checkbox]{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.top h1{font-size:19px;margin:0;white-space:nowrap;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.top h1 .lt{color:#237A53}.top h1 svg{flex:none}
:root{--logo-ring:transparent;--logo-orbit:#2E9E6B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--logo-ring:#5CC2B5;--logo-orbit:#3DBE82}:root:not([data-theme="light"]) .top h1 .lt{color:#5BC48E}}
:root[data-theme="dark"],:root[data-theme="black"]{--logo-ring:#5CC2B5;--logo-orbit:#3DBE82}:root[data-theme="dark"] .top h1 .lt,:root[data-theme="black"] .top h1 .lt{color:#5BC48E}
.top .date{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
nav button{flex:none;border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
main.wrap{padding-top:18px;padding-bottom:60px}
h2{font-size:16px;margin:22px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* ---- Motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dlgin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadek{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(8deg)}}
@keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

#app.enter .sbar>i{transform-origin:bottom;animation:growy .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:.15s}
dialog#editDlg[open]{animation:dlgin .24s cubic-bezier(.2,.8,.2,1)}dialog#editDlg[open]::backdrop{animation:fadek .24s ease}
button,.chip,.tc,.day,.tcheck,.icon,.rb,.pill{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease}
button:active:not(:disabled),.tc:active,.day:active,.rb:active{transform:scale(.94)}

<script>
/* ---------- Database (IndexedDB) ---------- */
const STORES=['tasks','goals','habits','logs','topics','exams','trash'];
const DB={
  db:null, mem:null,
  open(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open('goal-tracker-db',4);
        r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
        r.onsuccess=()=>{this.db=r.result;res(true)};
        r.onerror=()=>{this.useMemory();res(false)};
      }catch(e){this.useMemory();res(false)}
    });
  },
  useMemory(){this.mem={};STORES.forEach(s=>this.mem[s]=new Map())},
  req(store,mode,fn){
    if(this.mem){return Promise.resolve(fn(null))}
    return new Promise((res,rej)=>{
      const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));
      t.oncomplete=()=>res(r&&'result' in r?r.result:undefined);t.onerror=()=>rej(t.error);
    });
  },
  all(s){return this.mem?Promise.resolve([...this.mem[s].values()]):this.req(s,'readonly',st=>st.getAll())},
  put(s,v){if(this.mem){this.mem[s].set(v.id,v);return Promise.resolve()}return this.req(s,'readwrite',st=>st.put(v))},
  del(s,id){if(this.mem){this.mem[s].delete(id);return Promise.resolve()}return this.req(s,'readwrite',st=>st.delete(id))},
  clear(s){if(this.mem){this.mem[s].clear();return Promise.resolve()}return this.req(s,'readwrite',st=>st.clear())}
};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=()=>ds(new Date());
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);
  return `${y}-W${pad(w)}`;
}
const HORIZONS={weekly:'Weekly',monthly:'Monthly',annual:'Annual',five:'5-Year'};
const PARENT={weekly:'monthly',monthly:'annual',annual:'five',five:null};
function currentPeriod(h){
  const d=new Date(),y=d.getFullYear();
  return h==='weekly'?isoWeek(d):h==='monthly'?ds(d).slice(0,7):h==='annual'?String(y):`${y}-${y+4}`;
}
let LOCALE;
const _fmts={};
// Creating a formatter is the slow part of toLocale*String, so build each one once and reuse it.
const fmt=(d,o)=>{const k=LOCALE+JSON.stringify(o);return(_fmts[k]||(_fmts[k]=new Intl.DateTimeFormat(LOCALE,o))).format(d)};
const fmtDate=s=>{if(!s)return'';const d=new Date(s+'T00:00');return fmt(d,{month:'short',day:'numeric'})};

/* ---------- State ---------- */
const S={tasks:[],goals:[],habits:[],topics:[],exams:[],logs:new Set(),view:'dash',horizon:'ladder',goalScope:'current',taskFilter:'open',persistent:true,trash:[],sel:new Set(),selMode:null};

const TRASH_DAYS=30;
async function load(){
  S.persistent=await DB.open();
  const [t,g,h,l,tp,ex,tr]=await Promise.all(STORES.map(s=>DB.all(s)));
  const cut=Date.now()-TRASH_DAYS*864e5;S.trash=(tr||[]).filter(r=>r&&r.data&&(r.at||0)>=cut);
  for(const r of (tr||[]))if(!S.trash.includes(r))DB.del('trash',r.id);
  S.exams=ex;S.topics=tp;S.tasks=t;S.goals=g;S.habits=h;S.logs=new Set(l.map(x=>x.id));
}

/* ---------- Logic ---------- */
const goalById=id=>S.goals.find(g=>g.id===id);
/* Goal kinds:
   check  – done when ticked, or automatically when all linked tasks are done
   number – target + unit (e.g. 40 hours); done automatically at 100%
   rollup – built from sub-goals; progress = sum of children ÷ EXPECTED count (not just the ones created so far),
            so one finished week can't complete a whole month */
const CHILD={monthly:'weekly',annual:'monthly',five:'annual'};
function goalKind(g){return g.kind||(S.goals.some(c=>c.parentId===g.id)?'rollup':'check')}
function periodEnd(h,p){let m;
  if(h==='weekly'&&(m=/^(\d{4})-W(\d{2})$/.exec(p))){const jan4=new Date(+m[1],0,4);const mon=addDays(jan4,-((jan4.getDay()+6)%7)+(+m[2]-1)*7);return ds(addDays(mon,6))}
  if(h==='monthly'&&(m=/^(\d{4})-(\d{2})$/.exec(p)))return ds(new Date(+m[1],+m[2],0));
  if(h==='annual'&&(m=/^(\d{4})$/.exec(p)))return m[1]+'-12-31';
  if(h==='five'&&(m=/^(\d{4})-(\d{4})$/.exec(p)))return m[2]+'-12-31';
  return null;}
function defaultExpected(g){
  if(g.horizon==='monthly'){const m=/^(\d{4})-(\d{2})$/.exec(g.period||'');if(!m)return 4;let n=0;const days=new Date(+m[1],+m[2],0).getDate();
    for(let d=1;d<=days;d++)if(new Date(+m[1],+m[2]-1,d).getDay()===4)n++;return n} // ISO weeks whose Thursday is in the month
  return{annual:12,five:5}[g.horizon]||1;}
const expectedOf=g=>Math.max(1,+g.expected||defaultExpected(g));
const fmtNum=n=>String(+(+n||0).toFixed(2));
function progressRaw(g,seen=new Set()){
  if(seen.has(g.id))return 0;seen.add(g.id);
  const k=goalKind(g);
  if(k==='number'){const t=+g.target||0;const v=+g.value||0;return t<=0?0:v>=t?100:Math.min(99,Math.floor(v/t*100))}
  if(k==='rollup'){const kids=S.goals.filter(c=>c.parentId===g.id);const n=Math.max(expectedOf(g),kids.length);
    const sum=kids.reduce((a,c)=>a+progress(c,seen),0);return sum>=n*100?100:Math.min(99,Math.floor(sum/n))}
  const t=S.tasks.filter(x=>x.goalId===g.id);if(!t.length)return 0;const d=t.filter(x=>x.done).length;return d===t.length?100:Math.min(99,Math.floor(d/t.length*100));
}
function progress(g,seen=new Set()){return g.done?100:progressRaw(g,seen)}
function goalDetail(g){
  const k=goalKind(g);
  if(k==='number')return'';
  if(k==='rollup'){const kids=S.goals.filter(c=>c.parentId===g.id),n=Math.max(expectedOf(g),kids.length),d=kids.filter(c=>c.done).length;
    const lbl=CHILD[g.horizon]?HORIZONS[CHILD[g.horizon]].toLowerCase():'sub';
    return`${d} of ${n} ${lbl} goals done${kids.length<n?` · ${n-kids.length} still to plan`:''}`}
  const t=S.tasks.filter(x=>x.goalId===g.id);return t.length?`${t.filter(x=>x.done).length}/${t.length} linked tasks done`:'tick ✓ when done';
}
const needsReview=g=>{if(g.done||g.status==='missed')return false;const e=periodEnd(g.horizon,g.period);return!!e&&e<TODAY()};
// Auto-complete goals that reached 100% (cascading upward); reopen auto-completed ones that dropped below.
function syncGoals(){
  const changed=new Set(),newly=new Set();
  for(let pass=0,dirty=true;dirty&&pass<10;pass++){dirty=false;
    for(const g of S.goals){
      if(g.status==='missed')continue;
      const raw=progressRaw(g);
      if(g.manualOpen&&raw<100){g.manualOpen=false;changed.add(g)}
      if(!g.done&&!g.manualOpen&&raw>=100){g.done=true;g.autoDone=true;g.doneAt=Date.now();changed.add(g);newly.add(g);dirty=true}
      else if(g.done&&g.autoDone&&raw<100){g.done=false;g.autoDone=false;g.doneAt=null;changed.add(g);newly.delete(g);dirty=true}
    }}
  for(const g of changed)DB.put('goals',g);
  return[...newly].filter(g=>g.done);
}
const logged=(hid,date)=>S.logs.has(hid+'|'+date);
// "Avoid" habits: a logged day is a SLIP; every day from creation until today is clean unless slipped.
const isNeg=h=>h.kind==='avoid';
const bornK=h=>ds(new Date(h.created||Date.now()));
const slipMode=h=>isNeg(h)&&h.mode!=='confirm';
const good=(h,k)=>slipMode(h)?(k>=bornK(h)&&k<=TODAY()&&!S.logs.has(h.id+'|'+k)):S.logs.has(h.id+'|'+k);
const hname=h=>(isNeg(h)?'🚫 ':'')+esc(h.name);
// Schedules: h.days = weekdays it's due (0=Sun…6=Sat); empty/missing = every day.
const hasSched=h=>Array.isArray(h.days)&&h.days.length>0&&h.days.length<7;
const isDue=(h,d)=>!hasSched(h)||h.days.includes(d.getDay());
const dueToday=h=>isDue(h,new Date());
const weekTarget=h=>hasSched(h)?h.days.length:(h.target||7);
const DOW_ORDER=[1,2,3,4,5,6,0];
const schedText=h=>hasSched(h)?DOW_ORDER.filter(n=>h.days.includes(n)).map(n=>fmt(new Date(2024,0,n||7),{weekday:'short'})).join(' · '):'';
// Streak = consecutive DUE days done; days off neither break nor add to it (a check-in on a day off still counts).
let _rest=null;const isRest=k=>(_rest||(_rest=new Set((S.cfg.restDays||'').split(',').filter(Boolean)))).has(k);
function streak(h){
  if(slipMode(h)){let n=0,d=new Date();for(let i=0;i<4000;i++){const k=ds(d);if(good(h,k))n++;else if(!isRest(k)||k<bornK(h))break;d=addDays(d,-1)}return n}
  let d=new Date();if(!good(h,ds(d)))d=addDays(d,-1);
  let n=0;for(let i=0;i<1100;i++){if(good(h,ds(d)))n++;else if(isDue(h,d)&&!isRest(ds(d)))break;d=addDays(d,-1)}return n;
}
function weekCount(h){
  const d=new Date();const dow=(d.getDay()+6)%7;let n=0;
  for(let i=0;i<=dow;i++)if(good(h,ds(addDays(d,-i))))n++;return n;
}
function rate30(h){let due=0,n=0;for(let i=0;i<30;i++){const d=addDays(new Date(),-i);if(isNeg(h)&&ds(d)<bornK(h))continue;if(isDue(h,d)){due++;if(good(h,ds(d)))n++}}return due?Math.min(100,Math.round(n/due*100)):0}

/* ---------- Components ---------- */
const ARCHIVE_ICON='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>';
function fmtWhen(ts){if(!ts)return'';const d=new Date(ts);const y=d.getFullYear()!==new Date().getFullYear();
  return fmt(d,{month:'short',day:'numeric',...(y?{year:'numeric'}:{}),hour:'numeric',minute:'2-digit'})}
function fmtDay(s){return s?fmt(new Date(s+'T00:00'),{weekday:'short',month:'short',day:'numeric',year:'numeric'}):'—'}
function dueLeft(due){

/* Monsters: a 16x16 mirrored pixel sprite and a name, both generated from the week id, so every week is unique and repeatable. */

const _mon=new Map();

function heatmapCard(){

  document.body.classList.toggle('selmode',!!S.selMode);document.body.classList.toggle('cmp',!!(S.cfg.student&&S.cfg.stuCompact));

  const v={dash:viewDash,tasks:viewTasks,goals:viewGoals,habits:viewHabits,data:viewData,archive:viewArchive,trash:viewTrash,study:viewStudy,bestiary:viewBestiary}[S.view]||viewDash;

const Sound={
  ctx:null,on:true,
  load(){try{this.on=localStorage.getItem('gt-sound')!=='off'}catch(e){}},
  set(v){this.on=v;try{localStorage.setItem('gt-sound',v?'on':'off')}catch(e){}},
  play(kind){
    if(!this.on)return;
    try{
      const C=this.ctx||(this.ctx=new (window.AudioContext||window.webkitAudioContext)());
      if(C.state==='suspended')C.resume();
      // task: bright rising C–E–G · habit: softer two-note "pop" · undo: falling G–E♭–C "womp", last note sags
      const S_={task:{n:[[1046.5,0],[1318.5,.07],[1568,.14]],len:.38,vol:.16},
                habit:{n:[[784,0],[1174.7,.08]],len:.38,vol:.16},
                undo:{n:[[392,0],[311.1,.16],[261.6,.32]],len:.5,vol:.13,sag:true},
                goal:{n:[[784,0],[1046.5,.1],[1318.5,.2],[1568,.3],[2093,.42]],len:.55,vol:.15},
                hit:{n:[[196,0],[147,.06]],len:.12,vol:.06,sq:true}}[kind]||null;
      if(!S_)return;
      const t0=C.currentTime+.01;
      S_.n.forEach(([f,dt],i)=>{
        const o=C.createOscillator(),g=C.createGain();o.type=S_.sq?'square':'triangle';o.frequency.setValueAtTime(f,t0+dt);
        const last=i===S_.n.length-1,len=last&&S_.sag?S_.len*1.6:S_.len;
        if(last&&S_.sag)o.frequency.exponentialRampToValueAtTime(f*.82,t0+dt+len);
        g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(S_.vol,t0+dt+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+len);
        o.connect(g).connect(C.destination);o.start(t0+dt);o.stop(t0+dt+len+.05);
      });
    }catch(e){}
  }
};

const ARROW={'→':'←','←':'→'};
function trCore(s){if(Object.prototype.hasOwnProperty.call(AR,s))return AR[s];for(const[re,fn]of PAT){const m=s.match(re);if(m)return fn(m)}return null}
function trText(s){
  s=String(s);const t=s.trim();if(!t||!/[A-Za-z]/.test(t))return s;
  const lead=s.slice(0,s.length-s.trimStart().length),trail=s.slice(s.trimEnd().length);
  let r=trCore(t);
  if(r===null){const m=t.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9)\]]*)$/);if(m&&m[2]){const c=trCore(m[2]);if(c!==null)r=m[1]+c+m[3]}}
  if(r===null)return s;
  return lead+r.replace(/[→←]/g,c=>ARROW[c])+trail;
}
const TR_ATTRS=['placeholder','title','aria-label'];
function trNode(root){
  if(S.cfg.lang!=='ar'||!root)return;
  const doText=n=>{const p=n.parentElement;if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'||p.tagName==='TEXTAREA'||p.closest('[translate=no]')))return;const v=n.nodeValue,r=trText(v);if(r!==v){n._en=v;n.nodeValue=r}};
  const doEl=e=>{for(const a of TR_ATTRS){const v=e.getAttribute&&e.getAttribute(a);if(v){const r=trText(v);if(r!==v){if(!e.hasAttribute('data-en-'+a))e.setAttribute('data-en-'+a,v);e.setAttribute(a,r)}}}};
  if(root.nodeType===3){doText(root);return}
  if(root.nodeType!==1)return;
  doEl(root);root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(doEl);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())doText(n);
}
function untrNode(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n._en!==undefined){n.nodeValue=n._en;delete n._en}}
  root.querySelectorAll('*').forEach(e=>{for(const a of TR_ATTRS){const o=e.getAttribute('data-en-'+a);if(o!==null){e.setAttribute(a,o);e.removeAttribute('data-en-'+a)}}});
}

const BACKUP_STALE=7;

const agoText=n=>n===null?L2('never','أبدًا'):n<=0?L2('today','اليوم'):n===1?L2('yesterday','أمس'):L2(n+' days ago',`منذ ${n} ${AYAM(n)}`);

function backupNudge(){

const REPEATS=[['','No repeat'],['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly'],['monthly','Monthly']];

function stepDue(d,rule){const x=new Date(d);
  if(rule==='daily')x.setDate(x.getDate()+1);
  else if(rule==='weekdays'){do x.setDate(x.getDate()+1);while(x.getDay()===0||x.getDay()===6)}
  else if(rule==='weekly')x.setDate(x.getDate()+7);
  else if(rule==='monthly'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  return x}
// Next due date after the task's own date, skipping past dates so an overdue task doesn't spawn more overdue ones.
function nextDue(t){const today=TODAY();let d=stepDue(new Date((t.due||today)+'T00:00'),t.repeat);for(let i=0;i<400&&ds(d)<today;i++)d=stepDue(d,t.repeat);return ds(d)}
async function onTaskDone(t){
  if(!t.repeat)return;
  if(t.done&&!t.nextId){
    const n={id:uid(),title:t.title,notes:t.notes||'',repeat:t.repeat,due:nextDue(t),priority:t.priority,goalId:t.goalId||null,tag:t.tag||'',items:(t.items||[]).map(i=>({text:i.text,done:false})),done:false,created:Date.now(),prevId:t.id};
    t.nextId=n.id;S.tasks.push(n);await DB.put('tasks',n);await DB.put('tasks',t);
    toast(`🔁 Next "${t.title}" on ${fmtDate(n.due)}`);
  }else if(!t.done&&t.nextId){
    const n=S.tasks.find(x=>x.id===t.nextId);
    if(n&&!n.done){S.tasks=S.tasks.filter(x=>x.id!==n.id);await DB.del('tasks',n.id)}
    t.nextId=null;await DB.put('tasks',t);
  }
}

    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));

/* ---------- Weekly report ---------- */
const rep_={off:0};
function weekData(off){
  const now=new Date();const mon=addDays(now,-((now.getDay()+6)%7)+off*7);mon.setHours(0,0,0,0);
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));const a=ds(days[0]),z=ds(days[6]),today=TODAY();
  const t0=days[0].getTime(),t1=addDays(days[6],1).getTime();
  const done=S.tasks.filter(t=>t.done&&t.doneAt>=t0&&t.doneAt<t1);
  const missed=S.tasks.filter(t=>!t.done&&t.due&&t.due>=a&&t.due<=z&&t.due<today&&!t.archived);
  const habits=S.habits.map(h=>{const born=ds(new Date(h.created||0));let due=0,n=0;
    for(const d of days){const k=ds(d);if(k>today||k<born)continue;if(isDue(h,d)){due++;if(good(h,k))n++}else if(good(h,k)){due++;n++}}
    return{h,due,n}}).filter(x=>x.due);
  const wk=isoWeek(days[0]);
  const goals=S.goals.filter(g=>g.horizon==='weekly'&&g.period===wk);
  const finished=S.goals.filter(g=>g.done&&g.doneAt>=t0&&g.doneAt<t1);
  const study=S.cfg.student?{...studyWeek(a,z),exams:S.exams.filter(e=>e.date>=a&&e.date<=z)}:null;
  return{days,a,z,done,missed,habits,goals,finished,study};
}
function drawReport(){

  const label=rep_.off===0?'This week':rep_.off===-1?'Last week':fmt(w.days[0],{month:'short',day:'numeric'})+' – '+fmt(w.days[6],{month:'short',day:'numeric'});
  dlg.innerHTML=`<form method="dialog" data-report><h3>Weekly report</h3>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <button type="button" class="icon" data-action="rep-nav" data-d="-1" aria-label="Previous week">‹</button><b>${label}</b>
      <button type="button" class="icon" data-action="rep-nav" data-d="1" aria-label="Next week" ${rep_.off>=0?'disabled':''}>›</button></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${stat(w.done.length,'tasks done')}${stat(w.missed.length,'tasks missed')}${stat(hd?rate+'%':'—','habits')}</div>
    ${w.habits.length?`<h2 style="margin-top:14px">Habits</h2>${w.habits.map(x=>`<div class="kv"><span>${esc(x.h.name)}</span><span>${x.n}/${x.due}</span></div>`).join('')}`:''}
    ${w.goals.length?`<h2 style="margin-top:14px">Weekly goals</h2>${w.goals.map(g=>`<div class="kv"><span>${esc(g.title)}</span><span>${g.done?'✓ done':Math.round(progress(g))+'%'}</span></div>`).join('')}`:''}

function searchResults(q){
  q=q.trim().toLowerCase();if(!q)return '<div class="empty">Type to search tasks, goals and habits.</div>';
  const has=(...a)=>a.some(x=>String(x||'').toLowerCase().includes(q));
  const row=(k,id,main,sub)=>`<button type="button" class="srow" data-sr="${k}:${id}"><b>${main}</b><span>${sub}</span></button>`;
  const tasks=S.tasks.filter(t=>has(t.title,t.notes,t.tag,(t.items||[]).map(i=>i.text).join(' '))).slice(0,30)
    .map(t=>row('task',t.id,esc(t.title),(t.archived?'Archived task':t.done?'Done task':'Task')+(t.due?' · '+fmtDate(t.due):'')));
  const goals=S.goals.filter(g=>has(g.title,g.notes,g.lesson)).slice(0,30)
    .map(g=>row('goal',g.id,esc(g.title),HORIZONS[g.horizon]+' goal · '+esc(g.period)+(g.done?' · done':'')));
  const habits=S.habits.filter(h=>has(h.name,h.group)).slice(0,30)
    .map(h=>row('habit',h.id,esc(h.name),'Habit'+(h.group?' · '+esc(h.group):'')));
  const topics=S.cfg.student?S.topics.filter(t=>has(t.name,t.subject)).slice(0,30).map(t=>row('topic',t.id,esc(t.name),'Topic · '+esc(t.subject))):[];

}

      ${dates.length?`<div class="kv"><span>${L2('Covers','تغطي')}</span><span>${fmtDate(ds(new Date(dates[0])))} – ${fmtDate(ds(new Date(dates.at(-1))))}</span></div>`:''}
      <table class="rp"><thead><tr><th></th><th>${L2('Backup','النسخة')}</th><th>${L2('Now','الآن')}</th></tr></thead><tbody>${Object.keys(cur).map(k=>`<tr class="${rows[k].length<cur[k]?'less':''}"><td>${lab[k]}</td><td>${rows[k].length}</td><td>${cur[k]}</td></tr>`).join('')}</tbody></table>
      ${skipped?`<p class="meta">${L2(`${skipped} damaged rows will be skipped.`,`سيتم تخطي ${skipped} صفًا تالفًا.`)}</p>`:''}
      ${lost.length?`<div class="rpg-warn">${L2('⚠ This backup has fewer items than you have now. Restoring replaces everything, so the extra items will be gone.','⚠ هذه النسخة فيها عناصر أقل مما لديك الآن. الاستعادة تستبدل كل شيء، فستضيع العناصر الإضافية.')}</div>`:''}
      <p class="meta">${L2('Restoring replaces all current data with the backup.','الاستعادة تستبدل كل البيانات الحالية بالنسخة.')}</p>
      <div class="dlg-actions"><button type="button" class="ghost" data-rp="0">${L2('Cancel','إلغاء')}</button><button type="button" class="btn ${lost.length?'danger':''}" data-rp="1">${L2('Restore','استعادة')}</button></div></div>`;
    const done=v=>{dlg.removeEventListener('click',h);dlg.removeEventListener('close',c);if(dlg.open)dlg.close();res(v)};
    const h=e=>{const b=e.target.closest('[data-rp]');if(b)done(b.dataset.rp==='1')},c=()=>done(false);
    dlg.addEventListener('click',h);dlg.addEventListener('close',c);if(!dlg.open)dlg.showModal();
  });
}
async function restore(text,source){
  text=(text||'').replace(/^\uFEFF/,'').trim();
  if(!text)throw new Error(source==='file'?'the file is empty (0 bytes), so the export never finished saving. Export again, or use "Copy backup text" instead.':'nothing was pasted.');
  let d;
  try{d=JSON.parse(text)}catch(e){throw new Error(`the ${source} is cut off or isn't valid JSON (${(text.length/1024).toFixed(1)} KB). Export it again, or use "Copy backup text" instead.`)}
  if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.goals))throw new Error("that isn't a GoalTerra backup.");
  const rows={};let skipped=0;
  for(const st of STORES){const src=Array.isArray(d[st])?d[st]:[];rows[st]=src.filter(r=>{const ok=r&&typeof r==='object'&&typeof r.id==='string'&&r.id&&(st!=='logs'||r.id.includes('|'));if(!ok)skipped++;return ok})}
  const n=`${rows.tasks.length} tasks, ${rows.goals.length} goals, ${rows.habits.length} habits, ${rows.logs.length} check-ins`+(rows.topics.length||rows.exams.length?`, ${rows.topics.length} topics, ${rows.exams.length} exams`:'')+(skipped?` (${skipped} damaged rows skipped)`:'');
  if(!(await restorePreview(d,rows,skipped)))return false;
  const snap=backupData();
  try{for(const st of STORES){await DB.clear(st);for(const row of rows[st])await DB.put(st,row)}}
  catch(err){try{for(const st of STORES){await DB.clear(st);for(const row of (snap[st]||[]))await DB.put(st,row)}await load();render()}catch(_){}throw new Error('the restore failed part-way, so your previous data was put back ('+err.message+').')}
  if(d.settings&&typeof d.settings==='object'){const st=d.settings;
    if(st.cfg&&typeof st.cfg==='object'){const o={};for(const k in CFG_DEF)if(k in st.cfg&&typeof st.cfg[k]===typeof CFG_DEF[k])o[k]=st.cfg[k];S.cfg={...CFG_DEF,...o};saveCfg();applyLang()}
    if(typeof st.sound==='boolean')Sound.set(st.sound);
    if(typeof st.hideDone==='boolean'){S.hideDone=st.hideDone;try{localStorage.setItem('gt-hide-done',st.hideDone?'1':'0')}catch(e){}}
    if(typeof st.compact==='boolean'){S.compact=st.compact;try{localStorage.setItem('gt-compact',st.compact?'1':'0')}catch(e){}}}
  await load();render();return n;
}
function openBackup(mode){
  const copy=mode==='copy';
  dlg.innerHTML=`<form method="dialog" data-backup="${mode}"><h3>${copy?'Backup as text':'Restore from text'}</h3>
    <p class="meta">${copy?'Copy this and paste it somewhere safe, like a note or a message to yourself.':'Paste a backup you copied earlier. This replaces all current data.'}</p>
    <textarea name="text" spellcheck="false" style="min-height:180px;font:12px/1.4 ui-monospace,monospace" ${copy?'readonly':'placeholder="Paste backup here…"'}>${copy?esc(JSON.stringify(backupData())):''}</textarea>
    <div class="dlg-actions"><button class="ghost" value="cancel" formnovalidate>Close</button><button class="btn" value="go">${copy?'Copy':'Restore'}</button></div></form>`;
  dlg.showModal();
  const ta=dlg.querySelector('textarea');copy?ta.select():ta.focus();
}
dlg.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-backup]');if(!f)return;e.preventDefault();
  if(e.submitter&&e.submitter.value==='cancel'){dlg.close();return}
  const ta=f.elements.text;
  if(f.dataset.backup==='copy'){
    let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true}catch(_){try{ta.select();ok=document.execCommand('copy')}catch(__){}}
    if(ok&&ta.value.length>2){markBackup();render()}
    if(e.submitter)e.submitter.textContent=ok?'Copied ✓':'Select all and copy manually';return;
  }
  try{const n=await restore(ta.value,'pasted text');if(n){dlg.close();notify('Restored '+n+'.')}}
  catch(err){alert('Restore failed: '+err.message)}
});
$('#importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  try{const n=await restore(await file.text(),'file');if(n)notify('Imported '+n+'.')}
  catch(err){alert('Import failed: '+err.message)}
  finally{e.target.value=''}
});

/* ---------- Tooltips (hover + tap) ---------- */
const tip=$('#tip');let tipEl=null;
function showTip(el,x,y){tipEl=el;tip.textContent=el.dataset.tip;
  const r=tip.getBoundingClientRect();const half=r.width/2+8;
  tip.style.left=Math.min(Math.max(x,half),innerWidth-half)+'px';tip.style.top=Math.max(y,r.height+14)+'px';tip.classList.add('show')}
function hideTip(){tipEl=null;tip.classList.remove('show')}
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tip]');el?showTip(el,e.clientX,e.clientY):hideTip()});
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const el=e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.left+r.width/2,r.top)}else hideTip()});
addEventListener('scroll',hideTip,{passive:true});

/* ---------- Theme: auto → light → dark ---------- */
const THEME_LABEL={auto:'◐ Auto',light:'☀ Light',dark:'☾ Dark',black:'● Black'};
const PALS=[['clay','Clay','#c4612a'],['terra','Terra','#1f7a6d'],['ocean','Ocean','#2b67cc'],['grape','Grape','#7448c9'],['rose','Rose','#be3866'],['graphite','Graphite','#3a3a3a']];
function getPalette(){return document.documentElement.dataset.palette||'clay'}
function setPalette(p){const r=document.documentElement;if(!p||p==='clay')delete r.dataset.palette;else r.dataset.palette=p;try{p==='clay'?localStorage.removeItem('gt-palette'):localStorage.setItem('gt-palette',p)}catch(e){}syncThemeColor()}
function getTheme(){return document.documentElement.dataset.theme||'auto'}
function setTheme(t){
  if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  try{t==='auto'?localStorage.removeItem('gt-theme'):localStorage.setItem('gt-theme',t)}catch(e){}
  $('#themeBtn').textContent=THEME_LABEL[t];$('#themeBtn').title='Theme: '+t+' (tap to change)';
  syncThemeColor();
}
// Status-bar colour follows the actual background (handles auto mode too).
function syncThemeColor(){const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).backgroundColor||'#faf5ee'}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncThemeColor)}catch(e){}
$('#themeBtn').addEventListener('click',()=>{const order=['auto','light','dark','black'];setTheme(order[(order.indexOf(getTheme())+1)%3])});
setTheme(getTheme());

async function autoArchive(){
  const days=+S.cfg.autoArch;if(!days)return;const cut=Date.now()-days*864e5;
  for(const t of S.tasks)if(t.done&&!t.archived&&t.doneAt&&t.doneAt<cut){t.archived=true;t.archivedAt=Date.now();await DB.put('tasks',t)}
}
(async()=>{
  applyLang();
  await load();await autoArchive();if(S.cfg.rpg&&!S.cfg.rpgSince){S.cfg.rpgSince=TODAY();saveCfg()}render();ftTick(true);
  if(!introSeen()){if(S.tasks.length||S.goals.length||S.habits.length)markIntro();else openIntro()}
  await checkStorage(true);if(S.view==='data')render();
})();
</script>
