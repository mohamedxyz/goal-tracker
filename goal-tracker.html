<!doctype html>
<!--
  Goal Tracker — single-file edition
  Versioning: MAJOR.MINOR.PATCH (semver.org). Bump APP_VERSION below on every change.
    PATCH = bug fix · MINOR = new feature · MAJOR = breaks old backups or data

  Changelog
  0.43.1 Habit consistency card lists Avoid habits in their own "Staying clean" group (% clean, 🛡 streak)
  0.43.0 Dashboard: Avoid habits get their own "Staying clean" section (clean/slipped state, Log slip button) and their own tiles; they no longer count in "Habits done today" or "Best current streak"
  0.42.0 Study: tap a day cell and pick Weak / OK / Strong / Clear from a small menu, so any rating takes two taps instead of cycling through colours
  0.41.1 Fix: screen flashed for a moment after pressing a button (the page-enter animation replayed on every redraw; it now plays only when you change tabs)
  0.41.0 Polish: redesigned Study tab (stat tiles, agenda-style exams, one-tap Weak/OK/Strong ratings on today's picks, tidier insights); smooth animations across the app (page transitions, staggered cards, press feedback, pop on tick, animated bars, dialog open); respects reduced-motion
  0.40.0 Final quality pass: Study tab 12x faster with hundreds of topics and exams (cached exam lookups and review dates), Tasks tab shows the 40 newest completed tasks with a Show all button (lighter on big lists), Arabic dictionary updated
  0.39.0 Safer restore: rows are validated first (bad rows skipped and reported), settings are filtered, language/student mode apply immediately, and if a restore fails midway your previous data is put back; share dialog keyboard-friendly; dialogs announce their title to screen readers
  0.38.0 Share button on every task, habit, exam and topic: opens the share dialog with just that item ready to send (Settings entry still shares several at once)
  0.37.0 Study insights: per-subject summary (strong/OK/weak/new bar, last studied, due topics, days to exam), a 14-day chart of topics studied per day, and a Study section in the weekly report when student mode is on
  0.36.0 Spaced repetition: every topic gets a next-review date from its latest colour (Weak 1 day, OK 3 days, Strong 1/3/7/14/30 growing with consecutive Strong ratings, shorter before an exam); due topics lead Today's picks and show a Due badge; intervals editable in Settings
  0.35.0 Share with friends (Settings → Share): pick habits, tasks/homework, exams/quizzes and topics, send them as copied text, a .json file or the phone's share sheet; friends import them from a preview (duplicates skipped, no history or personal data included)
  0.34.0 Arabic language support (Settings → Language): full right-to-left layout, Arabic text, dates in Arabic; switch back to English any time
  0.33.0 Exam and quiz logger (Study tab): add exams and quizzes with date, time and subject, countdowns and Dashboard warnings, log scores afterwards, and picks favour subjects with an exam coming up
  0.32.0 Student mode (Settings → Student mode): a Study tab with a retrospective revision timetable. Subjects and topics, tap a day to log a study session with a Weak/OK/Strong colour, daily picks list (weakest and untouched topics first)
  0.31.0 Setting for avoid habits: a day counts as clean unless you log a slip (default) or as a slip unless you confirm it clean; can also be changed per habit (existing check-ins are flipped so history stays correct)
  0.30.0 More task settings: default due date, sort order, tag folders on/off, auto-archive finished tasks, default filter, show/hide notes and checklist on rows, overdue on the Dashboard
  0.29.0 Settings tab (was Data): sounds, theme, hide-done, compact, avoid-habit hiding, delete confirmations, dashboard sections, default task priority, completed-tasks section; backup tools moved under "Your data". Week-start option skipped (touches every week calculation)
  0.28.0 Negative habits ("Avoid" type): things to quit, e.g. no smoking. Every day counts as clean unless you tap it to mark a slip; streak = clean days in a row
  0.27.2 Archived tasks are only reachable from the Data tab (removed the archived-count link from the Tasks tab)
  0.27.1 Fix: goals no longer complete early. A goal at 99.6% used to round up to 100% and auto-complete; progress now only reaches 100% when the target is truly met
  0.27.0 Removed the focus timer
  0.26.0 Task tag folders: give a task a tag and open tasks group into collapsible folders per tag with done counts; with "Hide done today" a habit folder disappears once everything in it is done
  0.25.0 Quality pass: timer clears itself if its goal was deleted; checked speed on 2 years of data with every new feature, old backups (no checklists/schedules/order) load and render in every view
  0.24.0 Reorder habits and folders: Habits tab → Reorder shows ▲▼ on every habit (within its folder) and every folder; order is remembered
  0.23.0 Weekly report (Dashboard → Weekly report): tasks done and missed, habit completion per habit, weekly goal progress and goals finished; browse earlier weeks
  0.22.0 Undo after deleting a task, goal, habit or the completed-archive clean-up: a 6-second Undo button restores it with its links and history
  0.21.0 Focus timer (⏱ in the header): pick a number goal measured in hours or minutes, start, stop: the time is added to the goal; survives reload
  0.20.0 Search (🔍 in the header): finds tasks (including archived and checklist items), goals and habits as you type; tap a result to open it
  0.19.0 Checklists inside tasks: one item per line, tick items off from the task row, "2/4" progress chip; repeats start with a fresh checklist
  0.18.0 Repeating tasks (daily / weekdays / weekly / monthly): completing one creates the next occurrence; un-ticking removes it
  0.17.0 Habit schedules: pick the days a habit is due; streaks skip days off, rates count only due days, today lists and
         folders only include habits due today
  0.16.0 Quality pass: cached date formatters (2 years of data: Tasks tab 60→20 ms, dashboard 18→10 ms, archive 21→6 ms,
         all-periods goals 30→5 ms); aria-labels on every icon button; visible keyboard focus rings
  0.15.0 Weekly planning: "Plan this week" lists monthly goals with open slots and adds weekly steps under them (checkbox or number);
         dashboard prompt when the week has no goals or on Sunday/Monday with open slots
  0.14.0 Native-app feel on phones: bottom tab bar with icons, slimmer header, safe-area padding, theme-colour status bar,
         no tap flash / pull-to-refresh bounce, 32px+ tap targets; toast sits above the tab bar; fix: main content had no top/bottom padding (cards touched the header)
  0.13.0 Backup reminders: last-backup time on the Data tab, dashboard nudge (one-tap copy) when there is no backup or it is >7 days old,
         ask the browser to protect storage from eviction and show whether it is; habit edit/delete buttons get aria-labels
  0.12.0 Habit folders: group habits into sections that turn green when every habit in them is done today; fanfare on finishing a folder
  0.11.0 Compact view toggle for the Habits tab (one tight row per habit, remembered)
  0.10.0 Goals rework: checkbox / number-target / built-from-sub-goals kinds; parents auto-complete only when all expected
         sub-goals are done (cascades up, un-ticking reopens); period-end review (hit / missed / carry over); manual slider removed
  0.9.0  Completed tasks stay in the Tasks tab (dimmed, at the bottom); task notes; confirm before deleting; archive with full task details and "delete completed"
  0.8.0  "Defeat" sound when unchecking; dashboard shows only today's tasks and habits (one-tap check for today)
  0.7.0  Hide habits already done today; completion sounds with on/off switch; version shown in Data tab
  0.6.0  Habit history calendar: toggle any past day, ★ marks the creation day, best streak
  0.5.1  Fix: empty (0 KB) exports on Android; copy/paste backup as text; clearer import errors
  0.5.0  (Installable PWA edition only, no single-file changes)
  0.4.0  Edit tasks, goals and habits after creation
  0.3.0  Dashboard: activity heatmap, tasks chart, goal rings, habit consistency
  0.2.0  Light/dark/auto theme, warmer palette
  0.1.0  First build: tasks, weekly/monthly/annual/5-year goals, habits, IndexedDB storage, JSON export/import
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf5ee">
<title>Goal Tracker</title>
<script>try{const t=localStorage.getItem('gt-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#faf5ee;--card:#fffcf7;--text:#2e2520;--muted:#7d6f64;--line:#ece1d3;--accent:#c4612a;--on-accent:#fff;--soft:#f8e7d8;--ok:#6a8f3a;--on-ok:#fff;--warn:#c98418;--bad:#b9412f;--banner-bg:#fbe8c8;--banner-text:#6b3f12;--radius:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#251e19;--text:#f2e8dd;--muted:#ab9a8a;--line:#3b3129;--accent:#ec9659;--on-accent:#1b1612;--soft:#3d2a1d;--ok:#9cbf6e;--on-ok:#1b1612;--warn:#e6ad4f;--bad:#e8775f;--banner-bg:#4a3318;--banner-text:#f6d9a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#251e19;--text:#f2e8dd;--muted:#ab9a8a;--line:#3b3129;--accent:#ec9659;--on-accent:#1b1612;--soft:#3d2a1d;--ok:#9cbf6e;--on-ok:#1b1612;--warn:#e6ad4f;--bad:#e8775f;--banner-bg:#4a3318;--banner-text:#f6d9a8;color-scheme:dark}
.top .right{display:flex;align-items:center;gap:10px}
#themeBtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,.chip,[role=button],input[type=checkbox]{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.top h1{font-size:19px;margin:0;white-space:nowrap;letter-spacing:-.01em}
.top .date{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}
nav button{flex:none;border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
main.wrap{padding-top:18px;padding-bottom:60px}
h2{font-size:16px;margin:22px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat .n{font-size:24px;font-weight:700}
.stat .l{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
form.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input[type=text],textarea{flex:1 1 220px}
textarea{flex-basis:100%;min-height:54px;resize:vertical}
button.btn{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--on-accent);cursor:pointer;font-weight:600}
button.ghost{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--card);color:var(--text);cursor:pointer}
button.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:8px}
button.icon:hover{background:var(--soft);color:var(--text)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.grow{flex:1;min-width:0}
.title{font-weight:550;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.done .title{text-decoration:line-through;color:var(--muted)}
.item.dim{opacity:.55;transition:opacity .15s}
.item.dim:hover,.item.dim:focus-within{opacity:.85}
.subs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}.subs label{display:flex;gap:8px;align-items:center;font-size:14px;min-height:28px}.subs .sdone span{text-decoration:line-through;color:var(--muted)}
.srlist{display:grid;gap:6px;margin:10px 0;max-height:50vh;overflow:auto}.srow{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:inherit;font:inherit;cursor:pointer}.srow span{color:var(--muted);font-size:12px}
#searchBtn{background:none;border:0;font-size:18px;min-width:36px;min-height:36px;cursor:pointer}
.mv{display:inline-flex}.mv .icon{padding:0 6px}
[data-view][hidden]{display:none!important}
.tc{width:100%;min-width:0;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 11px/1.1 inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tc b{font-size:13px;color:inherit}.tc.c1{background:#b4442f;border-color:#b4442f;color:#fff}.tc.c2{background:#d9a13b;border-color:#d9a13b;color:#2e2520}.tc.c3{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.tc.today{outline:2px solid var(--accent);outline-offset:1px}
.trow{padding:8px 0;border-top:1px dashed var(--line)}.trow:first-child{border-top:0}
.trow .top{display:flex;align-items:center;gap:6px;margin-bottom:6px}.trow .top .grow{min-width:0}
.tgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--line)}.cdot.c1{background:#b4442f}.cdot.c2{background:#d9a13b}.cdot.c3{background:var(--ok)}
[dir=rtl] .srow{text-align:right}[dir=rtl] .cdot{margin-right:0;margin-left:5px}[dir=rtl] .kv span:last-child{text-align:left}[dir=rtl] .cd .star{right:auto;left:3px}
[dir=rtl] #toast button{margin-left:0;margin-right:10px}[dir=rtl] .backup-cta{padding-right:16px;padding-left:46px}[dir=rtl] .backup-cta .icon{right:auto;left:8px}
[dir=rtl] .daypick .dp-lbl{margin-right:0;margin-left:2px}[dir=rtl] .daypick .dp-hint{margin-left:0;margin-right:2px}
[dir=rtl] input.sw::after{left:auto;right:3px}[dir=rtl] input.sw:checked::after{transform:translateX(-18px)}
[dir=rtl] input[type=date],[dir=rtl] input[type=time],[dir=rtl] input[type=number]{text-align:right}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:6px}.stack .s3{background:var(--ok)}.stack .s2{background:#d9a13b}.stack .s1{background:#b4442f}.stack .s0{background:var(--line)}
.sbars{display:flex;align-items:flex-end;gap:4px;height:84px;margin-top:8px}.sbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0}.sbar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--line)}.sbar i.on{background:var(--accent)}.sbar span{font-size:10px;color:var(--muted);line-height:1}
/* ---- Study polish ---- */
.stiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stile b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.stile span{font-size:11.5px;color:var(--muted);line-height:1.25}
.stile.hot b{color:#b4442f}.stile.ok b{color:var(--ok)}
.scard{margin-bottom:12px}.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font:600 12px/1.3 inherit;background:var(--line);color:var(--text);border:0;white-space:nowrap}
.pill.hot{background:#b4442f;color:#fff}.pill.warm{background:#d9a13b;color:#2e2520}.pill.ok{background:color-mix(in oklab,var(--ok) 22%,transparent);color:var(--ok)}.pill.warn{background:var(--soft);color:var(--accent);cursor:pointer}
.exrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}.exrow:first-of-type{border-top:0}
.datebox{flex:none;width:46px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;padding:4px 0;line-height:1.1}
.datebox small{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.datebox b{font-size:19px}
.exrow.hot .datebox{background:#b4442f}.exrow.hot .datebox small,.exrow.hot .datebox b{color:#fff}
.exrow.warm .datebox{background:color-mix(in oklab,#d9a13b 45%,var(--card))}
.exr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.mini{display:flex}.mini .icon{min-width:30px;min-height:30px;opacity:.75}
.pick{border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--card);overflow:hidden;max-height:160px;transition:max-height .26s ease,opacity .22s ease,margin .26s ease,padding .26s ease,transform .26s ease}
.pick.c1{border-inline-start-color:#b4442f}.pick.c2{border-inline-start-color:#d9a13b}.pick.c3{border-inline-start-color:var(--ok)}.pick.due{border-inline-start-color:#b4442f;background:color-mix(in oklab,#b4442f 6%,var(--card))}
.pick.leaving{max-height:0;opacity:0;margin-top:0;padding-top:0;padding-bottom:0;transform:translateX(24px)}[dir=rtl] .pick.leaving{transform:translateX(-24px)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.chip2{display:inline-flex;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--text)}.chip2.mute{background:transparent;color:var(--muted);padding-inline:2px}.chip2.due{background:#b4442f;color:#fff}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.rb{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;min-height:38px;font:600 13px inherit;cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .12s}
.rb.c1:hover,.rb.c1:focus-visible{background:#b4442f;border-color:#b4442f;color:#fff}.rb.c2:hover,.rb.c2:focus-visible{background:#d9a13b;border-color:#d9a13b;color:#2e2520}.rb.c3:hover,.rb.c3:focus-visible{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.stack.thin{height:6px;margin:2px 2px 8px}.hfolder.collapsed .stack.thin{margin-bottom:2px}
.addtopics summary{cursor:pointer;font-weight:650;list-style:none;display:flex;justify-content:space-between;align-items:center}.addtopics summary::after{content:'+';font-size:20px;line-height:1;color:var(--accent);transition:transform .2s}.addtopics[open] summary::after{transform:rotate(45deg)}.addtopics summary::-webkit-details-marker{display:none}
.legend{margin:2px 0 12px;line-height:1.7}.celebrate .party{display:inline-block;font-size:26px;animation:bob 1.4s ease-in-out infinite}
/* ---- Motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popk{0%{transform:scale(.82)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dlgin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadek{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(8deg)}}
@keyframes tabpop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#app.enter>*{animation:rise .38s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.pop{animation:popk .4s cubic-bezier(.3,1.5,.5,1)}
#app.enter .hf-bar>span,#app.enter .stack>span,#app.enter .bar>i,#app.enter .bar>span{transform-origin:left center;animation:growx .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:.12s}
[dir=rtl] #app.enter .hf-bar>span,[dir=rtl] #app.enter .stack>span,[dir=rtl] #app.enter .bar>i,[dir=rtl] #app.enter .bar>span{transform-origin:right center}
#app.enter .sbar>i{transform-origin:bottom;animation:growy .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:.15s}
dialog#editDlg[open]{animation:dlgin .24s cubic-bezier(.2,.8,.2,1)}dialog#editDlg[open]::backdrop{animation:fadek .24s ease}
button,.chip,.tc,.day,.tcheck,.icon,.rb,.pill{transition:transform .12s ease,background-color .15s ease,border-color .15s ease,color .15s ease,opacity .15s ease}
button:active:not(:disabled),.tc:active,.day:active,.rb:active{transform:scale(.94)}
.item,.card,.hfolder{transition:background-color .25s ease,border-color .25s ease,opacity .25s ease}
#tabbar button.on .ti svg{animation:tabpop .35s cubic-bezier(.3,1.5,.5,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#cellMenu{position:fixed;z-index:70;display:none;gap:6px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(40,20,5,.28)}
#cellMenu.show{display:flex;animation:dlgin .16s cubic-bezier(.2,.8,.2,1)}#cellMenu .rb{min-width:64px;padding:0 10px}
.tnotes{color:var(--muted);font-size:13px;margin-top:3px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:600;margin:18px 0 8px}
.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.arch-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.arch .kvs{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px;font-size:13px}
@media (max-width:520px){.arch .kvs{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.okc{color:var(--ok);font-weight:600}
.arch.notdone .title{color:var(--muted)}
button.danger{color:var(--bad)}
.bar-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11.5px}

/* ---------- Dashboard visuals ---------- */
:root{--h0:var(--line);--h1:color-mix(in oklab,var(--ok) 38%,var(--card));--h2:color-mix(in oklab,var(--ok) 60%,var(--card));--h3:color-mix(in oklab,var(--ok) 80%,var(--card));--h4:var(--ok)}

.hm-foot .meta{margin:0}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.ring svg{width:100%;max-width:74px;height:auto;display:block;margin:0 auto}
.ring .rt{fill:none;stroke:var(--line);stroke-width:7}

.hbars{display:flex;flex-direction:column;gap:9px}
.hbar .top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.hbar .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .top span:last-child{color:var(--muted);flex:none}
.hbar .track{height:8px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}

.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.split{grid-template-columns:1fr}}
dialog#editDlg{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:18px;width:min(460px,calc(100vw - 32px));box-shadow:0 18px 50px rgba(40,20,5,.25)}

<script>
/* ---------- Database (IndexedDB) ---------- */
const STORES=['tasks','goals','habits','logs','topics','exams'];
const DB={
  db:null, mem:null,
  open(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open('goal-tracker-db',3);
        r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
        r.onsuccess=()=>{this.db=r.result;res(true)};
        r.onerror=()=>{this.useMemory();res(false)};
      }catch(e){this.useMemory();res(false)}
    });
  },
  useMemory(){this.mem={};STORES.forEach(s=>this.mem[s]=new Map())},
  req(store,mode,fn){
    if(this.mem){return Promise.resolve(fn(null))}
    return new Promise((res,rej)=>{
      const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));
      t.oncomplete=()=>res(r&&'result' in r?r.result:undefined);t.onerror=()=>rej(t.error);
    });
  },
  all(s){return this.mem?Promise.resolve([...this.mem[s].values()]):this.req(s,'readonly',st=>st.getAll())},
  put(s,v){if(this.mem){this.mem[s].set(v.id,v);return Promise.resolve()}return this.req(s,'readwrite',st=>st.put(v))},
  del(s,id){if(this.mem){this.mem[s].delete(id);return Promise.resolve()}return this.req(s,'readwrite',st=>st.delete(id))},
  clear(s){if(this.mem){this.mem[s].clear();return Promise.resolve()}return this.req(s,'readwrite',st=>st.clear())}
};

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=()=>ds(new Date());
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);
  return `${y}-W${pad(w)}`;
}
const HORIZONS={weekly:'Weekly',monthly:'Monthly',annual:'Annual',five:'5-Year'};
const PARENT={weekly:'monthly',monthly:'annual',annual:'five',five:null};
function currentPeriod(h){
  const d=new Date(),y=d.getFullYear();
  return h==='weekly'?isoWeek(d):h==='monthly'?ds(d).slice(0,7):h==='annual'?String(y):`${y}-${y+4}`;
}
let LOCALE;
const _fmts={};
// Creating a formatter is the slow part of toLocale*String, so build each one once and reuse it.
const fmt=(d,o)=>{const k=LOCALE+JSON.stringify(o);return(_fmts[k]||(_fmts[k]=new Intl.DateTimeFormat(LOCALE,o))).format(d)};
const fmtDate=s=>{if(!s)return'';const d=new Date(s+'T00:00');return fmt(d,{month:'short',day:'numeric'})};

/* ---------- State ---------- */
const S={tasks:[],goals:[],habits:[],topics:[],exams:[],logs:new Set(),view:'dash',horizon:'weekly',goalScope:'current',taskFilter:'open',persistent:true};

async function load(){
  S.persistent=await DB.open();
  const [t,g,h,l,tp,ex]=await Promise.all(STORES.map(s=>DB.all(s)));
  S.exams=ex;S.topics=tp;S.tasks=t;S.goals=g;S.habits=h;S.logs=new Set(l.map(x=>x.id));
}

/* ---------- Logic ---------- */
const goalById=id=>S.goals.find(g=>g.id===id);
/* Goal kinds:
   check  – done when ticked, or automatically when all linked tasks are done
   number – target + unit (e.g. 40 hours); done automatically at 100%
   rollup – built from sub-goals; progress = sum of children ÷ EXPECTED count (not just the ones created so far),
            so one finished week can't complete a whole month */
const CHILD={monthly:'weekly',annual:'monthly',five:'annual'};
function goalKind(g){return g.kind||(S.goals.some(c=>c.parentId===g.id)?'rollup':'check')}
function periodEnd(h,p){let m;
  if(h==='weekly'&&(m=/^(\d{4})-W(\d{2})$/.exec(p))){const jan4=new Date(+m[1],0,4);const mon=addDays(jan4,-((jan4.getDay()+6)%7)+(+m[2]-1)*7);return ds(addDays(mon,6))}
  if(h==='monthly'&&(m=/^(\d{4})-(\d{2})$/.exec(p)))return ds(new Date(+m[1],+m[2],0));
  if(h==='annual'&&(m=/^(\d{4})$/.exec(p)))return m[1]+'-12-31';
  if(h==='five'&&(m=/^(\d{4})-(\d{4})$/.exec(p)))return m[2]+'-12-31';
  return null;}
function defaultExpected(g){
  if(g.horizon==='monthly'){const m=/^(\d{4})-(\d{2})$/.exec(g.period||'');if(!m)return 4;let n=0;const days=new Date(+m[1],+m[2],0).getDate();
    for(let d=1;d<=days;d++)if(new Date(+m[1],+m[2]-1,d).getDay()===4)n++;return n} // ISO weeks whose Thursday is in the month
  return{annual:12,five:5}[g.horizon]||1;}
const expectedOf=g=>Math.max(1,+g.expected||defaultExpected(g));
const fmtNum=n=>String(+(+n||0).toFixed(2));
function progressRaw(g,seen=new Set()){
  if(seen.has(g.id))return 0;seen.add(g.id);
  const k=goalKind(g);
  if(k==='number'){const t=+g.target||0;const v=+g.value||0;return t<=0?0:v>=t?100:Math.min(99,Math.floor(v/t*100))}
  if(k==='rollup'){const kids=S.goals.filter(c=>c.parentId===g.id);const n=Math.max(expectedOf(g),kids.length);
    const sum=kids.reduce((a,c)=>a+progress(c,seen),0);return sum>=n*100?100:Math.min(99,Math.floor(sum/n))}
  const t=S.tasks.filter(x=>x.goalId===g.id);if(!t.length)return 0;const d=t.filter(x=>x.done).length;return d===t.length?100:Math.min(99,Math.floor(d/t.length*100));
}
function progress(g,seen=new Set()){return g.done?100:progressRaw(g,seen)}
function goalDetail(g){
  const k=goalKind(g);
  if(k==='number')return'';
  if(k==='rollup'){const kids=S.goals.filter(c=>c.parentId===g.id),n=Math.max(expectedOf(g),kids.length),d=kids.filter(c=>c.done).length;
    const lbl=CHILD[g.horizon]?HORIZONS[CHILD[g.horizon]].toLowerCase():'sub';
    return`${d} of ${n} ${lbl} goals done${kids.length<n?` · ${n-kids.length} still to plan`:''}`}
  const t=S.tasks.filter(x=>x.goalId===g.id);return t.length?`${t.filter(x=>x.done).length}/${t.length} linked tasks done`:'tick ✓ when done';
}
const needsReview=g=>{if(g.done||g.status==='missed')return false;const e=periodEnd(g.horizon,g.period);return!!e&&e<TODAY()};
// Auto-complete goals that reached 100% (cascading upward); reopen auto-completed ones that dropped below.
function syncGoals(){
  const changed=new Set(),newly=new Set();
  for(let pass=0,dirty=true;dirty&&pass<10;pass++){dirty=false;
    for(const g of S.goals){
      if(g.status==='missed')continue;
      const raw=progressRaw(g);
      if(g.manualOpen&&raw<100){g.manualOpen=false;changed.add(g)}
      if(!g.done&&!g.manualOpen&&raw>=100){g.done=true;g.autoDone=true;g.doneAt=Date.now();changed.add(g);newly.add(g);dirty=true}
      else if(g.done&&g.autoDone&&raw<100){g.done=false;g.autoDone=false;g.doneAt=null;changed.add(g);newly.delete(g);dirty=true}
    }}
  for(const g of changed)DB.put('goals',g);
  return[...newly].filter(g=>g.done);
}
const logged=(hid,date)=>S.logs.has(hid+'|'+date);
// "Avoid" habits: a logged day is a SLIP; every day from creation until today is clean unless slipped.
const isNeg=h=>h.kind==='avoid';
const bornK=h=>ds(new Date(h.created||Date.now()));
const slipMode=h=>isNeg(h)&&h.mode!=='confirm';
const good=(h,k)=>slipMode(h)?(k>=bornK(h)&&k<=TODAY()&&!S.logs.has(h.id+'|'+k)):S.logs.has(h.id+'|'+k);
const hname=h=>(isNeg(h)?'🚫 ':'')+esc(h.name);
// Schedules: h.days = weekdays it's due (0=Sun…6=Sat); empty/missing = every day.
const hasSched=h=>Array.isArray(h.days)&&h.days.length>0&&h.days.length<7;
const isDue=(h,d)=>!hasSched(h)||h.days.includes(d.getDay());
const dueToday=h=>isDue(h,new Date());
const weekTarget=h=>hasSched(h)?h.days.length:(h.target||7);
const DOW_ORDER=[1,2,3,4,5,6,0];
const schedText=h=>hasSched(h)?DOW_ORDER.filter(n=>h.days.includes(n)).map(n=>fmt(new Date(2024,0,n||7),{weekday:'short'})).join(' · '):'';
// Streak = consecutive DUE days done; days off neither break nor add to it (a check-in on a day off still counts).
function streak(h){
  if(slipMode(h)){let n=0,d=new Date();while(n<3650&&good(h,ds(d))){n++;d=addDays(d,-1)}return n}
  let d=new Date();if(!good(h,ds(d)))d=addDays(d,-1);
  let n=0;for(let i=0;i<1100;i++){if(good(h,ds(d)))n++;else if(isDue(h,d))break;d=addDays(d,-1)}return n;
}
function weekCount(h){
  const d=new Date();const dow=(d.getDay()+6)%7;let n=0;
  for(let i=0;i<=dow;i++)if(good(h,ds(addDays(d,-i))))n++;return n;
}
function rate30(h){let due=0,n=0;for(let i=0;i<30;i++){const d=addDays(new Date(),-i);if(isNeg(h)&&ds(d)<bornK(h))continue;if(isDue(h,d)){due++;if(good(h,ds(d)))n++}}return due?Math.min(100,Math.round(n/due*100)):0}

/* ---------- Components ---------- */
const ARCHIVE_ICON='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>';
function fmtWhen(ts){if(!ts)return'';const d=new Date(ts);const y=d.getFullYear()!==new Date().getFullYear();
  return fmt(d,{month:'short',day:'numeric',...(y?{year:'numeric'}:{}),hour:'numeric',minute:'2-digit'})}
function fmtDay(s){return s?fmt(new Date(s+'T00:00'),{weekday:'short',month:'short',day:'numeric',year:'numeric'}):'—'}
function taskItem(t){
  const g=t.goalId&&goalById(t.goalId);const today=TODAY();
  const overdue=!t.done&&t.due&&t.due<today;
  return `<li class="item ${t.done?'done dim':''}">
    <input type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''} aria-label="Complete">
    <div class="grow"><div class="title">${esc(t.title)}</div>
      ${t.notes&&S.cfg.showNotes?`<div class="tnotes">${esc(t.notes)}</div>`:''}
      ${(t.items||[]).length&&S.cfg.showSubs?`<ul class="subs">${t.items.map((it,i)=>`<li><label class="${it.done?'sdone':''}"><input type="checkbox" data-action="toggle-sub" data-id="${t.id}" data-i="${i}" ${it.done?'checked':''}><span>${esc(it.text)}</span></label></li>`).join('')}</ul>`:''}
      <div class="meta">
        ${(t.items||[]).length?`<span title="Checklist">☑ ${t.items.filter(i=>i.done).length}/${t.items.length}</span>`:''}
        ${t.done&&t.doneAt?`<span>Done ${fmtWhen(t.doneAt)}</span>`:''}
        ${t.due?`<span class="${overdue?'overdue':''}">${overdue?'Overdue · ':''}${t.due===today?'Today':fmtDate(t.due)}</span>`:''}
        ${t.tag?`<span class="tag">#${esc(t.tag)}</span>`:''}
        ${t.repeat?`<span title="Repeats">🔁 ${REPEAT_LABEL[t.repeat]||''}</span>`:''}
        ${t.priority&&t.priority!=='low'?`<span class="p-${t.priority}">${t.priority==='high'?'High':'Medium'} priority</span>`:''}
        ${g?`<span class="tag">${esc(g.title)}</span>`:''}
      </div></div>
    <button class="icon" data-action="edit-task" data-id="${t.id}" title="Edit" aria-label="Edit">✎</button>
    ${shareBtn('task',t.id)}<button class="icon" data-action="archive-task" data-id="${t.id}" title="Archive" aria-label="Archive">${ARCHIVE_ICON}</button>
    <button class="icon" data-action="del-task" data-id="${t.id}" title="Delete" aria-label="Delete">✕</button></li>`;
}
function dayButtons(h,n=7){
  const today=TODAY();let out='';
  for(let i=n-1;i>=0;i--){const d=addDays(new Date(),-i);const k=ds(d);
    out+=`<button class="day ${good(h,k)?'on':''} ${isNeg(h)&&(slipMode(h)?logged(h.id,k):(k>=bornK(h)&&k<today&&!logged(h.id,k)))?'slip':''} ${k===today?'today':''} ${isDue(h,d)?'':'off'}" data-action="toggle-log" data-id="${h.id}" data-date="${k}" title="${k}">
      ${fmt(d,{weekday:'narrow'})}<b>${d.getDate()}</b></button>`}
  return `<div class="days">${out}</div>`;
}
function habitCard(h,full){
  const s=streak(h);
  if(full&&S.compact)return `<div class="card hcompact"><div class="habit">
    <div class="grow habit-open" data-action="open-habit" data-id="${h.id}" role="button" tabindex="0" title="Open history"><div class="title">${hname(h)}</div>
      <div class="meta"><span class="streak">${isNeg(h)?'🛡':'🔥'}${s}</span><span>${weekCount(h)}/${weekTarget(h)} this wk</span></div></div>
    ${dayButtons(h)}
    ${mvBtns('move-habit',h.id,`data-id="${h.id}"`)}<button class="icon" data-action="edit-habit" data-id="${h.id}" title="Edit" aria-label="Edit">✎</button></div></div>`;
  let heat='';if(full){for(let i=27;i>=0;i--){const k=ds(addDays(new Date(),-i));heat+=`<i class="${good(h,k)?'on':''}" title="${k}"></i>`}}
  return `<div class="card"><div class="habit">
    <div class="grow habit-open" data-action="open-habit" data-id="${h.id}" role="button" tabindex="0" title="Open history"><div class="title">${hname(h)} <span class="chev">›</span></div>
      <div class="meta"><span class="streak">${isNeg(h)?'🛡 '+s+' day'+(s===1?'':'s')+' clean':'🔥 '+s+' day'+(s===1?'':'s')}</span>
        <span>This week ${weekCount(h)}/${weekTarget(h)}</span>${full?`<span>30-day ${rate30(h)}%</span>`:''}${hasSched(h)?`<span>${schedText(h)}</span>`:''}</div></div>
    ${dayButtons(h)}
    ${full?`${mvBtns('move-habit',h.id,`data-id="${h.id}"`)}${shareBtn('habit',h.id)}<button class="icon" data-action="edit-habit" data-id="${h.id}" title="Edit" aria-label="Edit ${esc(h.name)}">✎</button><button class="icon" data-action="del-habit" data-id="${h.id}" title="Delete" aria-label="Delete ${esc(h.name)}">✕</button>`:''}
  </div>${full?`<div class="heat">${heat}</div>`:''}</div>`;
}
function goalCard(g){
  const p=progress(g),k=goalKind(g),parent=g.parentId&&goalById(g.parentId),rv=needsReview(g),missed=g.status==='missed';
  const tags=[`<span class="tag">${esc(g.period)}</span>`];
  if(g.done)tags.push(`<span class="tag t-ok">✓ Done${g.autoDone?' · auto':''}</span>`);
  if(missed)tags.push('<span class="tag t-bad">Missed</span>');
  if(rv)tags.push('<span class="tag t-warn">Needs review</span>');
  if(parent)tags.push(`<span>↑ ${esc(parent.title)}</span>`);
  if(g.carried&&g.carried.length)tags.push(`<span>↪ carried from ${esc(g.carried[g.carried.length-1])}</span>`);
  const det=goalDetail(g);
  const num=k==='number'?`<div class="numrow"><button class="ghost" data-action="goal-dec" data-id="${g.id}" aria-label="Decrease">−</button>
    <button class="numval" data-action="goal-set" data-id="${g.id}" title="Set exact value">${fmtNum(g.value)} <span>/ ${fmtNum(g.target)} ${esc(g.unit||'')}</span></button>
    <button class="ghost" data-action="goal-inc" data-id="${g.id}" aria-label="Increase">+</button></div>`:'';
  return `<div class="card goal ${g.done?'isdone':''} ${missed?'ismissed':''}">
    <div class="row"><div class="grow"><div class="title">${esc(g.title)}</div>
      <div class="meta">${tags.join('')}</div></div>
      <button class="icon" data-action="done-goal" data-id="${g.id}" title="${g.done?'Reopen':'Mark complete'}" aria-label="${g.done?'Reopen':'Mark complete'}">${g.done?'↺':'✓'}</button>
      <button class="icon" data-action="edit-goal" data-id="${g.id}" title="Edit" aria-label="Edit">✎</button>
      <button class="icon" data-action="del-goal" data-id="${g.id}" title="Delete" aria-label="Delete">✕</button></div>
    <div class="bar"><span style="width:${p}%"></span></div>
    <div class="meta"><span><b>${p}%</b></span>${det?`<span>${det}</span>`:''}</div>
    ${num}
    ${rv?`<button class="chip" style="margin-top:10px" data-action="open-review">Review now →</button>`:''}
    ${g.lesson?`<div class="notes">💬 ${esc(g.lesson)}</div>`:''}
    ${g.notes?`<div class="notes">${esc(g.notes)}</div>`:''}
  </div>`;
}
const goalOptions=(sel,filter=()=>true)=>`<option value="">— No goal —</option>`+
  S.goals.filter(g=>!g.done&&filter(g)).map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${HORIZONS[g.horizon]} · ${esc(g.title)}</option>`).join('');

/* ---------- Dashboard visuals ---------- */
function dayActivity(){
  const m={};
  for(const id of S.logs){const d=id.slice(id.lastIndexOf('|')+1);(m[d]||(m[d]={h:0,t:0})).h++}
  for(const t of S.tasks){if(t.done&&t.doneAt){const d=ds(new Date(t.doneAt));(m[d]||(m[d]={h:0,t:0})).t++}}
  return m;
}
function heatmapCard(){
  const act=dayActivity();const now=new Date();const today=TODAY();
  const monday=addDays(now,-((now.getDay()+6)%7));const start=addDays(monday,-25*7);
  let cells='',months='',total=0,activeDays=0,max=0;
  for(let i=0;i<182;i++){const k=ds(addDays(start,i));const a=act[k];if(a)max=Math.max(max,a.h+a.t)}
  let lastMonth=-1;
  for(let w=0;w<26;w++){
    const colStart=addDays(start,w*7);
    const firstOfMonth=[...Array(7)].map((_,j)=>addDays(colStart,j)).find(d=>d.getDate()===1);
    const mo=firstOfMonth||(w===0?colStart:null);
    if(mo&&mo.getMonth()!==lastMonth){months+=`<span>${fmt(mo,{month:'short'})}</span>`;lastMonth=mo.getMonth()}else months+='<span></span>';
    for(let j=0;j<7;j++){
      const d=addDays(colStart,j);const k=ds(d);
      if(k>today){cells+='<i class="fut"></i>';continue}

function habitDates(h){return[...S.logs].filter(k=>k.startsWith(h.id+'|')).map(k=>k.slice(k.lastIndexOf('|')+1)).sort()}
function bestStreak(h){const dates=isNeg(h)?[bornK(h)]:habitDates(h);if(!dates.length)return 0;let best=0,run=0;const today=TODAY();
  for(let d=new Date(dates[0]+'T00:00');ds(d)<=today;d=addDays(d,1)){const k=ds(d);
    if(good(h,k)){run++;best=Math.max(best,run)}else if(isDue(h,d)&&(k!==today||slipMode(h)))run=0}return best}
function openHabit(id){const d=new Date();cal={id,y:d.getFullYear(),m:d.getMonth()};drawHabit();dlg.showModal();}
function drawHabit(){
  const h=S.habits.find(x=>x.id===cal.id);if(!h){dlg.close();return}
  const now=new Date(),today=TODAY(),createdK=h.created?ds(new Date(h.created)):null;
  const first=new Date(cal.y,cal.m,1),lead=(first.getDay()+6)%7,days=new Date(cal.y,cal.m+1,0).getDate();
  let cells='<span></span>'.repeat(lead),monthCount=0;
  for(let d=1;d<=days;d++){
    const k=ds(new Date(cal.y,cal.m,d)),on=good(h,k),star=k===createdK;if(on)monthCount++;
    cells+=`<button type="button" class="cd ${on?'on':''} ${k===today?'tod':''} ${isDue(h,new Date(cal.y,cal.m,d))?'':'off'}" ${k>today?'disabled':`data-action="cal-toggle" data-date="${k}"`} aria-pressed="${on}" aria-label="${k}${star?', habit created':''}">${d}${star?'<i class="star" aria-hidden="true">★</i>':''}</button>`;
  }
  const wk=[...Array(7)].map((_,i)=>`<span>${fmt(new Date(2024,0,1+i),{weekday:'narrow'})}</span>`).join(''); // 1 Jan 2024 was a Monday
  const atNow=cal.y===now.getFullYear()&&cal.m===now.getMonth();
  const created=createdK?`<span><i class="star-inline">★</i> Created ${fmtDate(createdK)}${createdK.slice(0,4)!==today.slice(0,4)?', '+createdK.slice(0,4):''}</span>`:'';
  dlg.innerHTML=`<div class="hist">
    <div class="hist-top"><h3>${esc(h.name)}</h3><button type="button" class="icon" data-action="dlg-close" aria-label="Close">✕</button></div>
    <div class="hist-stats"><div><b>🔥 ${streak(h)}</b><span>Current</span></div><div><b>${bestStreak(h)}</b><span>Best streak</span></div><div><b>${habitDates(h).length}</b><span>Total days</span></div><div><b>${rate30(h)}%</b><span>Last 30</span></div></div>
    <div class="cal-nav"><button type="button" class="icon" data-action="cal-month" data-d="-1" aria-label="Previous month">‹</button><b>${fmt(first,{month:'long',year:'numeric'})}</b><button type="button" class="icon" data-action="cal-month" data-d="1" ${atNow?'disabled':''} aria-label="Next month">›</button></div>
    <div class="cal cal-wk">${wk}</div><div class="cal">${cells}</div>
    <div class="meta cal-foot"><span>${monthCount} day${monthCount===1?'':'s'} this month</span>${created}</div>
    <p class="meta">Tap any past day to check it off or undo it.</p></div>`;
}

const Sound={
  ctx:null,on:true,
  load(){try{this.on=localStorage.getItem('gt-sound')!=='off'}catch(e){}},
  set(v){this.on=v;try{localStorage.setItem('gt-sound',v?'on':'off')}catch(e){}},
  play(kind){
    if(!this.on)return;
    try{
      const C=this.ctx||(this.ctx=new (window.AudioContext||window.webkitAudioContext)());
      if(C.state==='suspended')C.resume();
      // task: bright rising C–E–G · habit: softer two-note "pop" · undo: falling G–E♭–C "womp", last note sags
      const S_={task:{n:[[1046.5,0],[1318.5,.07],[1568,.14]],len:.38,vol:.16},
                habit:{n:[[784,0],[1174.7,.08]],len:.38,vol:.16},
                undo:{n:[[392,0],[311.1,.16],[261.6,.32]],len:.5,vol:.13,sag:true},
                goal:{n:[[784,0],[1046.5,.1],[1318.5,.2],[1568,.3],[2093,.42]],len:.55,vol:.15}}[kind]||null;
      if(!S_)return;
      const t0=C.currentTime+.01;
      S_.n.forEach(([f,dt],i)=>{
        const o=C.createOscillator(),g=C.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t0+dt);
        const last=i===S_.n.length-1,len=last&&S_.sag?S_.len*1.6:S_.len;
        if(last&&S_.sag)o.frequency.exponentialRampToValueAtTime(f*.82,t0+dt+len);
        g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(S_.vol,t0+dt+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+len);
        o.connect(g).connect(C.destination);o.start(t0+dt);o.stop(t0+dt+len+.05);
      });
    }catch(e){}
  }
};
Sound.load();

const ARROW={'→':'←','←':'→'};
function trCore(s){if(Object.prototype.hasOwnProperty.call(AR,s))return AR[s];for(const[re,fn]of PAT){const m=s.match(re);if(m)return fn(m)}return null}
function trText(s){
  s=String(s);const t=s.trim();if(!t||!/[A-Za-z]/.test(t))return s;
  const lead=s.slice(0,s.length-s.trimStart().length),trail=s.slice(s.trimEnd().length);
  let r=trCore(t);
  if(r===null){const m=t.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9)\]]*)$/);if(m&&m[2]){const c=trCore(m[2]);if(c!==null)r=m[1]+c+m[3]}}
  if(r===null)return s;
  return lead+r.replace(/[→←]/g,c=>ARROW[c])+trail;
}
const TR_ATTRS=['placeholder','title','aria-label'];
function trNode(root){
  if(S.cfg.lang!=='ar'||!root)return;
  const doText=n=>{const p=n.parentElement;if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'||p.tagName==='TEXTAREA'))return;const v=n.nodeValue,r=trText(v);if(r!==v){n._en=v;n.nodeValue=r}};
  const doEl=e=>{for(const a of TR_ATTRS){const v=e.getAttribute&&e.getAttribute(a);if(v){const r=trText(v);if(r!==v){if(!e.hasAttribute('data-en-'+a))e.setAttribute('data-en-'+a,v);e.setAttribute(a,r)}}}};
  if(root.nodeType===3){doText(root);return}
  if(root.nodeType!==1)return;
  doEl(root);root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(doEl);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())doText(n);
}
function untrNode(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n._en!==undefined){n.nodeValue=n._en;delete n._en}}
  root.querySelectorAll('*').forEach(e=>{for(const a of TR_ATTRS){const o=e.getAttribute('data-en-'+a);if(o!==null){e.setAttribute(a,o);e.removeAttribute('data-en-'+a)}}});
}
function applyLang(){
  const ar=S.cfg.lang==='ar';
  document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';LOCALE=ar?'ar-u-nu-latn':undefined;
  const t=$('#today');if(t)t.textContent=new Date().toLocaleDateString(LOCALE,{weekday:'long',month:'long',day:'numeric'});
  if(ar)trNode(document.body);else untrNode(document.body);
}

const daysSince=ts=>ts?Math.round((new Date(TODAY()+'T00:00')-new Date(ds(new Date(ts))+'T00:00'))/864e5):null;
const agoText=n=>n===null?'never':n<=0?'today':n===1?'yesterday':n+' days ago';
function backupDue(){const n=daysSince(lastBackup());return n===null||n>BACKUP_STALE}
function backupNudge(){
  if(!backupDue()||!(S.tasks.length+S.goals.length+S.habits.length))return false;
  let snooze=0;try{snooze=+localStorage.getItem('gt-backup-snooze')||0}catch(e){}
  return!(snooze&&Date.now()-snooze<3*864e5);
}
S.storage=null; // 'protected' | 'unprotected' | 'unsupported'
async function checkStorage(ask){
  try{const st=navigator.storage;if(!st||!st.persisted){S.storage='unsupported';return}
    let p=await st.persisted();if(!p&&ask&&st.persist)p=await st.persist();S.storage=p?'protected':'unprotected'}
  catch(e){S.storage='unsupported'}
}

/* ---------- Weekly planning ---------- */
function planTargets(){const mp=currentPeriod('monthly');return S.goals.filter(g=>g.horizon==='monthly'&&g.period===mp&&!g.done&&g.status!=='missed'&&goalKind(g)==='rollup')}
const planLeft=g=>Math.max(0,expectedOf(g)-S.goals.filter(c=>c.parentId===g.id).length);
function openPlan(){drawPlan();if(!dlg.open)dlg.showModal();const i=dlg.querySelector('.plan-add input[name=title]');i&&i.focus()}
function drawPlan(){
  const wk=currentPeriod('weekly'),targets=planTargets();
  const row=parent=>{
    const mine=parent?S.goals.filter(c=>c.parentId===parent.id&&c.period===wk):S.goals.filter(g=>g.horizon==='weekly'&&g.period===wk&&!g.parentId);
    const left=parent?planLeft(parent):0;
    return `<div class="card plan-row"><div class="title">${parent?esc(parent.title):'Standalone weekly goals'}</div>
      ${parent?`<div class="meta"><span>${goalDetail(parent)}</span>${left?'':'<span class="tag t-ok">Fully planned</span>'}</div>`:''}
      ${mine.length?`<ul class="plan-list">${mine.map(c=>`<li>• ${esc(c.title)}${goalKind(c)==='number'?` · ${fmtNum(c.target)} ${esc(c.unit||'')}`:''}</li>`).join('')}</ul>`:''}
      <form class="plan-add" data-plan="${parent?parent.id:''}" data-kind="check">
        <input type="text" name="title" placeholder="${parent?'This week\'s step toward it…':'A weekly goal of its own…'}" required autocomplete="off">
        <select name="kind" aria-label="How it's measured"><option value="check">☐ Checkbox</option><option value="number">🔢 Number</option></select>
        <span class="f-num"><input type="number" name="target" min="0" step="any" placeholder="Target, e.g. 10"><input type="text" name="unit" placeholder="Unit, e.g. hours"></span>
        <button class="btn">Add</button></form></div>`;
  };
  dlg.innerHTML=`<div class="hist"><div class="hist-top"><h3>Plan ${esc(wk)}</h3><button type="button" class="icon" data-action="dlg-close" aria-label="Close">✕</button></div>
    <p class="meta">${targets.length?`Add this week's steps under your ${esc(currentPeriod('monthly'))} goals. Each one moves its monthly goal forward.`:`No monthly goals built from weekly goals for ${esc(currentPeriod('monthly'))} yet. Add standalone goals below, or create a monthly goal on the Goals tab first.`}</p>
    <div class="goals" style="margin-top:10px">${targets.map(row).join('')}${row(null)}</div>
    <div class="dlg-actions"><button type="button" class="btn" data-action="dlg-close">Done</button></div></div>`;
}
dlg.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-plan]');if(!f)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f)),k=v.kind==='number'?'number':'check',pid=f.dataset.plan;
  if(k==='number'&&!(+v.target>0)){alert('Set a target number for this goal (for example 10).');return}
  const g={id:uid(),title:v.title.trim(),horizon:'weekly',period:currentPeriod('weekly'),parentId:pid||null,notes:'',kind:k,target:+v.target||0,unit:(v.unit||'').trim(),value:0,expected:null,done:false,created:Date.now()};
  S.goals.push(g);await DB.put('goals',g);drawPlan();render();
  const i=dlg.querySelector(`form[data-plan="${pid}"] input[name=title]`);i&&i.focus();
});

/* ---------- Period-end review ---------- */
function rvNote(g){const i=dlg.querySelector(`.rv-note[data-id="${g.id}"]`);const t=i&&i.value.trim();if(t)g.lesson=g.lesson?g.lesson+'\n'+t:t}
function openReview(){drawReview();if(S.goals.some(needsReview)&&!dlg.open)dlg.showModal()}
function drawReview(){
  const ord={weekly:0,monthly:1,annual:2,five:3};
  const list=S.goals.filter(needsReview).sort((a,b)=>ord[a.horizon]-ord[b.horizon]||a.period.localeCompare(b.period));
  if(!list.length){if(dlg.open){dlg.close();notify('All caught up. Reviews done ✓')}return}
  dlg.innerHTML=`<div class="hist"><div class="hist-top"><h3>Review ${list.length} goal${list.length>1?'s':''}</h3><button type="button" class="icon" data-action="dlg-close" aria-label="Close">✕</button></div>
    <p class="meta">These periods have ended. Be honest. This is where the system gets smarter.</p>
    <div class="goals" style="margin-top:10px">${list.map(g=>`<div class="card rv">
      <div class="title">${esc(g.title)}</div>
      <div class="meta"><span class="tag">${HORIZONS[g.horizon]} · ${esc(g.period)}</span><span><b>${progress(g)}%</b>${goalDetail(g)?' · '+goalDetail(g):goalKind(g)==='number'?` · ${fmtNum(g.value)}/${fmtNum(g.target)} ${esc(g.unit||'')}`:''}</span></div>
      <input type="text" class="rv-note" data-id="${g.id}" placeholder="What got in the way / what worked? (optional)">
      <div class="rv-actions"><button type="button" class="ghost ok" data-action="rv-hit" data-id="${g.id}">✓ Hit it</button>
        <button type="button" class="ghost bad" data-action="rv-miss" data-id="${g.id}">✗ Missed</button>
        <button type="button" class="ghost" data-action="rv-carry" data-id="${g.id}">→ Carry to ${esc(currentPeriod(g.horizon))}</button></div></div>`).join('')}</div></div>`;
}

let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('act');t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
let undoFn=null;
function toastUndo(msg,fn){const t=$('#toast');undoFn=fn;t.innerHTML=`${esc(msg)} <button type="button" data-undo>Undo</button>`;t.classList.add('show','act');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.classList.remove('show','act');undoFn=null},6000)}
$('#toast').addEventListener('click',async e=>{if(!e.target.closest('[data-undo]')||!undoFn)return;const f=undoFn;undoFn=null;$('#toast').classList.remove('show','act');await f();Sound.play('undo');render()});

/* ---------- Checklists ---------- */
function parseItems(txt,old=[]){
  const was=new Map((old||[]).map(i=>[i.text,i.done]));
  return String(txt||'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,50).map(text=>({text,done:!!was.get(text)}));
}
/* ---------- Repeating tasks ---------- */
const REPEATS=[['','No repeat'],['daily','Daily'],['weekdays','Weekdays'],['weekly','Weekly'],['monthly','Monthly']];
const REPEAT_LABEL=Object.fromEntries(REPEATS.filter(r=>r[0]));
function stepDue(d,rule){const x=new Date(d);
  if(rule==='daily')x.setDate(x.getDate()+1);
  else if(rule==='weekdays'){do x.setDate(x.getDate()+1);while(x.getDay()===0||x.getDay()===6)}
  else if(rule==='weekly')x.setDate(x.getDate()+7);
  else if(rule==='monthly'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  return x}
// Next due date after the task's own date, skipping past dates so an overdue task doesn't spawn more overdue ones.
function nextDue(t){const today=TODAY();let d=stepDue(new Date((t.due||today)+'T00:00'),t.repeat);for(let i=0;i<400&&ds(d)<today;i++)d=stepDue(d,t.repeat);return ds(d)}
async function onTaskDone(t){
  if(!t.repeat)return;
  if(t.done&&!t.nextId){
    const n={id:uid(),title:t.title,notes:t.notes||'',repeat:t.repeat,due:nextDue(t),priority:t.priority,goalId:t.goalId||null,tag:t.tag||'',items:(t.items||[]).map(i=>({text:i.text,done:false})),done:false,created:Date.now(),prevId:t.id};
    t.nextId=n.id;S.tasks.push(n);await DB.put('tasks',n);await DB.put('tasks',t);
    toast(`🔁 Next "${t.title}" on ${fmtDate(n.due)}`);
  }else if(!t.done&&t.nextId){
    const n=S.tasks.find(x=>x.id===t.nextId);
    if(n&&!n.done){S.tasks=S.tasks.filter(x=>x.id!==n.id);await DB.del('tasks',n.id)}
    t.nextId=null;await DB.put('tasks',t);
  }
}

/* ---------- Actions ---------- */
async function toggleLog(hid,date){
  const id=hid+'|'+date;
  const hh=S.habits.find(x=>x.id===hid),neg=hh&&slipMode(hh);
  if(S.logs.has(id)){S.logs.delete(id);await DB.del('logs',id);Sound.play(neg?'habit':'undo')}
  else if(neg){S.logs.add(id);await DB.put('logs',{id,habitId:hid,date});Sound.play('undo');toast(`Slip logged for "${hh.name}". Tap the day again to undo.`)}
  else{S.logs.add(id);await DB.put('logs',{id,habitId:hid,date});
    const h=hh,g=h&&folderOf(h);
    if(g&&date===TODAY()&&S.habits.filter(x=>folderOf(x)===g&&dueToday(x)).every(x=>good(x,date))){Sound.play('goal');toast(`✅ ${g}: all done for today`)}
    else Sound.play('habit')}
}

function searchResults(q){
  q=q.trim().toLowerCase();if(!q)return '<div class="empty">Type to search tasks, goals and habits.</div>';
  const has=(...a)=>a.some(x=>String(x||'').toLowerCase().includes(q));
  const row=(k,id,main,sub)=>`<button type="button" class="srow" data-sr="${k}:${id}"><b>${main}</b><span>${sub}</span></button>`;
  const tasks=S.tasks.filter(t=>has(t.title,t.notes,t.tag,(t.items||[]).map(i=>i.text).join(' '))).slice(0,30)
    .map(t=>row('task',t.id,esc(t.title),(t.archived?'Archived task':t.done?'Done task':'Task')+(t.due?' · '+fmtDate(t.due):'')));
  const goals=S.goals.filter(g=>has(g.title,g.notes,g.lesson)).slice(0,30)
    .map(g=>row('goal',g.id,esc(g.title),HORIZONS[g.horizon]+' goal · '+esc(g.period)+(g.done?' · done':'')));
  const habits=S.habits.filter(h=>has(h.name,h.group)).slice(0,30)
    .map(h=>row('habit',h.id,esc(h.name),'Habit'+(h.group?' · '+esc(h.group):'')));
  const topics=S.cfg.student?S.topics.filter(t=>has(t.name,t.subject)).slice(0,30).map(t=>row('topic',t.id,esc(t.name),'Topic · '+esc(t.subject))):[];
  const exams=S.cfg.student?S.exams.filter(e=>has(e.title,e.subject,e.notes)).slice(0,20).map(e=>row('exam',e.id,esc(e.title),(e.kind==='quiz'?'Quiz':'Exam')+' · '+fmtDate(e.date))):[];
  const all=[...tasks,...goals,...habits,...topics,...exams];
  return all.length?all.join(''):'<div class="empty">Nothing found.</div>';
}

/* ---------- Backup & restore ---------- */
function notify(m){typeof toast==='function'?toast(m):alert(m)}
function backupData(){
  return{app:'goal-tracker',version:1,exported:new Date().toISOString(),tasks:S.tasks,goals:S.goals,habits:S.habits,topics:S.topics,exams:S.exams,
    logs:[...S.logs].map(id=>{const i=id.lastIndexOf('|');return{id,habitId:id.slice(0,i),date:id.slice(i+1)}}),
    settings:{cfg:S.cfg,sound:Sound.on,hideDone:S.hideDone,compact:S.compact}};
}
async function restore(text,source){
  text=(text||'').replace(/^\uFEFF/,'').trim();
  if(!text)throw new Error(source==='file'?'the file is empty (0 bytes), so the export never finished saving. Export again, or use "Copy backup text" instead.':'nothing was pasted.');
  let d;
  try{d=JSON.parse(text)}catch(e){throw new Error(`the ${source} is cut off or isn't valid JSON (${(text.length/1024).toFixed(1)} KB). Export it again, or use "Copy backup text" instead.`)}
  if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.goals))throw new Error("that isn't a Goal Tracker backup.");
  const rows={};let skipped=0;
  for(const st of STORES){const src=Array.isArray(d[st])?d[st]:[];rows[st]=src.filter(r=>{const ok=r&&typeof r==='object'&&typeof r.id==='string'&&r.id&&(st!=='logs'||r.id.includes('|'));if(!ok)skipped++;return ok})}
  const n=`${rows.tasks.length} tasks, ${rows.goals.length} goals, ${rows.habits.length} habits, ${rows.logs.length} check-ins`+(rows.topics.length||rows.exams.length?`, ${rows.topics.length} topics, ${rows.exams.length} exams`:'')+(skipped?` (${skipped} damaged rows skipped)`:'');
  if(!confirm(`Replace all current data with this backup?\n\n${n}`))return false;
  const snap=backupData();
  try{for(const st of STORES){await DB.clear(st);for(const row of rows[st])await DB.put(st,row)}}
  catch(err){try{for(const st of STORES){await DB.clear(st);for(const row of (snap[st]||[]))await DB.put(st,row)}await load();render()}catch(_){}throw new Error('the restore failed part-way, so your previous data was put back ('+err.message+').')}
  if(d.settings&&typeof d.settings==='object'){const st=d.settings;
    if(st.cfg&&typeof st.cfg==='object'){const o={};for(const k in CFG_DEF)if(k in st.cfg&&typeof st.cfg[k]===typeof CFG_DEF[k])o[k]=st.cfg[k];S.cfg={...CFG_DEF,...o};saveCfg();applyLang()}
    if(typeof st.sound==='boolean')Sound.set(st.sound);
    if(typeof st.hideDone==='boolean'){S.hideDone=st.hideDone;try{localStorage.setItem('gt-hide-done',st.hideDone?'1':'0')}catch(e){}}
    if(typeof st.compact==='boolean'){S.compact=st.compact;try{localStorage.setItem('gt-compact',st.compact?'1':'0')}catch(e){}}}
  await load();render();return n;
}
function openBackup(mode){
  const copy=mode==='copy';
  dlg.innerHTML=`<form method="dialog" data-backup="${mode}"><h3>${copy?'Backup as text':'Restore from text'}</h3>
    <p class="meta">${copy?'Copy this and paste it somewhere safe, like a note or a message to yourself.':'Paste a backup you copied earlier. This replaces all current data.'}</p>
    <textarea name="text" spellcheck="false" style="min-height:180px;font:12px/1.4 ui-monospace,monospace" ${copy?'readonly':'placeholder="Paste backup here…"'}>${copy?esc(JSON.stringify(backupData())):''}</textarea>
    <div class="dlg-actions"><button class="ghost" value="cancel" formnovalidate>Close</button><button class="btn" value="go">${copy?'Copy':'Restore'}</button></div></form>`;
  dlg.showModal();

dlg.addEventListener('submit',async e=>{

  if(e.submitter&&e.submitter.value==='cancel'){dlg.close();return}
  const ta=f.elements.text;
  if(f.dataset.backup==='copy'){
    let ok=false;

function syncThemeColor(){const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.body).backgroundColor||'#faf5ee'}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncThemeColor)}catch(e){}
$('#themeBtn').addEventListener('click',()=>{const order=['auto','light','dark'];setTheme(order[(order.indexOf(getTheme())+1)%3])});
setTheme(getTheme());

async function autoArchive(){
  const days=+S.cfg.autoArch;if(!days)return;const cut=Date.now()-days*864e5;
  for(const t of S.tasks)if(t.done&&!t.archived&&t.doneAt&&t.doneAt<cut){t.archived=true;t.archivedAt=Date.now();await DB.put('tasks',t)}
}
(async()=>{
  applyLang();
  await load();await autoArchive();render();
  await checkStorage(true);if(S.view==='data')render();
})();
</script>
</body>
