      g.status = null;
    }
    if (old !== g.horizon) {
      // keep the hierarchy valid: unlink sub-goals that no longer sit one level below
      for (const c of S.goals.filter((c) => c.parentId === g.id && PARENT[c.horizon] !== g.horizon)) {

function bestStreak(h) {
  const dates = isNeg(h) ? [bornK(h)] : habitDates(h);
  if (!dates.length) return 0;
  let best = 0,
    run = 0;
  const today = TODAY();
  for (let d = new Date(dates[0] + 'T00:00'); ds(d) <= today; d = addDays(d, 1)) {

function openHabit(id) {
  const d = new Date();
  cal = { id, y: d.getFullYear(), m: d.getMonth() };
  drawHabit();

}
function drawHabit() {
  const h = S.habits.find((x) => x.id === cal.id);
  if (!h) {
    dlg.close();
    return;
  }
  const now = new Date(),
    today = TODAY(),
    createdK = h.created ? ds(new Date(h.created)) : null;
  const first = new Date(cal.y, cal.m, 1),
    lead = (first.getDay() + 6) % 7,
    days = new Date(cal.y, cal.m + 1, 0).getDate();
  let cells = '<span></span>'.repeat(lead),
    monthCount = 0;
  for (let d = 1; d <= days; d++) {
    const k = ds(new Date(cal.y, cal.m, d)),
      on = good(h, k),
      star = k === createdK;
    if (on) monthCount++;
    cells += `<button type="button" class="cd ${on ? 'on' : ''} ${k === today ? 'tod' : ''} ${isDue(h, new Date(cal.y, cal.m, d)) ? '' : 'off'}" ${k > today ? 'disabled' : `data-action="cal-toggle" data-date="${k}"`} aria-pressed="${on}" aria-label="${k}${star ? ', habit created' : ''}">${d}${star ? '<i class="star" aria-hidden="true">★</i>' : ''}</button>`;
  }
  const wk = [...Array(7)]
    .map((_, i) => `<span>${fmt(new Date(2024, 0, 1 + i), { weekday: 'narrow' })}</span>`)
    .join(''); // 1 Jan 2024 was a Monday
  const atNow = cal.y === now.getFullYear() && cal.m === now.getMonth();
  const created = createdK
    ? `<span><i class="star-inline">★</i> Created ${fmtDate(createdK)}${createdK.slice(0, 4) !== today.slice(0, 4) ? ', ' + createdK.slice(0, 4) : ''}</span>`
    : '';

    <div class="hist-top"><h3>${esc(h.name)}</h3><button type="button" class="icon" data-action="dlg-close" aria-label="Close">✕</button></div>

    <div class="cal-nav"><button type="button" class="icon" data-action="cal-month" data-d="-1" aria-label="Previous month">‹</button><b>${fmt(first, { month: 'long', year: 'numeric' })}</b><button type="button" class="icon" data-action="cal-month" data-d="1" ${atNow ? 'disabled' : ''} aria-label="Next month">›</button></div>
    <div class="cal cal-wk">${wk}</div><div class="cal">${cells}</div>
    <div class="meta cal-foot"><span>${monthCount} day${monthCount === 1 ? '' : 's'} this month</span>${created}</div>
    <p class="meta">Tap any past day to check it off or undo it.</p></div>`;
}

/** Lays overlapping blocks side by side: returns [{t, s, e, col, n}] (n = columns in its overlap group). */
function layoutBlocks(tasks) {
  const ev = tasks
    .map((t) => ({ t, s: toMin(t.start), e: Math.min(1440, toMin(t.start) + blockLen(t)) }))
    .sort((a, b) => a.s - b.s || b.e - a.e);

    groupEnd = 0;
  const flush = () => {
    const cols = [];
    for (const x of group) {
      let c = cols.findIndex((end) => end <= x.s);
      if (c < 0) c = cols.length;
      cols[c] = x.e;
      x.col = c;
    }
    group.forEach((x) => (x.n = cols.length));
    group = [];
  };
  for (const x of ev) {
    if (group.length && x.s >= groupEnd) flush();
    group.push(x);
    groupEnd = Math.max(groupEnd, x.e);
  }
  flush();
  return ev;
}

/**
 * Safety copies: automatic snapshots kept in a SEPARATE IndexedDB (goal-tracker-snap), so a bad restore,
 * an erase or a bug in the main database can always be rolled back. Also the "Check my data" repair tool.
 * (All src/js files are joined, in filename order, into one shared scope. See src/README.md.)
 */
const SNAP_KEEP = 10;
const Snap = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res) => {
      try {
        const r = indexedDB.open('goal-tracker-snap', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('snaps', { keyPath: 'id' });
        r.onsuccess = () => res((this.db = r.result));
        r.onerror = () => res(null);
      } catch (e) {
        res(null);
      }
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    if (!db) throw new Error('no snapshot storage');
    return new Promise((res, rej) => {
      const t = db.transaction('snaps', mode),
        r = fn(t.objectStore('snaps'));
      t.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  all() {
    return this.run('readonly', (s) => s.getAll()).then((a) => (a || []).sort((x, y) => y.at - x.at));
  },
  put(v) {
    return this.run('readwrite', (s) => s.put(v));
  },
  del(id) {
    return this.run('readwrite', (s) => s.delete(id));
  },
};
/* Save a snapshot of everything. Returns the record, or null when there is nothing to save or storage failed. */
async function snapSave(reason) {
  const n = {
    tasks: S.tasks.length,
    goals: S.goals.length,
    habits: S.habits.length,
    logs: S.logs.size,
    topics: S.topics.length,
    exams: S.exams.length,
  };
  if (!(n.tasks + n.goals + n.habits + n.topics + n.exams)) return null;
  try {
    const rec = {
      id: 's' + Date.now() + Math.random().toString(36).slice(2, 5),
      at: Date.now(),
      reason,
      n,
      json: JSON.stringify(backupData()),
    };
    await Snap.put(rec);
    const all = await Snap.all();
    for (const old of all.slice(SNAP_KEEP)) await Snap.del(old.id);
    return rec;
  } catch (e) {
    return null;
  }
}

    await DB.del('logs', k);
  }
  toast(L2(`Fixed ${total} thing(s).`, `تم إصلاح ${total} عنصر.`));
}
/* ---------- Edit history (last 5 titles and notes) ---------- */
function histPush(item, prevTitle, prevNotes) {
  if (prevTitle === item.title && (prevNotes || '') === (item.notes || '')) return;
  item.hist = [{ at: Date.now(), title: prevTitle, notes: prevNotes || '' }, ...(item.hist || [])].slice(0, 5);
}
function histBox(item) {
  const h = (item && item.hist) || [];
  if (!h.length) return '';
  return `<details class="more"><summary>${L2('Earlier versions', 'نسخ سابقة')} (${h.length})</summary>${h
    .map(
      (x, i) =>
        `<div class="row" style="margin:6px 0;align-items:center"><span class="meta grow" translate="no">${esc(fmtWhen(x.at))} · ${esc(x.title)}${x.notes ? ' · ' + esc(x.notes.slice(0, 40)) : ''}</span><button type="button" class="chip" data-action="hist-use" data-i="${i}">${L2('Use', 'استخدم')}</button></div>`
    )
    .join('')}</details>`;
}

const REPEATS = [
  ['', 'No repeat'],
  ['daily', 'Daily'],
  ['weekdays', 'Weekdays'],
  ['weekly', 'Weekly'],
  ['monthly', 'Monthly'],
];
const REPEAT_LABEL = Object.fromEntries(REPEATS.filter((r) => r[0]));
function stepDue(d, rule) {
  const x = new Date(d);
  if (rule === 'daily') x.setDate(x.getDate() + 1);
  else if (rule === 'weekdays') {
    do x.setDate(x.getDate() + 1);
    while (x.getDay() === 0 || x.getDay() === 6);
  } else if (rule === 'weekly') x.setDate(x.getDate() + 7);
  else if (rule === 'monthly') {
    const day = x.getDate();
    x.setDate(1);
    x.setMonth(x.getMonth() + 1);
    x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate()));
  }
  return x;
}

function nextDue(t) {

  let d = stepDue(new Date((t.due || today) + 'T00:00'), t.repeat);
  for (let i = 0; i < 400 && ds(d) < today; i++) d = stepDue(d, t.repeat);
  return ds(d);
}

      done: false,

    t.nextId = n.id;
    S.tasks.push(n);
    await DB.put('tasks', n);
    await DB.put('tasks', t);
    toast(`🔁 Next "${t.title}" on ${fmtDate(n.due)}`);

    const n = S.tasks.find((x) => x.id === t.nextId);
    if (n && !n.done) {

      await DB.del('tasks', n.id);
    }
    t.nextId = null;
    await DB.put('tasks', t);
  }
}

  const hh = S.habits.find((x) => x.id === hid),
    neg = hh && slipMode(hh);
  if (S.logs.has(id)) {
    const long = hh && !neg && streak(hh) >= 7;
    S.logs.delete(id);
    await DB.del('logs', id);
    Sound.play(neg ? 'habit' : 'undo');
    if (long)
      toastUndo(`Removed a check-in from "${hh.name}".`, async () => {
        S.logs.add(id);
        await DB.put('logs', { id, habitId: hid, date });
      });
  } else if (neg) {
    S.logs.add(id);
    await DB.put('logs', { id, habitId: hid, date });
    Sound.play('undo');
    toast(`Slip logged for "${hh.name}". Tap the day again to undo.`);
  } else {
    S.logs.add(id);
    await DB.put('logs', { id, habitId: hid, date });
    const h = hh,
      g = h && folderOf(h);
    if (g && date === TODAY() && S.habits.filter((x) => folderOf(x) === g && dueToday(x)).every((x) => good(x, date))) {

      toast(`✅ ${g}: all done for today`);

  }

    const g = folderOf(h);
    const sib = all.filter((x) => folderOf(x) === g);
    const i = sib.indexOf(h),
      j = i + +el.dataset.d;
    if (j < 0 || j >= sib.length) return false;
    [sib[i], sib[j]] = [sib[j], sib[i]];
    let k = 0;
    const out = all.map((x) => (folderOf(x) === g ? sib[k++] : x));
    for (let n = 0; n < out.length; n++)
      if (out[n].order !== n) {
        out[n].order = n;
        await DB.put('habits', out[n]);
      }

      return (x < 0 ? 1e6 : x) - (y < 0 ? 1e6 : y);
    });
    const i = names.indexOf(el.dataset.name),
      j = i + +el.dataset.d;
    if (i < 0 || j < 0 || j >= names.length) return false;

// Long-press a task or habit to start selecting (Escape or Back leaves select mode).
(() => {
  let tm = null,
    fired = false,
    sx = 0,
    sy = 0;
  const cancel = () => {
    clearTimeout(tm);
    tm = null;
  };
  document.addEventListener('pointerdown', (e) => {
    cancel();
    if (
      S.selMode ||
      (S.view !== 'tasks' && S.view !== 'habits') ||
      (e.button || 0) > 0 ||
      e.target.closest('input,button,select,a')
    )
      return;
    const row = e.target.closest(S.view === 'tasks' ? '#app .item.trow2' : '#app .goals>.card');
    if (!row) return;
    const idEl = row.querySelector('[data-id]');
    if (!idEl) return;
    sx = e.clientX;
    sy = e.clientY;
    tm = setTimeout(() => {
      tm = null;
      fired = true;
      S.selMode = S.view;
      S.sel.clear();
      S.sel.add(idEl.dataset.id);
      try {
        navigator.vibrate && navigator.vibrate(15);
      } catch (_) {}
      render();
    }, 520);
  });
  document.addEventListener('pointermove', (e) => {
    if (tm && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
  });
  document.addEventListener(
    'pointerup',
    () => {
      cancel();
      if (fired) {
        fired = false;
        S._eat = Date.now();
      }
    },
    true
  );
  document.addEventListener(
    'pointercancel',
    () => {
      cancel();
      fired = false;
    },
    true
  );
  document.addEventListener('scroll', cancel, true);
  document.addEventListener('contextmenu', (e) => {
    if (fired || (S.selMode && e.target.closest('#app .item,#app .card'))) e.preventDefault();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && S.selMode && !dlg.open) {
      S.selMode = null;
      S.sel.clear();
      render();
    }
  });
})();

        ok = document.execCommand('copy');

      toast('Could not save: ' + ((e && e.message) || e));
    }

  if (a === 'send' && window.GTNative) {

      await GTNative.shareFile(name, json);
    } catch (e) {}
    return;
  }
  if (a === 'file') {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const l = document.createElement('a');
    l.href = url;
    l.download = name;

    try {

function shimpPreview(text) {

    <div class="dlg-actions"><button class="ghost" value="cancel" formnovalidate>Cancel</button>${n ? '<button type="button" class="btn" data-shimp-act="add">Add selected</button>' : ''}</div></form>`;
}
async function shimpAdd() {
  const picked = new Set([...dlg.querySelectorAll('[data-shimp-item]:checked')].map((c) => c.dataset.shimpItem));
  let add = 0,
    skip = 0;
  const now = Date.now();
  const low = (x) => x.trim().toLowerCase();
  SHP.habits.forEach((h, i) => {
    if (!picked.has('habit:' + i)) return;
    if (S.habits.some((x) => low(x.name) === low(h.name) && (x.kind || '') === h.kind)) {
      skip++;
      return;
    }
    const n = {
      id: uid(),
      name: h.name,
      kind: h.kind,
      mode: h.mode,
      target: h.kind === 'avoid' ? 7 : h.target,
      group: h.group,
      days: h.kind === 'avoid' ? [] : h.days,
      created: now,
    };
    S.habits.push(n);
    DB.put('habits', n);
    add++;
  });
  SHP.tasks.forEach((t, i) => {
    if (!picked.has('task:' + i)) return;
    if (S.tasks.some((x) => !x.archived && low(x.title) === low(t.title) && (x.due || null) === t.due)) {
      skip++;
      return;
    }
    const n = {
      id: uid(),
      title: t.title,
      notes: t.notes,
      items: t.items.map((text) => ({ text, done: false })),
      due: t.due,
      priority: t.priority,
      repeat: t.repeat,
      tag: t.tag,
      goalId: null,
      done: false,
      created: now,
    };
    S.tasks.push(n);
    DB.put('tasks', n);
    add++;
  });
  let student = false;
  SHP.exams.forEach((e, i) => {
    if (!picked.has('exam:' + i)) return;
    if (S.exams.some((x) => low(x.title) === low(e.title) && x.date === e.date)) {
      skip++;
      return;
    }
    const n = { id: uid(), ...e, score: null, max: null, created: now };
    S.exams.push(n);
    DB.put('exams', n);
    add++;
    student = true;
  });
  SHP.topics.forEach((t, i) => {
    if (!picked.has('topic:' + i)) return;
    if (S.topics.some((x) => low(x.subject) === low(t.subject) && low(x.name) === low(t.name))) {
      skip++;
      return;
    }
    const n = { id: uid(), subject: t.subject, name: t.name, sessions: [], created: now };
    S.topics.push(n);
    DB.put('topics', n);
    add++;
    student = true;
  });
  if (student && !S.cfg.student) {
    S.cfg.student = true;
    saveCfg();
  }
  dlg.close();
  render();
  toast(
    `Added ${add} item${add === 1 ? '' : 's'}${skip ? `, skipped ${skip} you already have` : ''}${student ? '. Student mode is on' : ''}`
  );
}

/* ---------- Backup & restore ---------- */
function notify(m) {
  typeof toast === 'function' ? toast(m) : askAlert(m);
}
function backupData() {

    version: 1,

function restorePreview(d, rows, skipped) {
  const cur = {
    tasks: S.tasks.length,
    goals: S.goals.length,
    habits: S.habits.length,
    logs: S.logs.size,
    topics: S.topics.length,
    exams: S.exams.length,
  };
  const lab = {
    tasks: L2('Tasks', 'المهام'),
    goals: L2('Goals', 'الأهداف'),
    habits: L2('Habits', 'العادات'),
    logs: L2('Check-ins', 'تسجيلات'),
    topics: L2('Topics', 'المواضيع'),
    exams: L2('Exams', 'الامتحانات'),
  };
  const dates = [...rows.tasks.map((t) => t.created), ...rows.goals.map((g) => g.created)]
    .filter((x) => typeof x === 'number')
    .sort((a, b) => a - b);
  const ex = d.exported ? new Date(d.exported) : null,
    exOk = ex && !isNaN(ex),
    lost = Object.keys(cur).filter((k) => rows[k].length < cur[k]);
  return new Promise((res) => {
    dlg.innerHTML = `<div class="hist"><div class="hist-top"><h3>Restore this backup?</h3><button type="button" class="icon" data-rp="0" aria-label="Close">✕</button></div>
      <div class="kv"><span>${L2('Made', 'أُنشئت')}</span><span>${exOk ? fmtWhen(ex.getTime()) + ' · ' + agoText(daysSince(ex.getTime())) : '—'}</span></div>
      ${d.appVersion ? `<div class="kv"><span>${L2('App version', 'إصدار التطبيق')}</span><span>${esc(String(d.appVersion))}</span></div>` : ''}
      ${dates.length ? `<div class="kv"><span>${L2('Covers', 'تغطي')}</span><span>${fmtDate(ds(new Date(dates[0])))} – ${fmtDate(ds(new Date(dates.at(-1))))}</span></div>` : ''}
      <table class="rp"><thead><tr><th></th><th>${L2('Backup', 'النسخة')}</th><th>${L2('Now', 'الآن')}</th></tr></thead><tbody>${Object.keys(
        cur
      )
        .map(
          (k) =>
            `<tr class="${rows[k].length < cur[k] ? 'less' : ''}"><td>${lab[k]}</td><td>${rows[k].length}</td><td>${cur[k]}</td></tr>`
        )
        .join('')}</tbody></table>
      ${skipped ? `<p class="meta">${L2(`${skipped} damaged rows will be skipped.`, `سيتم تخطي ${skipped} صفًا تالفًا.`)}</p>` : ''}
      ${lost.length ? `<div class="rpg-warn">${L2('⚠ This backup has fewer items than you have now. Restoring replaces everything, so the extra items will be gone.', '⚠ هذه النسخة فيها عناصر أقل مما لديك الآن. الاستعادة تستبدل كل شيء، فستضيع العناصر الإضافية.')}</div>` : ''}
      <p class="meta">${L2('Restoring replaces all current data with the backup.', 'الاستعادة تستبدل كل البيانات الحالية بالنسخة.')}</p>
      <div class="dlg-actions"><button type="button" class="ghost" data-rp="0">${L2('Cancel', 'إلغاء')}</button><button type="button" class="btn ${lost.length ? 'danger' : ''}" data-rp="1">${L2('Restore', 'استعادة')}</button></div></div>`;
    const done = (v) => {
      dlg.removeEventListener('click', h);
      dlg.removeEventListener('close', c);
      if (dlg.open) dlg.close();
      res(v);
    };
    const h = (e) => {
        const b = e.target.closest('[data-rp]');
        if (b) done(b.dataset.rp === '1');
      },
      c = () => done(false);
    dlg.addEventListener('click', h);
    dlg.addEventListener('close', c);
    if (!dlg.open) dlg.showModal();
  });
}
async function restore(text, source, silent) {
  text = (text || '').replace(/^\uFEFF/, '').trim();
  if (!text)
    throw new Error(
      source === 'file'
        ? 'the file is empty (0 bytes), so the export never finished saving. Export again, or use "Copy backup text" instead.'
        : 'nothing was pasted.'
    );
  let d;
  try {
    d = JSON.parse(text);
  } catch (e) {
    throw new Error(
      `the ${source} is cut off or isn't valid JSON (${(text.length / 1024).toFixed(1)} KB). Export it again, or use "Copy backup text" instead.`
    );
  }
  if (!d || !Array.isArray(d.tasks) || !Array.isArray(d.goals)) throw new Error("that isn't a GoalTerra backup.");
  const rows = {};
  let skipped = 0;
  for (const st of STORES) {
    const src = Array.isArray(d[st]) ? d[st] : [];
    rows[st] = src.filter((r) => {
      const ok =
        r && typeof r === 'object' && typeof r.id === 'string' && r.id && (st !== 'logs' || r.id.includes('|'));
      if (!ok) skipped++;
      return ok;
    });
  }
  const n =
    `${rows.tasks.length} tasks, ${rows.goals.length} goals, ${rows.habits.length} habits, ${rows.logs.length} check-ins` +
    (rows.topics.length || rows.exams.length ? `, ${rows.topics.length} topics, ${rows.exams.length} exams` : '') +
    (skipped ? ` (${skipped} damaged rows skipped)` : '');
  if (!silent && !(await restorePreview(d, rows, skipped))) return false;
  const snap = backupData();
  await snapSave('restore');
  try {
    for (const st of STORES) {
      await DB.clear(st);
      for (const row of rows[st]) await DB.put(st, row);
    }
  } catch (err) {
    try {
      for (const st of STORES) {
        await DB.clear(st);
        for (const row of snap[st] || []) await DB.put(st, row);
      }
      await load();
      render();
    } catch (_) {}
    throw new Error('the restore failed part-way, so your previous data was put back (' + err.message + ').');
  }
  if (d.settings && typeof d.settings === 'object') {
    const st = d.settings;
    if (st.cfg && typeof st.cfg === 'object') {
      const o = {};
      for (const k in CFG_DEF) if (k in st.cfg && typeof st.cfg[k] === typeof CFG_DEF[k]) o[k] = st.cfg[k];
      S.cfg = { ...CFG_DEF, ...o };
      saveCfg();
      applyLang();
    }
    if (typeof st.sound === 'boolean') Sound.set(st.sound);
    if (typeof st.hideDone === 'boolean') {
      S.hideDone = st.hideDone;
      try {
        localStorage.setItem('gt-hide-done', st.hideDone ? '1' : '0');
      } catch (e) {}
    }
    if (typeof st.compact === 'boolean') {
      S.compact = st.compact;
      try {
        localStorage.setItem('gt-compact', st.compact ? '1' : '0');
      } catch (e) {}
    }
  }
  await load();
  render();
  return n;
}

    <p class="meta">${copy ? 'Copy this and paste it somewhere safe, like a note or a message to yourself.' : 'Paste a backup you copied earlier. This replaces all current data.'}</p>
    <textarea name="text" spellcheck="false" style="min-height:180px;font:12px/1.4 ui-monospace,monospace" ${copy ? 'readonly' : 'placeholder="Paste backup here…"'}>${copy ? esc(JSON.stringify(backupData())) : ''}</textarea>

/**
 * Runs last: theme and palette, tooltips, keyboard handling, archiving on start-up, and the timers that start once everything is loaded.

/* ---------- Tooltips (hover + tap) ---------- */
const tip = $('#tip');
let tipEl = null;
function showTip(el, x, y) {
  tipEl = el;
  tip.textContent = el.dataset.tip;
  const r = tip.getBoundingClientRect();
  const half = r.width / 2 + 8;
  tip.style.left = Math.min(Math.max(x, half), innerWidth - half) + 'px';
  tip.style.top = Math.max(y, r.height + 14) + 'px';
  tip.classList.add('show');
}
function hideTip() {
  tipEl = null;
  tip.classList.remove('show');
}
document.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest('[data-tip]');
  el ? showTip(el, e.clientX, e.clientY) : hideTip();
});
document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse') return;
  const el = e.target.closest('[data-tip]');
  if (el) {
    const r = el.getBoundingClientRect();
    showTip(el, r.left + r.width / 2, r.top);
  } else hideTip();
});
addEventListener('scroll', hideTip, { passive: true });

/* Keyboard handling.
   Tapping a text field inside a form docks that form to the bottom edge, right above the keyboard
   (like a chat box). The field is then always visible and the page behind it is never scrolled, so
   there is no jump to the end of the page. The tab bar is hidden while typing. */
(() => {
  const vv = window.visualViewport,
    vh = () => (vv ? vv.height : innerHeight),
    root = document.documentElement;
  let maxH = innerHeight,
    lastW = innerWidth,
    docked = null,
    spacer = null,
    undockT;
  const typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
  const upd = () => {
    if (innerWidth !== lastW) {
      lastW = innerWidth;
      maxH = innerHeight;
    }
    maxH = Math.max(maxH, innerHeight, vh());
    root.classList.toggle('kb', vh() < maxH - 120 && typing());
  };
  const undock = () => {
    if (docked) docked.classList.remove('kbdock');
    if (spacer) spacer.remove();
    docked = spacer = null;
  };
  const dock = (form) => {
    clearTimeout(undockT);
    if (docked === form) return;
    undock();
    spacer = document.createElement('div');
    spacer.style.height = form.offsetHeight + 'px';
    form.before(spacer);
    form.classList.add('kbdock');
    docked = form;
  };
  document.addEventListener('focusin', (ev) => {
    const e = ev.target,
      form = e.closest && e.closest('form');
    if (/^(INPUT|TEXTAREA)$/.test(e.tagName) && form && !e.closest('dialog, header, .top')) dock(form);
    else if (docked && !docked.contains(e)) undock();
    upd();
  });
  document.addEventListener('focusout', (ev) => {
    if (docked && !docked.contains(ev.relatedTarget)) {
      clearTimeout(undockT);
      undockT = setTimeout(() => {
        if (!docked || !docked.contains(document.activeElement)) undock();
      }, 350);
    }
    setTimeout(upd, 200);
  });
  addEventListener('resize', upd);
  if (vv) vv.addEventListener('resize', upd);
})();
</script>
