name: Android APK

# Builds the GoalTerra Android app from goal-tracker.html on every change, and on demand.
on:
  push:
    branches: [main]
    paths:
      - goal-tracker.html
      - android-app/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: android-app
        run: npm ci

      - name: Copy the web app into the Android project
        working-directory: android-app
        run: npm run sync

      - name: Build the APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the app version
        id: apk
        run: |
          V=$(grep -o "const APP_VERSION='[^']*'" goal-tracker.html | cut -d"'" -f2)
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "GoalTerra-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "file=GoalTerra-$V.apk" >> "$GITHUB_OUTPUT"
          ls -la "GoalTerra-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GoalTerra-${{ steps.apk.outputs.version }}-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30
