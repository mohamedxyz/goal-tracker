name: Android APK

# Builds the GoalTerra Android app from goal-tracker.html on every change, and on demand.
on:
  push:
    branches: [main]
    paths:
      - goal-tracker.html
      - android-app/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # ubuntu-24.04 ships the Android SDK; ubuntu-latest moved to Ubuntu 26 in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        working-directory: android-app
        run: npm ci

      - name: Check goal-tracker.html matches src/
        run: node build.mjs --check
      - name: Copy the web app into the Android project
        working-directory: android-app
        run: npm run sync

      - name: Build the APK
        working-directory: android-app/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          f=android-app/android/build.log
          [ -f "$f" ] || { echo "::error::no build log (failed before the Gradle build)"; exit 0; }
          grep -nE "FAILURE|What went wrong|error:|Error:|> " "$f" | head -40 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=gradle::/'
          tail -50 "$f" | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=tail::/'

      - name: Name the APK after the app version
        id: apk
        run: |
          V=$(grep -o "const APP_VERSION='[^']*'" goal-tracker.html | cut -d"'" -f2)
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "GoalTerra-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "file=GoalTerra-$V.apk" >> "$GITHUB_OUTPUT"
          ls -la "GoalTerra-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GoalTerra-${{ steps.apk.outputs.version }}-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publish as a GitHub release (download the APK on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.apk.outputs.version }}
          TAG="android-v$V"
          NOTES="GoalTerra $V for Android. Install GoalTerra-$V.apk (allow installs from your browser or Files app the first time). Updates install over the old version and keep your data."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.file }}" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" --title "GoalTerra $V (Android)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
